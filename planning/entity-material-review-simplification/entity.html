let activeTab='entity',stateVersion=2,selectedMaterial='M2597';const comments={},accepted={};

 $('entity-tab').setAttribute('aria-selected',String(activeTab==='entity'));$('state-tab').setAttribute('aria-selected',String(activeTab==='state'));
 const left=$('left');left.replaceChildren();

 const helpAnchor=txt('span','','help-anchor'),helpBtn=button('?',()=>{help.hidden=false});helpBtn.setAttribute('aria-label','查看审阅标准');const help=txt('div','','help');help.hidden=true;const list=txt('ul','');(m.criteria.length?m.criteria:['结合当前状态判断身份、结构、动作是否适用。','按真实原件判断画面，不由既有认可推断当前用途。']).forEach(s=>list.append(txt('li',s)));help.append(list);helpAnchor.append(helpBtn,help);let timer;helpBtn.onmouseenter=()=>timer=setTimeout(()=>{help.hidden=false},700);helpBtn.onmouseleave=()=>clearTimeout(timer);helpAnchor.onmouseleave=()=>{help.hidden=true};helpBtn.onfocus=()=>{help.hidden=false};helpBtn.onblur=()=>{help.hidden=true};actions.append(helpAnchor);right.append(actions,txt('p','','status'));right.lastChild.id='local-status';

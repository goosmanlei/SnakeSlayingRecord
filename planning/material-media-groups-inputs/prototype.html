function renderGraph(){const main=$('main'),scope=el('div',undefined,'toolbar scope');const ep=el('select'),sc=el('select');ep.setAttribute('aria-label','按集筛选');sc.setAttribute('aria-label','按场筛选');ep.append(new Option('全部集','all'));[...new Set(D.scenes.map(s=>s.episode))].sort().forEach(e=>ep.append(new Option('第 '+Number(e.slice(1))+' 集',e)));ep.value=episode;sc.append(new Option('全部场','all'));D.scenes.filter(s=>episode==='all'||s.episode===episode).forEach(s=>sc.append(new Option(s.code+' · '+s.title,s.id)));sc.value=scene;ep.onchange=()=>{episode=ep.value;scene='all';renderGraphReplace()};sc.onchange=()=>{scene=sc.value;renderGraphReplace()};scope.append(ep,sc,btn('李寄',()=>openCard('entity-li-ji')),btn('EN046 · 三道滩',()=>openCard('entity-boat-song')),btn('ASH001',()=>openCard('av-e01-a01-s01')));main.append(scope);

}
function renderGraphReplace(){$('main').replaceChildren();renderGraph()}
function openCard(id){const r=D.cards[id];if(!r){if(id===D.material003.id)return openM003();const n=D.nodes.find(n=>n.id===id);$('reference-title').textContent=n?n.code+' · '+n.title:id;$('reference-content').replaceChildren(el('p','此节点名称及位置来自当前库；完整大卡交互请使用李寄、EN046、ASH001。','muted'));$('reference').showModal();return}const root=$('overlay-root');root.replaceChildren();const box=el('section',undefined,'overlay'),h=el('div',undefined,'overlay-head');h.append(el('h2',r.code+' · '+r.p.title),btn('关闭',()=>root.replaceChildren()));box.append(h);root.append(box);buildWorkspace(box,r)}
function addSources(parent,r){const list=el('div',undefined,'source-list');r.sourceKeys.forEach(s=>list.append(btn(s.label,()=>showSource(s))));parent.append(list)}
function showSource(s){const src=D.sources[s.key];$('source-title').textContent=src.title;const body=$('source-content');body.className='scene-text';body.replaceChildren();src.blocks.forEach(b=>{const p=el('p');if(s.highlight.includes(b.id)){const m=el('mark',b.text);p.append(m)}else p.textContent=b.text;body.append(p)});$('source').showModal();body.querySelector('mark')?.scrollIntoView({block:'center'})}

 const drawLeft=()=>{left.replaceChildren();left.append(el('h3',r.kind==='AV_SHOT'?'叙事目的':'基础信息'));if(r.kind==='AV_SHOT')left.append(el('p',r.p.purpose,'basic'));else if(r.p.entity_type==='song'){const blocks=r.p.blocks||[];left.append(el('p',blocks.find(b=>b.id==='description')?.text||''));left.append(el('h3','完整词稿'));const lyrics=el('div',undefined,'lyrics');blocks.filter(b=>b.id.startsWith('lyrics-section')).forEach(b=>lyrics.append(el('p',b.text)));left.append(lyrics,el('h3','剧中演唱选段'));(r.p.lyrics||[]).forEach(l=>left.append(el('p',l.section+'：'+l.text,'basic')))}else left.append(el('p',r.p.blocks?.[0]?.text||r.p.production_description||'','basic'));addSources(left,r);
  const tabs=el('div',undefined,'tabs');tabs.setAttribute('role','tablist');const tabData=r.kind==='AV_SHOT'?(r.sampleProducts||r.p.products||[]).map((p,i)=>['product'+i,p.label]):[['entity','实体素材'],['states','实体状态']];tabData.forEach(([key,name])=>{const b=btn(name,()=>{local.tab=key;local.material=null;local.mode='current';drawLeft()},key===local.tab?'on':'');b.setAttribute('role','tab');b.setAttribute('aria-selected',String(key===local.tab));tabs.append(b)});left.append(tabs);let materialIds=[];
  if(r.kind==='AV_SHOT'){const index=Number(local.tab.replace('product','')),product=(r.sampleProducts||r.p.products)[index];if(product?.label==='镜头首帧')(r.p.key_states||[]).forEach(s=>left.append(el('p',s.description,'basic')));materialIds=product?[product.requirement.object_id]:[]}
  else if(local.tab==='entity')materialIds=r.requirements;
  else{const choices=el('div',undefined,'state-grid');r.states.forEach((s,i)=>choices.append(btn(s.code+' · '+s.p.title,()=>{local.state=i;local.material=null;local.mode='current';drawLeft()},i===local.state?'on':'')));left.append(choices);const s=r.states[local.state];if(s){left.append(el('p',s.p.blocks?.[0]?.text||s.p.production_description||'','basic'));materialIds=s.requirements}}
  const list=el('div',undefined,'material-list');materialIds.forEach(id=>{const m=D.materials[id];if(!m)return;const b=btn('',()=>{local.material=id;local.mode='current';drawLeft()},'material-button'+(local.material===id?' on':''));b.append(el('strong',m.code+' · '+m.p.title),el('small',m.p.media_type==='video'?'视频制作方案':m.p.media_type==='audio'?'音频制作方案':'图像制作方案'));list.append(b)});left.append(list);if(!materialIds.includes(local.material))local.material=materialIds[0]||null;drawRight();
 };
 const drawRight=()=>{right.replaceChildren();const m=D.materials[local.material];if(!m){right.append(el('p','此范围暂未准备素材方案。','placeholder'));return}const nav=el('div',undefined,'reader-nav');nav.append(btn('当前方案',()=>{local.mode='current';drawRight()},'on'),el('span','历史候选 · 尚无此方案的真实候选','candidate muted'));right.append(nav,el('h2',m.code+' · '+m.p.title));renderPlan(right,m);};drawLeft();
}
function showReference(ref){$('reference-title').textContent=ref.code+' · '+ref.title;const body=$('reference-content');body.replaceChildren();if(ref.p?.generation){body.append(el('h3','参考的准确方案'),el('p',ref.p.generation.prompt||'未记录 Prompt','prompt'))}else(ref.p?.blocks||[]).forEach(b=>body.append(el('p',b.text,'basic')));if(!body.childNodes.length)body.append(el('p','准确来源已定位；此样例不载入原件播放。'));$('reference').showModal()}
function renderPlan(parent,m){const g=m.p.generation;if(!g){parent.append(el('p','当前方案尚未准备。','placeholder'));return}parent.append(el('div','尚未生成','placeholder'));const controls=el('div',undefined,'toolbar');controls.append(btn('评论方案',()=>alert('交互样例：在准确当前方案留下意见；本页不保存业务数据。')));parent.append(controls,el('h3','参考素材'));const refs=el('div',undefined,'reference-grid');(m.refs||[]).forEach((r,i)=>{const b=btn('',()=>showReference(r),'reference-card');b.append(el('strong',r.code+' · '+r.title),el('small',r.kind==='ASSET'?'准确原件':'参考方案 · 尚未选定原件'));refs.append(b)});if(!(m.refs||[]).length)refs.append(el('p','无参考素材','muted'));parent.append(refs,el('h3','参数 · '+(g.model||g.method)),el('pre',JSON.stringify(Object.fromEntries(Object.entries(g.parameters||{}).filter(([k])=>!['project_id','projectId'].includes(k))),null,2),'parameters'),el('h3','Prompt'));const prompt=el('div',undefined,'prompt');let imageNo=0,audioNo=0;const named=(m.refs||[]).map(r=>({...r,label:r.media==='audio'?'音频'+(++audioNo):'图片'+(++imageNo)}));const parts=(g.prompt||'此方案尚未填写 Prompt。').split(/(@?(?:图片|音频)\d+)/g);parts.forEach(part=>{const ref=named.find(r=>r.label===part.replace(/^@/,''));if(ref){const b=btn('@'+ref.title,()=>showReference(ref));b.title=ref.code+' · '+ref.title;prompt.append(b)}else prompt.append(document.createTextNode(part))});parent.append(prompt)}

function renderAV(){const main=$('main');main.append(el('h2','第 1 集 · 两份米'),el('p','AS001 · 唱到跳页处','subtitle'));const embed=el('section',undefined,'embedded');embed.append(el('h2','ASH001 · 阿蘅翻过两页'));main.append(embed);buildWorkspace(embed,D.cards['av-e01-a01-s01']);main.append(el('p','与实体图内的 ASH001 使用同一个镜头部件、同一准确当前方案。样例只展开本镜，并涵盖它现有主机位、首帧和视频三项直属需求，不冒充全场交付；其他镜头还须按实际包含反机位或字层工程。','muted'))}

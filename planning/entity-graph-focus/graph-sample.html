c4d382354de741707f4b25c4223a52", "endpoints": ["entity-grain", "entity-rice-bag"], "summary": "盛装米粮", "direction": "related", "derived": false}, {"id": "relation-69ce48324cb4fa9f043ff387684ff007", "endpoints": ["entity-a-heng", "entity-li-ji"], "summary": "从一起撑布到换手抄词，相互照应并保留各自决定。", "direction": "related", "derived": false}, {"id": "relation-8399c2b591640f89637e61f5c931a11d", "endpoints": ["entity-a-heng", "entity-rice-bag"], "summary": "携带唱曲所得米", "direction": "related", "derived": false}, {"id": "relation-88de3c44cce156d3d25f36f8741c1a19", "endpoints": ["entity-a-heng", "entity-zhou"], "summary": "安排唱活并付米", "direction": "related", "derived": false}, {"id": "relation-88e58a3478eafbe4a5256704407a4a7e", "endpoints": ["entity-rice-shop", "entity-zhou"], "summary": "经营米铺", "direction": "related", "derived": false}, {"id": "relation-d9c0c33c8956fff60ebea986cd3236c0", "endpoints": ["entity-rice-measure", "entity-zhou"], "summary": "量米付唱工", "direction": "related", "derived": false}, {"id": "relation-db6b7c0defc1ff09e38ad63ab3379b0d", "endpoints": ["entity-li-ji", "entity-paste-wool"], "summary": "劳作后手上附着", "direction": "related", "derived": false}, {"id": "relation-e28a58ebe2d6cf44a67741631de7c338", "endpoints": ["entity-grain", "entity-rice-measure"], "summary": "计量米粮", "direction": "related", "derived": false}]}};let scene='AS001',shot='ASH001';const groups={AS001:['ASH001','ASH002'],AS002:['ASH006']};const names={AS001:'唱到跳页处',AS002:'工钱与预付'};
function btn(text,pressed,fn){let b=document.createElement('button');b.textContent=text;b.setAttribute('aria-pressed',pressed);b.onclick=fn;return b}
function draw(){document.querySelector('#scenes').replaceChildren(...Object.keys(groups).map(s=>btn(s+' · '+names[s],s===scene,()=>{scene=s;shot=groups[s][0];draw()})));document.querySelector('#shots').replaceChildren(...groups[scene].map(s=>btn(s+' · '+DATA[s].title.replace(/^\d+ · A\d+ · \d+ /,''),s===shot,()=>{shot=s;draw()})));
let d=DATA[shot],nodes=d.nodes,adj=new Map(nodes.map(n=>[n.id,[]]));for(let e of d.edges){adj.get(e.endpoints[0]).push(e.endpoints[1]);adj.get(e.endpoints[1]).push(e.endpoints[0])}let remaining=new Set(nodes.map(n=>n.id)),positions={},ybase=20,maxw=900;
while(remaining.size){let root=[...remaining].sort((a,b)=>adj.get(b).length-adj.get(a).length)[0],q=[[root,0]],layers=[];remaining.delete(root);for(let i=0;i<q.length;i++){let [id,l]=q[i];(layers[l]??=[]).push(id);for(let nb of adj.get(id))if(remaining.has(nb)){remaining.delete(nb);q.push([nb,l+1])}}let height=Math.max(...layers.map(x=>x.length))*160;layers.forEach((ids,l)=>ids.forEach((id,j)=>positions[id]={x:20+l*430,y:ybase+j*160+(height-ids.length*160)/2}));maxw=Math.max(maxw,layers.length*430);ybase+=height+35}
let svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('width',maxw);svg.setAttribute('height',ybase);function elem(tag,attrs,text){let el=document.createElementNS(svg.namespaceURI,tag);for(let k in attrs)el.setAttribute(k,attrs[k]);if(text)el.textContent=text;return el}

for(let n of nodes){let pos=positions[n.id],g=elem('g',{class:'node',tabindex:0,role:'button','aria-label':n.code+' '+n.title,transform:`translate(${pos.x},${pos.y})`});g.append(elem('rect',{width:220,height:86,rx:5,fill:n.code===shot?'#e1ecd8':'#fffdf6',stroke:'#a8bca0'}),elem('text',{x:15,y:27},n.code));let t=n.title.replace(/^\d+ · A\d+ · \d+ /,'');g.append(elem('text',{x:15,y:55},t.length>15?t.slice(0,15)+'…':t));g.onclick=()=>{let el=document.querySelector('#detail');el.querySelector('h2').textContent=n.code;el.querySelector('p').textContent=n.title;el.showModal()};g.onkeydown=e=>{if(e.key==='Enter')g.onclick()};svg.append(g)}document.querySelector('#graph').replaceChildren(svg);document.querySelector('#count').textContent=nodes.length+' 个实体 · '+d.edges.length+' 条关系'}draw();</script>

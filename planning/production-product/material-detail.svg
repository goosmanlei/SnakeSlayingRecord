<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1230" viewBox="0 0 1600 1230" role="img" aria-labelledby="title desc">
<title id="title">共用素材详情：关系、方案与候选比较</title><desc id="desc">示例是从正面视频方案的首帧位置进入首帧图需求。左侧说明用途、故事依据和生产关系，右侧选择准确方案与候选。比较可跨方案，点击用于此处才修改目标参考。</desc>
<style>text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#183247} .muted{fill:#5C7081}</style>
<rect x="0" y="0" width="1600" height="1230" rx="0" fill="#F3F6F8"/>
<text x="52" y="46" font-size="17" font-weight="600" style="fill:#176C62">03 / 共用素材详情</text>
<text x="52" y="88" font-size="34" font-weight="650" style="fill:#183247">同一需求，从实体、镜头与素材库进入都一致</text>
<text x="52" y="123" font-size="20" font-weight="400" style="fill:#5C7081">静态布局示意 · 本图展示“选择参考”并展开双候选比较的情境，媒体区域为占位</text>
<rect x="48" y="152" width="1504" height="972" rx="15" fill="#FFFFFF" stroke="#D8E1E7"/>
<text x="73" y="195" font-size="27" font-weight="650" style="fill:#183247">首帧图 · 镜头 A1</text>
<text x="850" y="193" font-size="20" font-weight="400" style="fill:#5C7081">用途与关系  /  方案与参考  /  候选与反馈</text>
<rect x="67" y="217" width="1465" height="67" rx="9" fill="#EDF4FC"/>
<text x="87" y="257" font-size="23" font-weight="600" style="fill:#245C93">用于：正面视频 · 视频方案 2 · 首帧</text>
<text x="912" y="256" font-size="20" font-weight="400" style="fill:#245C93">正在浏览参考候选；点击“用于此处”才保存。</text>
<line x1="484" y1="309" x2="484" y2="1095" stroke="#D8E1E7"/>
<text x="76" y="339" font-size="23" font-weight="650" style="fill:#183247">需求与用途</text>
<text x="76" y="378" font-size="20" font-weight="400" style="fill:#183247">为镜头 A1 提供准确起始画面，</text>
<text x="76" y="410" font-size="20" font-weight="400" style="fill:#183247">明确机位、人物状态与动作起点。</text>
<text x="76" y="472" font-size="23" font-weight="650" style="fill:#183247">来源与位置</text>
<text x="76" y="511" font-size="19" font-weight="400" style="fill:#183247">故事依据：故事场 S001 · 准确正文 ›</text>
<text x="76" y="546" font-size="19" font-weight="400" style="fill:#183247">视听位置：第一集 / 场 A / 镜头 A1 ›</text>
<text x="76" y="581" font-size="19" font-weight="400" style="fill:#183247">角色状态：日常状态 ›</text>
<line x1="77" y1="613" x2="459" y2="613" stroke="#D8E1E7"/>
<text x="76" y="653" font-size="23" font-weight="650" style="fill:#183247">本需求的生产关系</text>
<rect x="76" y="678" width="385" height="80" rx="9" fill="#EAF6F2"/>
<text x="91" y="708" font-size="20" font-weight="600" style="fill:#176C62">角色基础定妆 → 首帧图</text>
<text x="91" y="739" font-size="18" font-weight="400" style="fill:#5C7081">必需 · 保留身份与比例</text>
<rect x="76" y="774" width="385" height="80" rx="9" fill="#EAF6F2"/>
<text x="91" y="804" font-size="20" font-weight="600" style="fill:#176C62">空间全景 → 首帧图</text>
<text x="91" y="835" font-size="18" font-weight="400" style="fill:#5C7081">必需 · 保留布局与相对位置</text>
<rect x="76" y="870" width="385" height="80" rx="9" fill="#EDF4FC"/>
<text x="91" y="900" font-size="20" font-weight="600" style="fill:#245C93">首帧图 → 正面视频</text>
<text x="91" y="931" font-size="18" font-weight="400" style="fill:#5C7081">作为起始画面；由视频方案选定</text>
<text x="76" y="1002" font-size="18" font-weight="400" style="fill:#5C7081">这里说明制作需要与用途。</text>
<text x="76" y="1032" font-size="18" font-weight="400" style="fill:#5C7081">具体选用了什么，由右侧方案</text>
<text x="76" y="1062" font-size="18" font-weight="400" style="fill:#5C7081">及各候选的真实输入分别说明。</text>
<text x="510" y="337" font-size="23" font-weight="650" style="fill:#183247">素材方案</text>
<rect x="674" y="310" width="224" height="36" rx="7" fill="#EDF4FC"/>
<text x="686" y="335" font-size="19" font-weight="500" style="fill:#245C93">首帧方案 2 ▾</text>
<rect x="1310" y="310" width="199" height="36" rx="7" fill="#F3F6F8"/>
<text x="1322" y="335" font-size="19" font-weight="500" style="fill:#183247">评论当前方案</text>
<text x="510" y="382" font-size="20" font-weight="400" style="fill:#183247">完整需求、方法、模型参数与提示词，可在当前方案内展开。</text>
<rect x="510" y="404" width="998" height="102" rx="8" fill="#F7F9FB"/>
<text x="528" y="438" font-size="20" font-weight="400" style="fill:#183247">本方案参考：角色基础定妆 · 方案 1 · 候选 3</text>
<text x="528" y="474" font-size="20" font-weight="400" style="fill:#245C93">空间全景 · 方案 2 · 候选 1       查看准确原件与用途 ›</text>
<text x="510" y="552" font-size="23" font-weight="650" style="fill:#183247">候选比较</text>
<text x="688" y="552" font-size="19" font-weight="400" style="fill:#5C7081">同一需求内选两份候选，可来自不同方案</text>
<rect x="510" y="576" width="490" height="500" rx="10" fill="#FFFFFF" stroke="#D8E1E7"/>
<text x="529" y="613" font-size="22" font-weight="650" style="fill:#183247">首帧方案 1 · 候选 1</text>
<text x="529" y="647" font-size="18" font-weight="400" style="fill:#5C7081">较早方案的候选</text>
<rect x="529" y="666" width="452" height="212" rx="8" fill="#E9EEF2"/>
<text x="648" y="773" font-size="24" font-weight="500" style="fill:#5C7081">图像预览占位</text>
<text x="639" y="807" font-size="18" font-weight="400" style="fill:#5C7081">示例，不是真实候选</text>
<text x="529" y="916" font-size="20" font-weight="400" style="fill:#245C93">查看本候选真实输入与生成信息 ›</text>
<text x="529" y="955" font-size="19" font-weight="400" style="fill:#5C7081">放大原件  /  查看与添加候选评论</text>
<rect x="529" y="998" width="205" height="36" rx="7" fill="#F3F6F8"/>
<text x="541" y="1023" font-size="19" font-weight="500" style="fill:#183247">用于此处</text>
<text x="754" y="1023" font-size="18" font-weight="400" style="fill:#5C7081">只更新顶部目标</text>
<rect x="1018" y="576" width="490" height="500" rx="10" fill="#FFFFFF" stroke="#245C93"/>
<text x="1037" y="613" font-size="22" font-weight="650" style="fill:#245C93">首帧方案 2 · 候选 2</text>
<text x="1037" y="647" font-size="18" font-weight="400" style="fill:#5C7081">当前用于比较的候选</text>
<rect x="1037" y="666" width="452" height="212" rx="8" fill="#E9EEF2"/>
<text x="1156" y="773" font-size="24" font-weight="500" style="fill:#5C7081">图像预览占位</text>
<text x="1147" y="807" font-size="18" font-weight="400" style="fill:#5C7081">示例，不是真实候选</text>
<text x="1037" y="916" font-size="20" font-weight="400" style="fill:#245C93">查看本候选真实输入与生成信息 ›</text>
<text x="1037" y="955" font-size="19" font-weight="400" style="fill:#5C7081">放大原件  /  查看与添加候选评论</text>
<rect x="1037" y="998" width="205" height="36" rx="7" fill="#EDF4FC"/>
<text x="1049" y="1023" font-size="19" font-weight="500" style="fill:#245C93">用于此处</text>
<text x="1262" y="1023" font-size="18" font-weight="400" style="fill:#5C7081">只更新顶部目标</text>
<text x="52" y="1164" font-size="20" font-weight="400" style="fill:#5C7081">普通浏览不显示“用于此处”。比较与播放只改变阅读内容；明确选择也不等于全局认可或唯一最佳。</text>
</svg>

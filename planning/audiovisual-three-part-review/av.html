function node(tag,text,cls){const el=document.createElement(tag);el.textContent=text;if(cls)el.className=cls;return el}
function drawPlan(){const plan=$('plan');plan.replaceChildren();for(const b of $('tabs').children)b.setAttribute('aria-selected',b.dataset.key===active?'true':'false');const m=data.existing_materials[active],g=m.current_generation;plan.append(node('h2','参考素材'));const list=node('ul','','reference-list');for(const i of g.inputs){const range=i.range?` · ${i.range.start_seconds}—${i.range.end_seconds}秒`:'';list.append(node('li',`${i.code||''} · ${i.title||i.reference.object_id}${range}`))}plan.append(list,node('h2','生成参数'),node('pre',JSON.stringify({model:g.model,...g.parameters},null,2)),node('h2','Prompt'),node('pre',g.prompt||'此需求没有生成 Prompt'))}
function draw(){const simple=sample==='simple';$('simple-location').style.display=simple?'flex':'none';clearTimeout(timer);$('hover-plan').hidden=true;$('choose-simple').setAttribute('aria-selected',String(simple));$('choose-complex').setAttribute('aria-selected',String(!simple));$('shot-title').textContent=simple?'ASH001 · 阿蘅翻过两页':data.complex_state_sample.shot_code+' · 转牌揭名';$('purpose').textContent=simple?data.proposed_narrative_intention.text:data.complex_state_sample.intention;const states=simple?data.proposed_key_states.filter(s=>s.status!=='counterexample_not_to_create').map(s=>({...s,requirements:s.material_requirements})):data.complex_state_sample.states;$('states').replaceChildren();$('material-selection').textContent='';for(const s of states){const block=node('article','','state');block.append(node('h3',s.name),node('p',s.description));for(const m of s.requirements){const button=node('button',m.code+' · '+m.title,'material');button.onclick=()=>{if(simple){active='first_frame';drawPlan();$('generation').scrollIntoView({block:'start',behavior:'smooth'});$('material-selection').textContent='已定位同一准确首帧需求 M2974，未复制需求。'}else $('material-selection').textContent='样例选中 '+m.code+'；这个状态引用现有准确需求，未创建新素材或保存选择。'};block.append(button)}$('states').append(block)}$('generation').hidden=!simple;if(simple){$('tabs').replaceChildren();for(const [key,label] of [['first_frame','镜头首帧'],['video','镜头视频']]){const b=node('button',label);b.dataset.key=key;b.setAttribute('role','tab');b.onclick=()=>{active=key;drawPlan()};$('tabs').append(b)}drawPlan()}}
$('choose-simple').onclick=()=>{sample='simple';draw()};$('choose-complex').onclick=()=>{sample='complex';draw()};let timer;for(const target of document.querySelectorAll('.hover-target')){target.addEventListener('mouseenter',()=>{clearTimeout(timer);timer=setTimeout(()=>{const box=$('hover-plan'),r=target.getBoundingClientRect();box.textContent=target.dataset.plan;box.style.left=r.left+'px';box.style.top=r.bottom+6+'px';box.hidden=false},1000)});target.addEventListener('mouseleave',()=>{clearTimeout(timer);$('hover-plan').hidden=true});target.addEventListener('focus',()=>target.dispatchEvent(new Event('mouseenter')));target.addEventListener('blur',()=>target.dispatchEvent(new Event('mouseleave')))}draw();
</script></html>

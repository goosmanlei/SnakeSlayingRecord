<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1630" viewBox="0 0 1600 1630" role="img" aria-labelledby="title description">
<title id="title">同一素材关系的三个层次：计划、准确选择、真实使用</title><desc id="description">建议的数据分层 · 以下“湿衣定妆”仅为示例；关系、选择和执行各保存自己的事实。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#71869b"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#348269"/></marker></defs>
<style>text {font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;} path {stroke-linejoin:round;stroke-linecap:round;}</style>
<rect width="1600" height="1630" fill="#fbfcfe"/>
<text x="40" y="62" font-size="34" fill="#19314b" font-weight="700" text-anchor="start">同一素材关系的三个层次：计划、准确选择、真实使用</text>
<text x="40" y="104" font-size="20" fill="#52667b" font-weight="400" text-anchor="start">建议的数据分层 · 以下“湿衣定妆”仅为示例；关系、选择和执行各保存自己的事实。</text>
<text x="40" y="166" font-size="27" fill="#19314b" font-weight="700" text-anchor="start">01  需求关系：为什么需要上游</text>
<rect x="40" y="193" width="520" height="124" rx="16" fill="#edf8f2" stroke="#91bca8" stroke-width="1.7"/>
<text x="62" y="235" font-size="27" fill="#19314b" font-weight="650" text-anchor="start">M-A：基础定妆需求</text>
<text x="62" y="270" font-size="22" fill="#52667b" font-weight="400" text-anchor="start">角色／基础状态 · 形成身份参考</text>
<rect x="980" y="193" width="580" height="124" rx="16" fill="#edf8f2" stroke="#91bca8" stroke-width="1.7"/>
<text x="1002" y="235" font-size="27" fill="#19314b" font-weight="650" text-anchor="start">M-B：湿衣定妆需求</text>
<text x="1002" y="270" font-size="21" fill="#52667b" font-weight="400" text-anchor="start">角色／湿衣状态 · 保留身份，改变衣物湿态</text>
<path d="M562,254 L970,254" fill="none" stroke="#348269" stroke-width="2.5" marker-end="url(#green)"/>
<text x="760" y="224" font-size="23" fill="#286852" font-weight="600" text-anchor="middle">身份参考／必需前置</text>
<text x="760" y="295" font-size="20" fill="#52667b" font-weight="400" text-anchor="middle">尚未选定具体候选</text>
<rect x="40" y="350" width="1520" height="110" rx="16" fill="#fff7e8" stroke="#d8b76d" stroke-width="1.7"/>
<text x="62" y="392" font-size="26" fill="#19314b" font-weight="650" text-anchor="start">这条关系还须说明适用语境与方案范围</text>
<text x="62" y="427" font-size="22" fill="#52667b" font-weight="400" text-anchor="start">保留脸型与比例；允许改变衣物湿态；记录依据、检查目标及何时生效。</text>
<text x="40" y="525" font-size="27" fill="#19314b" font-weight="700" text-anchor="start">02  方案中的准确选择：这版到底用哪一份</text>
<rect x="40" y="554" width="520" height="172" rx="16" fill="#edf5ff" stroke="#99b8d9" stroke-width="1.7"/>
<text x="62" y="596" font-size="28" fill="#19314b" font-weight="650" text-anchor="start">M-A / V2 / C1</text>
<text x="62" y="631" font-size="21" fill="#52667b" font-weight="400" text-anchor="start">准确候选修订 + original 原件</text>
<text x="62" y="661" font-size="21" fill="#52667b" font-weight="400" text-anchor="start">哈希、文件组成、必要局部范围</text>
<text x="62" y="691" font-size="21" fill="#52667b" font-weight="400" text-anchor="start">选择不修改 M-A 的方案</text>
<rect x="980" y="554" width="580" height="172" rx="16" fill="#edf5ff" stroke="#99b8d9" stroke-width="1.7"/>
<text x="1002" y="596" font-size="28" fill="#19314b" font-weight="650" text-anchor="start">M-B / V1 的身份参考位置</text>
<text x="1002" y="631" font-size="21" fill="#52667b" font-weight="400" text-anchor="start">绑定 M-A / V2 / C1 的准确原件</text>
<text x="1002" y="661" font-size="21" fill="#52667b" font-weight="400" text-anchor="start">用途、次序、约束随完整方案保存</text>
<text x="1002" y="691" font-size="21" fill="#52667b" font-weight="400" text-anchor="start">首次实际提交后固定本版定义</text>
<path d="M562,638 L970,638" fill="none" stroke="#71869b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="760" y="608" font-size="23" fill="#19314b" font-weight="600" text-anchor="middle">明确绑定</text>
<text x="760" y="679" font-size="20" fill="#52667b" font-weight="400" text-anchor="middle">不能自动取最新结果</text>
<path d="M1270,728 L1270,847" fill="none" stroke="#71869b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="1310" y="798" font-size="21" fill="#52667b" font-weight="400" text-anchor="start">按此方案提交</text>
<text x="40" y="811" font-size="27" fill="#19314b" font-weight="700" text-anchor="start">03  实际执行与谱系：这次真实用了什么</text>
<rect x="40" y="861" width="520" height="176" rx="16" fill="#f3f5f8" stroke="#aab8c5" stroke-width="1.7"/>
<text x="62" y="903" font-size="27" fill="#19314b" font-weight="650" text-anchor="start">实际上传的原件与输入</text>
<text x="62" y="938" font-size="21" fill="#52667b" font-weight="400" text-anchor="start">真实输入清单与顺序</text>
<text x="62" y="968" font-size="21" fill="#52667b" font-weight="400" text-anchor="start">实际文件哈希、范围、模型、参数</text>
<text x="62" y="998" font-size="21" fill="#52667b" font-weight="400" text-anchor="start">与方案不同之处如实保留</text>
<rect x="980" y="861" width="580" height="176" rx="16" fill="#f3f5f8" stroke="#aab8c5" stroke-width="1.7"/>
<text x="1002" y="903" font-size="28" fill="#19314b" font-weight="650" text-anchor="start">实际执行 CALL-X</text>
<text x="1002" y="938" font-size="21" fill="#52667b" font-weight="400" text-anchor="start">提交／成功／失败／未知分别记录</text>
<text x="1002" y="968" font-size="21" fill="#52667b" font-weight="400" text-anchor="start">保存真实输出、回执与用量</text>
<text x="1002" y="998" font-size="21" fill="#52667b" font-weight="400" text-anchor="start">结果未知不等于已有候选</text>
<path d="M562,946 L970,946" fill="none" stroke="#71869b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="760" y="913" font-size="23" fill="#19314b" font-weight="600" text-anchor="middle">真实输入证据</text>
<path d="M1270,1039 L1270,1108" fill="none" stroke="#71869b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="820" y="1121" width="740" height="119" rx="16" fill="#edf8f2" stroke="#91bca8" stroke-width="1.7"/>
<text x="842" y="1163" font-size="28" fill="#19314b" font-weight="650" text-anchor="start">真实产出 → M-B / V1 / C1</text>
<text x="842" y="1198" font-size="22" fill="#52667b" font-weight="400" text-anchor="start">候选回查准确执行与原件；质量另行审阅。</text>
<rect x="40" y="1121" width="740" height="119" rx="16" fill="#edf8f2" stroke="#91bca8" stroke-width="1.7"/>
<text x="62" y="1163" font-size="27" fill="#19314b" font-weight="650" text-anchor="start">实际谱系从执行中取得</text>
<text x="62" y="1198" font-size="20" fill="#52667b" font-weight="400" text-anchor="start">A → B → C 的间接路径，不伪装成 C 直接输入了 A。</text>
<rect x="40" y="1280" width="1520" height="153" rx="16" fill="#fff7e8" stroke="#d8b76d" stroke-width="1.7"/>
<text x="62" y="1322" font-size="28" fill="#19314b" font-weight="650" text-anchor="start">上游产生新版时，保留旧输入并提示影响</text>
<text x="62" y="1357" font-size="23" fill="#52667b" font-weight="400" text-anchor="start">M-A/V3 的出现不会把 M-B/V1 改成使用 V3；更换已冻结方案的参考，应建立新方案版本。</text>
<text x="62" y="1387" font-size="23" fill="#52667b" font-weight="400" text-anchor="start">“有关联”“已选参考”“实际使用”“质量认可”分别判断，均不能互相代替。</text>
<text x="40" y="1497" font-size="20" fill="#52667b" font-weight="400" text-anchor="start">M-A / V2 / C1 = 某需求的方案版本 2 中的候选 1；original = 该候选的原件组成。</text>
<text x="40" y="1553" font-size="18" fill="#52667b" font-weight="400" text-anchor="start">此图为模型说明，未实际生成或上传任何素材；需求关系并不自动授予生成许可。</text>
</svg>

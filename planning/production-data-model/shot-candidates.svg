<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1500" viewBox="0 0 1600 1500" role="img" aria-labelledby="title description">
<title id="title">一个视听镜头：多个需求，各自拥有方案与候选</title><desc id="description">关系示例 · 正面与侧面若需独立交付，分别建立需求；首帧作为另一项图像需求。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#71869b"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#348269"/></marker></defs>
<style>text {font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;} path {stroke-linejoin:round;stroke-linecap:round;}</style>
<rect width="1600" height="1500" fill="#fbfcfe"/>
<text x="40" y="62" font-size="34" fill="#19314b" font-weight="700" text-anchor="start">一个视听镜头：多个需求，各自拥有方案与候选</text>
<text x="40" y="104" font-size="20" fill="#52667b" font-weight="400" text-anchor="start">关系示例 · 正面与侧面若需独立交付，分别建立需求；首帧作为另一项图像需求。</text>
<rect x="280" y="145" width="1040" height="116" rx="16" fill="#f2eefb" stroke="#b4a0d7" stroke-width="1.7"/>
<text x="302" y="187" font-size="29" fill="#19314b" font-weight="650" text-anchor="start">同一视听镜头：人物伸手接过物品</text>
<text x="302" y="222" font-size="21" fill="#52667b" font-weight="400" text-anchor="start">同一表达目标下的制作覆盖与备选；若表达单元已经独立，则另拆视听镜头。</text>
<path d="M800,263 L800,292" fill="none" stroke="#71869b" stroke-width="2.5"/>
<path d="M800,292 L280,292 L280,327" fill="none" stroke="#71869b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M800,292 L800,292 L800,327" fill="none" stroke="#71869b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M800,292 L1320,292 L1320,327" fill="none" stroke="#71869b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="340" width="480" height="116" rx="16" fill="#edf5ff" stroke="#99b8d9" stroke-width="1.7"/>
<text x="62" y="382" font-size="28" fill="#19314b" font-weight="650" text-anchor="start">M1：正面视频需求</text>
<text x="62" y="417" font-size="21" fill="#52667b" font-weight="400" text-anchor="start">独立检查正面动作与人物表情</text>
<path d="M280,458 L280,520" fill="none" stroke="#71869b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="533" width="480" height="158" rx="16" fill="#f3f5f8" stroke="#aab8c5" stroke-width="1.7"/>
<text x="62" y="575" font-size="27" fill="#19314b" font-weight="650" text-anchor="start">各自的素材方案版本</text>
<text x="62" y="610" font-size="20" fill="#52667b" font-weight="400" text-anchor="start">V1：完整要求、方法、规格与参考</text>
<text x="62" y="640" font-size="20" fill="#52667b" font-weight="400" text-anchor="start">V2：另一份完整定义（如有）</text>
<text x="62" y="670" font-size="20" fill="#52667b" font-weight="400" text-anchor="start">每版在首次实际提交后冻结</text>
<path d="M280,693 L280,749" fill="none" stroke="#71869b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="762" width="480" height="104" rx="16" fill="#f3f5f8" stroke="#aab8c5" stroke-width="1.7"/>
<text x="62" y="804" font-size="25" fill="#19314b" font-weight="650" text-anchor="start">各版可执行零到多次</text>
<text x="62" y="839" font-size="21" fill="#52667b" font-weight="400" text-anchor="start">记录各次真实输入、状态与输出</text>
<path d="M280,868 L280,924" fill="none" stroke="#71869b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="560" y="340" width="480" height="116" rx="16" fill="#edf5ff" stroke="#99b8d9" stroke-width="1.7"/>
<text x="582" y="382" font-size="28" fill="#19314b" font-weight="650" text-anchor="start">M2：侧面视频需求</text>
<text x="582" y="417" font-size="21" fill="#52667b" font-weight="400" text-anchor="start">独立检查空间与侧面动作</text>
<path d="M800,458 L800,520" fill="none" stroke="#71869b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="560" y="533" width="480" height="158" rx="16" fill="#f3f5f8" stroke="#aab8c5" stroke-width="1.7"/>
<text x="582" y="575" font-size="27" fill="#19314b" font-weight="650" text-anchor="start">各自的素材方案版本</text>
<text x="582" y="610" font-size="20" fill="#52667b" font-weight="400" text-anchor="start">V1：完整要求、方法、规格与参考</text>
<text x="582" y="640" font-size="20" fill="#52667b" font-weight="400" text-anchor="start">V2：另一份完整定义（如有）</text>
<text x="582" y="670" font-size="20" fill="#52667b" font-weight="400" text-anchor="start">每版在首次实际提交后冻结</text>
<path d="M800,693 L800,749" fill="none" stroke="#71869b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="560" y="762" width="480" height="104" rx="16" fill="#f3f5f8" stroke="#aab8c5" stroke-width="1.7"/>
<text x="582" y="804" font-size="25" fill="#19314b" font-weight="650" text-anchor="start">各版可执行零到多次</text>
<text x="582" y="839" font-size="21" fill="#52667b" font-weight="400" text-anchor="start">记录各次真实输入、状态与输出</text>
<path d="M800,868 L800,924" fill="none" stroke="#71869b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="1080" y="340" width="480" height="116" rx="16" fill="#fff7e8" stroke="#d8b76d" stroke-width="1.7"/>
<text x="1102" y="382" font-size="28" fill="#19314b" font-weight="650" text-anchor="start">M3：首帧图像需求</text>
<text x="1102" y="417" font-size="21" fill="#52667b" font-weight="400" text-anchor="start">为指定机位视频提供起始画面</text>
<path d="M1320,458 L1320,520" fill="none" stroke="#71869b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="1080" y="533" width="480" height="158" rx="16" fill="#f3f5f8" stroke="#aab8c5" stroke-width="1.7"/>
<text x="1102" y="575" font-size="27" fill="#19314b" font-weight="650" text-anchor="start">各自的素材方案版本</text>
<text x="1102" y="610" font-size="20" fill="#52667b" font-weight="400" text-anchor="start">V1：完整要求、方法、规格与参考</text>
<text x="1102" y="640" font-size="20" fill="#52667b" font-weight="400" text-anchor="start">V2：另一份完整定义（如有）</text>
<text x="1102" y="670" font-size="20" fill="#52667b" font-weight="400" text-anchor="start">每版在首次实际提交后冻结</text>
<path d="M1320,693 L1320,749" fill="none" stroke="#71869b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="1080" y="762" width="480" height="104" rx="16" fill="#f3f5f8" stroke="#aab8c5" stroke-width="1.7"/>
<text x="1102" y="804" font-size="25" fill="#19314b" font-weight="650" text-anchor="start">各版可执行零到多次</text>
<text x="1102" y="839" font-size="21" fill="#52667b" font-weight="400" text-anchor="start">记录各次真实输入、状态与输出</text>
<path d="M1320,868 L1320,924" fill="none" stroke="#71869b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="938" width="480" height="158" rx="16" fill="#edf5ff" stroke="#99b8d9" stroke-width="1.7"/>
<text x="62" y="980" font-size="28" fill="#19314b" font-weight="650" text-anchor="start">M1 的视频候选</text>
<text x="62" y="1015" font-size="21" fill="#52667b" font-weight="400" text-anchor="start">M1/V1 → C1、C2……</text>
<text x="62" y="1045" font-size="21" fill="#52667b" font-weight="400" text-anchor="start">M1/V2 → C1……或尚无结果</text>
<text x="62" y="1075" font-size="21" fill="#52667b" font-weight="400" text-anchor="start">各候选保留原件及准确生产来源</text>
<rect x="560" y="938" width="480" height="158" rx="16" fill="#edf5ff" stroke="#99b8d9" stroke-width="1.7"/>
<text x="582" y="980" font-size="28" fill="#19314b" font-weight="650" text-anchor="start">M2 的视频候选</text>
<text x="582" y="1015" font-size="21" fill="#52667b" font-weight="400" text-anchor="start">M2/V1 → C1、C2……</text>
<text x="582" y="1045" font-size="21" fill="#52667b" font-weight="400" text-anchor="start">M2/V2 → C1……或尚无结果</text>
<text x="582" y="1075" font-size="21" fill="#52667b" font-weight="400" text-anchor="start">各候选保留原件及准确生产来源</text>
<rect x="1080" y="938" width="480" height="158" rx="16" fill="#fff7e8" stroke="#d8b76d" stroke-width="1.7"/>
<text x="1102" y="980" font-size="28" fill="#19314b" font-weight="650" text-anchor="start">M3 的图像候选</text>
<text x="1102" y="1015" font-size="21" fill="#52667b" font-weight="400" text-anchor="start">M3/V1 → C1、C2……</text>
<text x="1102" y="1045" font-size="21" fill="#52667b" font-weight="400" text-anchor="start">M3/V2 → C1……或尚无结果</text>
<text x="1102" y="1075" font-size="21" fill="#52667b" font-weight="400" text-anchor="start">各候选保留原件及准确生产来源</text>
<rect x="40" y="1130" width="1520" height="113" rx="16" fill="#edf8f2" stroke="#91bca8" stroke-width="1.7"/>
<text x="62" y="1172" font-size="27" fill="#19314b" font-weight="650" text-anchor="start">需求之间另有关系：M3 首帧 → M1 正面视频</text>
<text x="62" y="1207" font-size="22" fill="#52667b" font-weight="400" text-anchor="start">M1 的具体方案还要选定 M3 的准确版本、候选及原件；M3 的图像不计为 M1 的视频候选。</text>
<rect x="40" y="1273" width="1520" height="136" rx="16" fill="#f3f5f8" stroke="#aab8c5" stroke-width="1.7"/>
<text x="62" y="1315" font-size="27" fill="#19314b" font-weight="650" text-anchor="start">角色、空间、道具、声音等共用参考，沿准确关联进入各方案</text>
<text x="62" y="1350" font-size="22" fill="#52667b" font-weight="400" text-anchor="start">实体视角与镜头视角共享同一需求和候选；每项需求说明“全部需要”“择一”或“可选”。</text>
<text x="62" y="1380" font-size="22" fill="#52667b" font-weight="400" text-anchor="start">同方案重复执行增加候选；改已冻结方案建立新版；新增独立交付目标才另建需求。</text>
<text x="40" y="1464" font-size="18" fill="#52667b" font-weight="400" text-anchor="start">M、V、C 均为示意编号；候选数量不构成任务要求，本图未实际调用生成服务。</text>
</svg>

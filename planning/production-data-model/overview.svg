<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1990" viewBox="0 0 1600 1990" role="img" aria-labelledby="title description">
<title id="title">共同故事来源，展开实体与视听两条制作线</title>
<desc id="description">准确故事剧本、故事集、故事场及正文共同支撑实体、实体关系、实体状态与视听设计，两条线连接共用素材需求、方案版本、真实执行和多个候选。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#71869b"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#348269"/></marker></defs>
<style>text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif}path{stroke-linejoin:round;stroke-linecap:round}</style>
<rect width="1600" height="1990" fill="#fbfcfe"/>
<text x="40" y="62" font-size="34" fill="#19314b" font-weight="650" text-anchor="start">共同故事来源，展开实体与视听两条制作线</text>
<text x="40" y="104" font-size="22" fill="#52667b" font-weight="400" text-anchor="start">故事依据、对象归属与制作需要分别表达；两条线共用素材需求，终点为多个镜头候选。</text>
<rect x="40" y="140" width="1520" height="112" rx="16" fill="#edf5ff" stroke="#99b8d9" stroke-width="1.7"/>

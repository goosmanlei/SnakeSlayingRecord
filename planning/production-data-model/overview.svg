<text x="62" y="219" font-size="21" fill="#52667b" font-weight="400" text-anchor="start">作品身份与配置 · 创作资料与方向 · 故事结构与小说 · 制作思路与规格</text>
<path d="M800,254 L800,289" fill="none" stroke="#71869b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="827" y="279" font-size="18" fill="#52667b" font-weight="400" text-anchor="start">准确创作依据</text>

<text x="84" y="438" font-size="20" fill="#52667b" font-weight="400" text-anchor="start">准确版本、全剧故事设定</text>
<rect x="444" y="366" width="330" height="94" rx="16" fill="#ffffff" stroke="#afc4da" stroke-width="1.7"/>
<text x="464" y="404" font-size="25" fill="#19314b" font-weight="650" text-anchor="start">故事集</text>
<text x="464" y="438" font-size="20" fill="#52667b" font-weight="400" text-anchor="start">本集内容与场次</text>
<rect x="824" y="366" width="330" height="94" rx="16" fill="#ffffff" stroke="#afc4da" stroke-width="1.7"/>
<text x="844" y="404" font-size="25" fill="#19314b" font-weight="650" text-anchor="start">故事场</text>
<text x="844" y="438" font-size="20" fill="#52667b" font-weight="400" text-anchor="start">时空、行动与对白</text>
<rect x="1204" y="366" width="330" height="94" rx="16" fill="#ffffff" stroke="#afc4da" stroke-width="1.7"/>
<text x="1224" y="404" font-size="25" fill="#19314b" font-weight="650" text-anchor="start">正文块</text>
<text x="1224" y="438" font-size="20" fill="#52667b" font-weight="400" text-anchor="start">实际引用的准确范围</text>
<path d="M396,413 L433,413" fill="none" stroke="#71869b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M776,413 L813,413" fill="none" stroke="#71869b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M1156,413 L1193,413" fill="none" stroke="#71869b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="64" y="494" font-size="21" fill="#52667b" font-weight="400" text-anchor="start">剧级、集级、场内及跨场依据按实际记录；故事来源、出现位置和适用范围分别保存。</text>
<path d="M408,522 L408,595" fill="none" stroke="#71869b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M1192,522 L1192,595" fill="none" stroke="#71869b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="64" y="558" font-size="21" fill="#19314b" font-weight="650" text-anchor="start">故事依据</text>
<text x="850" y="558" font-size="21" fill="#19314b" font-weight="650" text-anchor="start">故事依据</text>
<text x="64" y="587" font-size="20" fill="#52667b" font-weight="400" text-anchor="start">识别对象、关系与需要维持的形态</text>
<text x="850" y="587" font-size="20" fill="#52667b" font-weight="400" text-anchor="start">设计观众需要看见、听见的内容</text>
<rect x="40" y="608" width="736" height="442" rx="16" fill="#edf8f2" stroke="#91bca8" stroke-width="1.7"/>
<rect x="824" y="608" width="736" height="442" rx="16" fill="#f2eefb" stroke="#b4a0d7" stroke-width="1.7"/>
<text x="64" y="652" font-size="29" fill="#19314b" font-weight="650" text-anchor="start">实体梳理</text>
<text x="64" y="682" font-size="20" fill="#52667b" font-weight="400" text-anchor="start">同一实体可跨集场复用；每项内容保留自己的故事依据</text>
<rect x="64" y="706" width="688" height="88" rx="16" fill="#ffffff" stroke="#a9c7b8" stroke-width="1.7"/>
<text x="84" y="741" font-size="25" fill="#19314b" font-weight="650" text-anchor="start">实体</text>
<text x="84" y="775" font-size="20" fill="#52667b" font-weight="400" text-anchor="start">角色 · 场景空间 · 道具 · 歌曲等稳定对象</text>
<path d="M225,796 L225,835" fill="none" stroke="#71869b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M591,796 L591,835" fill="none" stroke="#71869b" stroke-width="2.5" marker-end="url(#arrow)"/>

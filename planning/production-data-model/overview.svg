<text x="62" y="1458" font-size="27" fill="#19314b" font-weight="650" text-anchor="start">素材方案版本</text>
<text x="62" y="1493" font-size="21" fill="#52667b" font-weight="400" text-anchor="start">完整需求与输出 · 方法与参数</text>
<text x="62" y="1523" font-size="21" fill="#52667b" font-weight="400" text-anchor="start">准确参考选择 · 检查项 · 冻结依据</text>
<rect x="560" y="1416" width="480" height="150" rx="16" fill="#edf5ff" stroke="#99b8d9" stroke-width="1.7"/>
<text x="582" y="1458" font-size="27" fill="#19314b" font-weight="650" text-anchor="start">实际执行／调用</text>
<text x="582" y="1493" font-size="21" fill="#52667b" font-weight="400" text-anchor="start">真实输入 · 工具／模型 · 状态</text>
<text x="582" y="1523" font-size="21" fill="#52667b" font-weight="400" text-anchor="start">回执 · 用量 · 真实输出</text>
<rect x="1080" y="1416" width="480" height="150" rx="16" fill="#edf8f2" stroke="#91bca8" stroke-width="1.7"/>
<text x="1102" y="1458" font-size="27" fill="#19314b" font-weight="650" text-anchor="start">多个素材候选</text>
<text x="1102" y="1493" font-size="21" fill="#52667b" font-weight="400" text-anchor="start">每个结果的生产来源与适用范围</text>
<text x="1102" y="1523" font-size="21" fill="#52667b" font-weight="400" text-anchor="start">原件／预览等组成 · 实测信息</text>
<path d="M522,1490 L552,1490" fill="none" stroke="#71869b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M1042,1490 L1072,1490" fill="none" stroke="#71869b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="535" y="1393" font-size="17" fill="#52667b" font-weight="400" text-anchor="middle">0..多次</text>
<text x="1055" y="1393" font-size="17" fill="#52667b" font-weight="400" text-anchor="middle">0..多个</text>
<rect x="40" y="1600" width="1520" height="150" rx="16" fill="#fff7e8" stroke="#d8b76d" stroke-width="1.7"/>
<text x="62" y="1642" font-size="27" fill="#19314b" font-weight="650" text-anchor="start">准确追溯与审阅贯穿全程</text>
<text x="62" y="1678" font-size="22" fill="#52667b" font-weight="400" text-anchor="start">故事依据 → 实体／关系／状态或视听设计 → 素材用途 → 方案、实际输入及原件</text>
<text x="62" y="1714" font-size="22" fill="#52667b" font-weight="400" text-anchor="start">对象身份与修订 · 评论与意见回应 · 审阅决定与采用 · 沿准确依赖检查变更影响</text>
<rect x="40" y="1782" width="1520" height="120" rx="16" fill="#edf8f2" stroke="#91bca8" stroke-width="1.7"/>
<text x="62" y="1825" font-size="28" fill="#19314b" font-weight="650" text-anchor="start">本轮终点：多个镜头候选及原件，可预览、比较和反馈</text>
<text x="62" y="1862" font-size="22" fill="#52667b" font-weight="400" text-anchor="start">故事依据不自动产生媒体义务；是否需要独立素材，由明确的制作目的与范围决定。</text>
<text x="40" y="1943" font-size="19" fill="#52667b" font-weight="400" text-anchor="start">概念讨论图，整合已有能力与扩展建议；不是当前数据库结构或已经执行生成的记录。</text>
</svg>

<text x="1302" y="1287" font-size="19" fill="#52667b" font-weight="400" text-anchor="start">引用同一需求身份</text>
<path d="M1280,1252 L1247,1252" fill="none" stroke="#348269" stroke-width="2.5" marker-end="url(#green)"/>
<path d="M800,1328 L800,1360 L280,1360 L280,1404" fill="none" stroke="#71869b" stroke-width="2.5" marker-end="url(#arrow)"/>

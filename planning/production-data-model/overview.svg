<text x="62" y="340" font-size="28" fill="#19314b" font-weight="650" text-anchor="start">共同故事来源：以下两条线都从同一份准确故事出发</text>
<rect x="64" y="366" width="330" height="94" rx="16" fill="#ffffff" stroke="#afc4da" stroke-width="1.7"/>

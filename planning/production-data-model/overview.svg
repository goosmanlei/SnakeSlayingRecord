<text x="610" y="824" font-size="17" fill="#52667b" font-weight="400" text-anchor="start">关系端点引用实体</text>
<rect x="64" y="846" width="322" height="102" rx="16" fill="#ffffff" stroke="#a9c7b8" stroke-width="1.7"/>
<text x="84" y="884" font-size="24" fill="#19314b" font-weight="650" text-anchor="start">实体状态</text>
<text x="84" y="920" font-size="18" fill="#52667b" font-weight="400" text-anchor="start">外貌、衣着、布局等整体形态</text>
<rect x="430" y="846" width="322" height="102" rx="16" fill="#ffffff" stroke="#a9c7b8" stroke-width="1.7"/>
<text x="450" y="884" font-size="24" fill="#19314b" font-weight="650" text-anchor="start">实体关系</text>
<text x="450" y="920" font-size="18" fill="#52667b" font-weight="400" text-anchor="start">人物、归属、使用、空间关系</text>
<text x="64" y="986" font-size="21" fill="#52667b" font-weight="400" text-anchor="start">出现／提及 · 状态转换 · 制作设定</text>
<text x="64" y="1020" font-size="20" fill="#52667b" font-weight="400" text-anchor="start">状态与关系分别引用准确故事来源和适用范围</text>
<text x="848" y="652" font-size="29" fill="#19314b" font-weight="650" text-anchor="start">视听设计</text>
<text x="848" y="682" font-size="20" fill="#52667b" font-weight="400" text-anchor="start">同一故事的表达安排；保留准确正文来源与编排版本</text>
<rect x="848" y="706" width="688" height="88" rx="16" fill="#ffffff" stroke="#c6b8dc" stroke-width="1.7"/>
<text x="870" y="742" font-size="25" fill="#19314b" font-weight="650" text-anchor="start">视听集</text>
<text x="870" y="776" font-size="20" fill="#52667b" font-weight="400" text-anchor="start">整集表达目标、视听场划分与顺序</text>
<rect x="848" y="817" width="688" height="88" rx="16" fill="#ffffff" stroke="#c6b8dc" stroke-width="1.7"/>
<text x="870" y="853" font-size="25" fill="#19314b" font-weight="650" text-anchor="start">视听场</text>
<text x="870" y="887" font-size="20" fill="#52667b" font-weight="400" text-anchor="start">段落目的、拆镜理由与镜头编排</text>
<rect x="848" y="928" width="688" height="88" rx="16" fill="#ffffff" stroke="#c6b8dc" stroke-width="1.7"/>
<text x="870" y="964" font-size="25" fill="#19314b" font-weight="650" text-anchor="start">视听镜头</text>
<text x="870" y="998" font-size="20" fill="#52667b" font-weight="400" text-anchor="start">单镜画面、动作、声音、时长与承接</text>
<path d="M1192,796 L1192,807" fill="none" stroke="#71869b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M1192,907 L1192,918" fill="none" stroke="#71869b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M408,1052 L408,1167" fill="none" stroke="#348269" stroke-width="2.5" marker-end="url(#green)"/>
<path d="M1192,1052 L1192,1167" fill="none" stroke="#348269" stroke-width="2.5" marker-end="url(#green)"/>
<text x="435" y="1090" font-size="18" fill="#52667b" font-weight="400" text-anchor="start">明确对象／状态、关系约束</text>
<text x="435" y="1120" font-size="18" fill="#52667b" font-weight="400" text-anchor="start">与实际制作需要</text>
<text x="855" y="1090" font-size="18" fill="#52667b" font-weight="400" text-anchor="start">明确表达目标、产物要求</text>
<text x="855" y="1120" font-size="18" fill="#52667b" font-weight="400" text-anchor="start">与使用范围</text>
<rect x="360" y="1180" width="880" height="146" rx="16" fill="#edf8f2" stroke="#91bca8" stroke-width="1.7"/>
<text x="382" y="1222" font-size="27" fill="#19314b" font-weight="650" text-anchor="start">共用素材需求：一镜可有多项，一项也可多处使用</text>
<text x="382" y="1257" font-size="21" fill="#52667b" font-weight="400" text-anchor="start">定妆 · 空间全景／机位 · 道具细节 · 镜头首帧／视频 · 声音</text>
<text x="382" y="1287" font-size="21" fill="#52667b" font-weight="400" text-anchor="start">每项保存用途、要求、主归属、故事依据及准确使用范围</text>
<rect x="40" y="1180" width="280" height="146" rx="16" fill="#fff7e8" stroke="#d8b76d" stroke-width="1.7"/>
<text x="62" y="1222" font-size="26" fill="#19314b" font-weight="650" text-anchor="start">需求关系</text>
<text x="62" y="1257" font-size="19" fill="#52667b" font-weight="400" text-anchor="start">端点 · 语境 · 用途</text>
<text x="62" y="1287" font-size="19" fill="#52667b" font-weight="400" text-anchor="start">必要性 · 条件 · 版本</text>
<path d="M360,1252 L324,1252" fill="none" stroke="#348269" stroke-width="2.5" marker-end="url(#green)"/>
<rect x="1280" y="1180" width="280" height="146" rx="16" fill="#f3f5f8" stroke="#aab8c5" stroke-width="1.7"/>
<text x="1302" y="1222" font-size="25" fill="#19314b" font-weight="650" text-anchor="start">多个阅读入口</text>

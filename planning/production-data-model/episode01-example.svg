<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1540" viewBox="0 0 1440 1540" role="img" aria-labelledby="title description">
<title id="title">第一集《两份米》：从故事正文到镜头候选</title><desc id="description">依据剧本版本四的局部正文；视听场划分、镜头要求与候选关联均为讨论示例。</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#657b90"/></marker>
<marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563a8"/></marker>
<marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#13846f"/></marker>
</defs>
<style>text {font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;} path.line {fill:none;stroke-linecap:round;stroke-linejoin:round;}</style>
<rect x="0" y="0" width="1440" height="1540" rx="0" fill="#fbfcfe"/>
<text x="40" y="59" font-size="32" fill="#172c43" font-weight="700" text-anchor="start">第一集《两份米》：从故事正文到镜头候选</text>
<text x="40" y="98" font-size="18" fill="#526477" font-weight="400" text-anchor="start">依据剧本版本四的局部正文；视听场划分、镜头要求与候选关联均为讨论示例。</text>
<rect x="40" y="144" width="560" height="102" rx="14" fill="#eef5fd" stroke="#9ebedc" stroke-width="1.6"/>
<text x="586" y="164" font-size="12" fill="#526477" font-weight="400" text-anchor="end">现有基础</text>
<text x="58" y="188" font-size="25" fill="#172c43" font-weight="600" text-anchor="start">故事集：第01集 两份米</text>
<text x="58" y="217" font-size="18" fill="#526477" font-weight="400" text-anchor="start">保留准确故事场顺序与完整正文</text>
<rect x="830" y="144" width="570" height="102" rx="14" fill="#fff5df" stroke="#d6ad53" stroke-width="1.6"/>
<text x="1386" y="164" font-size="12" fill="#526477" font-weight="400" text-anchor="end">建议新增</text>
<text x="848" y="188" font-size="25" fill="#172c43" font-weight="600" text-anchor="start">视听集：第01集的表达设计</text>
<text x="848" y="217" font-size="18" fill="#526477" font-weight="400" text-anchor="start">设计整集目的、视听场顺序、预计节奏及承接</text>
<path class="line" d="M600,194 L821,194" stroke="#657b90" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="715" y="173" font-size="17" fill="#526477" font-weight="400" text-anchor="middle">建议保持分集对应</text>
<rect x="40" y="288" width="560" height="144" rx="14" fill="#eef5fd" stroke="#9ebedc" stroke-width="1.6"/>
<text x="586" y="308" font-size="12" fill="#526477" font-weight="400" text-anchor="end">现有基础</text>
<text x="58" y="332" font-size="24" fill="#172c43" font-weight="600" text-anchor="start">故事场一：米铺门口</text>
<text x="58" y="361" font-size="17" fill="#526477" font-weight="400" text-anchor="start">s001 b001—b009：省唱、打趣与笑声</text>
<text x="58" y="388" font-size="17" fill="#526477" font-weight="400" text-anchor="start">s001 b026—b032：约练歌、肩印与双手</text>
<rect x="40" y="474" width="560" height="144" rx="14" fill="#eef5fd" stroke="#9ebedc" stroke-width="1.6"/>
<text x="586" y="494" font-size="12" fill="#526477" font-weight="400" text-anchor="end">现有基础</text>
<text x="58" y="518" font-size="24" fill="#172c43" font-weight="600" text-anchor="start">故事场二：河街上的邀请</text>
<text x="58" y="547" font-size="17" fill="#526477" font-weight="400" text-anchor="start">s002 b001—b010：擦手、接歌本、喂墨耳</text>
<text x="58" y="574" font-size="17" fill="#526477" font-weight="400" text-anchor="start">本例只取开头，后续正文仍完整保留</text>
<rect x="830" y="288" width="570" height="144" rx="14" fill="#fff5df" stroke="#d6ad53" stroke-width="1.6"/>
<text x="1386" y="308" font-size="12" fill="#526477" font-weight="400" text-anchor="end">建议新增</text>
<text x="848" y="332" font-size="24" fill="#172c43" font-weight="600" text-anchor="start">视听场 A：省唱引出笑声</text>
<text x="848" y="361" font-size="17" fill="#526477" font-weight="400" text-anchor="start">来源：s001 b001—b009</text>
<text x="848" y="388" font-size="17" fill="#526477" font-weight="400" text-anchor="start">目的：表现阿蘅的机灵及与听客的熟悉</text>
<rect x="830" y="474" width="570" height="144" rx="14" fill="#fff5df" stroke="#d6ad53" stroke-width="1.6"/>
<text x="1386" y="494" font-size="12" fill="#526477" font-weight="400" text-anchor="end">建议新增</text>
<text x="848" y="518" font-size="24" fill="#172c43" font-weight="600" text-anchor="start">视听场 B：两人的照料</text>
<text x="848" y="547" font-size="17" fill="#526477" font-weight="400" text-anchor="start">来源：s001 b026—b032 ＋ s002 b001—b010</text>
<text x="848" y="574" font-size="17" fill="#526477" font-weight="400" text-anchor="start">目的：跨故事场组织两人照料彼此的行动</text>
<path class="line" d="M600,348 L821,348" stroke="#657b90" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="715" y="332" font-size="17" fill="#526477" font-weight="400" text-anchor="middle">引用部分正文</text>
<path class="line" d="M600,406 L710,406 L710,514 L821,514" stroke="#657b90" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="725" y="464" font-size="16" fill="#526477" font-weight="400" text-anchor="start">另一部分正文</text>
<path class="line" d="M600,562 L821,562" stroke="#657b90" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="715" y="593" font-size="17" fill="#526477" font-weight="400" text-anchor="middle">引用下一故事场</text>
<rect x="40" y="647" width="1360" height="75" rx="14" fill="#f2f4f7" stroke="#aeb9c4" stroke-width="1.6"/>
<text x="62" y="679" font-size="18" fill="#526477" font-weight="400" text-anchor="start">故事场与视听场分别组织：一个故事场可支持多个视听场，一个视听场也可跨故事场引用。</text>
<text x="62" y="706" font-size="18" fill="#526477" font-weight="400" text-anchor="start">本例没有覆盖整集；未展示的正文不意味着被删除。</text>
<text x="40" y="779" font-size="26" fill="#172c43" font-weight="700" text-anchor="start">展开视听场 A：目的 → 拆镜思路 → 各镜表达要求</text>
<rect x="40" y="811" width="1360" height="115" rx="14" fill="#fff5df" stroke="#d6ad53" stroke-width="1.6"/>
<text x="64" y="850" font-size="22" fill="#172c43" font-weight="600" text-anchor="start">共同目的：让观众看懂阿蘅有意省唱，以及她与听客之间熟悉、亲近的关系。</text>
<text x="64" y="890" font-size="21" fill="#526477" font-weight="400" text-anchor="start">分镜思路：先呈现演唱，再交代老汉发现，最后用打趣与回应完成这一段表达。</text>
<rect x="40" y="965" width="424" height="151" rx="14" fill="#f1edfb" stroke="#b1a0d2" stroke-width="1.6"/>
<text x="450" y="985" font-size="12" fill="#526477" font-weight="400" text-anchor="end">需扩展</text>
<text x="58" y="1009" font-size="21" fill="#172c43" font-weight="600" text-anchor="start">视听镜头 A1：阿蘅演唱</text>
<text x="58" y="1038" font-size="17" fill="#526477" font-weight="400" text-anchor="start">观众能识别省唱的动作与声音线索</text>
<text x="58" y="1065" font-size="17" fill="#526477" font-weight="400" text-anchor="start">待细化：构图、演唱起止、声音重点</text>
<rect x="508" y="965" width="424" height="151" rx="14" fill="#f1edfb" stroke="#b1a0d2" stroke-width="1.6"/>
<text x="918" y="985" font-size="12" fill="#526477" font-weight="400" text-anchor="end">需扩展</text>
<text x="526" y="1009" font-size="21" fill="#172c43" font-weight="600" text-anchor="start">视听镜头 A2：老汉打趣</text>
<text x="526" y="1038" font-size="17" fill="#526477" font-weight="400" text-anchor="start">交代听客为何反应，体现双方熟悉</text>
<text x="526" y="1065" font-size="17" fill="#526477" font-weight="400" text-anchor="start">待细化：反应时机、动作、对白承接</text>
<rect x="976" y="965" width="424" height="151" rx="14" fill="#f1edfb" stroke="#b1a0d2" stroke-width="1.6"/>
<text x="1386" y="985" font-size="12" fill="#526477" font-weight="400" text-anchor="end">需扩展</text>
<text x="994" y="1009" font-size="21" fill="#172c43" font-weight="600" text-anchor="start">视听镜头 A3：回应</text>
<text x="994" y="1038" font-size="17" fill="#526477" font-weight="400" text-anchor="start">用阿蘅与听客的回应落实关系情绪</text>
<text x="994" y="1065" font-size="17" fill="#526477" font-weight="400" text-anchor="start">待细化：笑声、画面组织、结束节奏</text>
<path class="line" d="M466,1038 L500,1038" stroke="#657b90" stroke-width="2.2" marker-end="url(#arrow)"/>
<path class="line" d="M934,1038 L968,1038" stroke="#657b90" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="40" y="1180" width="660" height="185" rx="14" fill="#fff" stroke="#a6bccf" stroke-width="1.6"/>
<text x="58" y="1224" font-size="25" fill="#172c43" font-weight="600" text-anchor="start">拆出需求：分别编制素材方案</text>
<text x="58" y="1253" font-size="19" fill="#526477" font-weight="400" text-anchor="start">以 A1 为例，可有不同机位、首帧或声音需求</text>
<text x="58" y="1280" font-size="19" fill="#526477" font-weight="400" text-anchor="start">每项需求分别保存版本、参数、规格和参考</text>
<text x="58" y="1307" font-size="19" fill="#526477" font-weight="400" text-anchor="start">上游共用素材沿明确用途与准确选择连接</text>
<rect x="740" y="1180" width="660" height="185" rx="14" fill="#fff" stroke="#a6bccf" stroke-width="1.6"/>
<text x="758" y="1224" font-size="25" fill="#172c43" font-weight="600" text-anchor="start">多个候选：原件与来源分别保存</text>
<text x="758" y="1253" font-size="19" fill="#526477" font-weight="400" text-anchor="start">各项需求独立生成，同方案可保留多个候选</text>
<text x="758" y="1280" font-size="19" fill="#526477" font-weight="400" text-anchor="start">每个候选回查准确方案、实际调用和输入</text>
<text x="758" y="1307" font-size="19" fill="#526477" font-weight="400" text-anchor="start">逐个查看人物、动作、声音与要求是否相符</text>
<path class="line" d="M702,1272 L732,1272" stroke="#657b90" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="40" y="1395" width="1360" height="70" rx="14" fill="#edf7f3" stroke="#9ac7b5" stroke-width="1.6"/>
<text x="64" y="1439" font-size="23" fill="#285a49" font-weight="400" text-anchor="start">本轮到此：候选可追溯、可单独播放并反馈；生成数量与候选质量分别判断。</text>
<text x="40" y="1507" font-size="16" fill="#526477" font-weight="400" text-anchor="start">正文范围及完整 ID 见配套 Markdown；本图未执行生成，也未指定每镜候选数量。</text>
</svg>

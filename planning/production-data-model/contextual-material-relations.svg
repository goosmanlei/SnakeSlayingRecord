<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1700" viewBox="0 0 1600 1700" role="img" aria-labelledby="title description">
<title id="title">素材需求关系：在角色、场景、道具和镜头语境下说明用途</title><desc id="description">每个节点是一项需求，均可展开方案版本与候选；箭头方向为“提供参考 → 使用参考”。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#71869b"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#348269"/></marker></defs>
<style>text {font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;} path {stroke-linejoin:round;stroke-linecap:round;}</style>
<rect width="1600" height="1700" fill="#fbfcfe"/>
<text x="40" y="62" font-size="34" fill="#19314b" font-weight="700" text-anchor="start">素材需求关系：在角色、场景、道具和镜头语境下说明用途</text>
<text x="40" y="104" font-size="20" fill="#52667b" font-weight="400" text-anchor="start">每个节点是一项需求，均可展开方案版本与候选；箭头方向为“提供参考 → 使用参考”。</text>
<text x="40" y="160" font-size="28" fill="#19314b" font-weight="700" text-anchor="start">角色：身份保持与状态变体</text>
<rect x="40" y="189" width="450" height="135" rx="16" fill="#edf8f2" stroke="#91bca8" stroke-width="1.7"/>
<text x="62" y="231" font-size="27" fill="#19314b" font-weight="650" text-anchor="start">基础定妆需求</text>
<text x="62" y="266" font-size="21" fill="#52667b" font-weight="400" text-anchor="start">固定脸型、比例与角色辨识</text>
<text x="62" y="296" font-size="21" fill="#52667b" font-weight="400" text-anchor="start">生成起点不由剧情顺序决定</text>
<rect x="630" y="189" width="450" height="135" rx="16" fill="#edf8f2" stroke="#91bca8" stroke-width="1.7"/>
<text x="652" y="231" font-size="27" fill="#19314b" font-weight="650" text-anchor="start">湿衣状态定妆需求</text>
<text x="652" y="266" font-size="21" fill="#52667b" font-weight="400" text-anchor="start">保留身份；明确允许的湿态变化</text>
<text x="652" y="296" font-size="21" fill="#52667b" font-weight="400" text-anchor="start">独立方案与独立候选</text>
<rect x="1120" y="189" width="440" height="135" rx="16" fill="#edf8f2" stroke="#91bca8" stroke-width="1.7"/>
<text x="1142" y="231" font-size="26" fill="#19314b" font-weight="650" text-anchor="start">受伤状态定妆需求</text>
<text x="1142" y="266" font-size="20" fill="#52667b" font-weight="400" text-anchor="start">同样可直接参考基础母版</text>
<text x="1142" y="296" font-size="20" fill="#52667b" font-weight="400" text-anchor="start">不强制沿湿衣图继续派生</text>
<path d="M492,251 L620,251" fill="none" stroke="#348269" stroke-width="2.5" marker-end="url(#green)"/>
<text x="555" y="233" font-size="18" fill="#286852" font-weight="600" text-anchor="middle">身份参考</text>
<path d="M265,326 L265,357 L1340,357 L1340,329" fill="none" stroke="#348269" stroke-width="2.5" marker-end="url(#green)"/>
<text x="797" y="384" font-size="20" fill="#52667b" font-weight="400" text-anchor="middle">一份基准可支持多个状态需求；真实输入与累计派生深度另行追溯。</text>
<text x="40" y="448" font-size="28" fill="#19314b" font-weight="700" text-anchor="start">场景空间：布局、机位与细节</text>
<rect x="40" y="480" width="450" height="136" rx="16" fill="#edf5ff" stroke="#99b8d9" stroke-width="1.7"/>
<text x="62" y="522" font-size="27" fill="#19314b" font-weight="650" text-anchor="start">全景需求</text>
<text x="62" y="557" font-size="21" fill="#52667b" font-weight="400" text-anchor="start">确定空间布局、比例与地标</text>
<text x="62" y="587" font-size="21" fill="#52667b" font-weight="400" text-anchor="start">风格可来自文字或独立风格参考</text>
<rect x="630" y="480" width="450" height="136" rx="16" fill="#edf5ff" stroke="#99b8d9" stroke-width="1.7"/>
<text x="652" y="522" font-size="27" fill="#19314b" font-weight="650" text-anchor="start">某机位参考需求</text>
<text x="652" y="557" font-size="21" fill="#52667b" font-weight="400" text-anchor="start">说明机位与可见范围</text>
<text x="652" y="587" font-size="21" fill="#52667b" font-weight="400" text-anchor="start">同状态的不同角度可分别制作</text>
<rect x="1120" y="480" width="440" height="136" rx="16" fill="#edf5ff" stroke="#99b8d9" stroke-width="1.7"/>
<text x="1142" y="522" font-size="27" fill="#19314b" font-weight="650" text-anchor="start">关键细节需求</text>
<text x="1142" y="557" font-size="20" fill="#52667b" font-weight="400" text-anchor="start">明确门窗、结构等细节</text>
<text x="1142" y="587" font-size="20" fill="#52667b" font-weight="400" text-anchor="start">不能从模糊全景猜测具体细节</text>
<path d="M492,547 L620,547" fill="none" stroke="#348269" stroke-width="2.5" marker-end="url(#green)"/>
<text x="555" y="528" font-size="18" fill="#286852" font-weight="600" text-anchor="middle">布局参考</text>
<path d="M1340,618 L1340,660 L855,660 L855,619" fill="none" stroke="#348269" stroke-width="2.5" marker-end="url(#green)"/>
<text x="1098" y="691" font-size="20" fill="#52667b" font-weight="400" text-anchor="middle">细节约束 → 指定机位</text>
<text x="40" y="752" font-size="28" fill="#19314b" font-weight="700" text-anchor="start">道具：结构、状态与持握关系</text>
<rect x="40" y="782" width="450" height="136" rx="16" fill="#fff7e8" stroke="#d8b76d" stroke-width="1.7"/>
<text x="62" y="824" font-size="27" fill="#19314b" font-weight="650" text-anchor="start">道具基础结构需求</text>
<text x="62" y="859" font-size="21" fill="#52667b" font-weight="400" text-anchor="start">固定形状、尺度与关键构造</text>
<text x="62" y="889" font-size="21" fill="#52667b" font-weight="400" text-anchor="start">状态变化另有完整说明</text>
<rect x="630" y="782" width="450" height="136" rx="16" fill="#fff7e8" stroke="#d8b76d" stroke-width="1.7"/>
<text x="652" y="824" font-size="25" fill="#19314b" font-weight="650" text-anchor="start">指定状态／持握细节需求</text>
<text x="652" y="859" font-size="20" fill="#52667b" font-weight="400" text-anchor="start">明确这次需要的结构与动作</text>
<text x="652" y="889" font-size="20" fill="#52667b" font-weight="400" text-anchor="start">一个需求可关联角色、道具与镜头</text>
<rect x="1120" y="782" width="440" height="136" rx="16" fill="#fff7e8" stroke="#d8b76d" stroke-width="1.7"/>
<text x="1142" y="824" font-size="24" fill="#19314b" font-weight="650" text-anchor="start">角色手部／比例参考需求</text>
<text x="1142" y="859" font-size="21" fill="#52667b" font-weight="400" text-anchor="start">提供持握比例与接触关系</text>
<text x="1142" y="889" font-size="21" fill="#52667b" font-weight="400" text-anchor="start">不改变道具身份</text>
<path d="M492,849 L620,849" fill="none" stroke="#348269" stroke-width="2.5" marker-end="url(#green)"/>
<text x="555" y="830" font-size="18" fill="#286852" font-weight="600" text-anchor="middle">结构参考</text>
<path d="M1340,920 L1340,962 L855,962 L855,921" fill="none" stroke="#348269" stroke-width="2.5" marker-end="url(#green)"/>
<text x="1098" y="993" font-size="20" fill="#52667b" font-weight="400" text-anchor="middle">尺度与接触参考 → 持握需求</text>
<text x="40" y="1050" font-size="28" fill="#19314b" font-weight="700" text-anchor="start">镜头：上游参考汇入首帧，再支持视频</text>
<rect x="40" y="1080" width="450" height="174" rx="16" fill="#f2eefb" stroke="#b4a0d7" stroke-width="1.7"/>
<text x="62" y="1122" font-size="27" fill="#19314b" font-weight="650" text-anchor="start">准确语境中的上游需求</text>
<text x="62" y="1157" font-size="21" fill="#52667b" font-weight="400" text-anchor="start">角色状态参考</text>
<text x="62" y="1187" font-size="21" fill="#52667b" font-weight="400" text-anchor="start">场景机位参考</text>
<text x="62" y="1217" font-size="21" fill="#52667b" font-weight="400" text-anchor="start">道具细节参考</text>
<rect x="630" y="1080" width="450" height="174" rx="16" fill="#f2eefb" stroke="#b4a0d7" stroke-width="1.7"/>
<text x="652" y="1122" font-size="27" fill="#19314b" font-weight="650" text-anchor="start">指定机位首帧需求</text>
<text x="652" y="1157" font-size="21" fill="#52667b" font-weight="400" text-anchor="start">人物、状态、站位与起始构图</text>
<text x="652" y="1187" font-size="21" fill="#52667b" font-weight="400" text-anchor="start">各参考说明自己的作用</text>
<text x="652" y="1217" font-size="21" fill="#52667b" font-weight="400" text-anchor="start">选择准确候选后提供给视频</text>
<rect x="1120" y="1080" width="440" height="174" rx="16" fill="#f2eefb" stroke="#b4a0d7" stroke-width="1.7"/>
<text x="1142" y="1122" font-size="27" fill="#19314b" font-weight="650" text-anchor="start">镜头视频需求</text>
<text x="1142" y="1157" font-size="21" fill="#52667b" font-weight="400" text-anchor="start">动作、声音、时长与承接</text>
<text x="1142" y="1187" font-size="21" fill="#52667b" font-weight="400" text-anchor="start">首帧是否必需取决于方案</text>
<text x="1142" y="1217" font-size="21" fill="#52667b" font-weight="400" text-anchor="start">可另选准确声音参考</text>
<path d="M492,1168 L620,1168" fill="none" stroke="#348269" stroke-width="2.5" marker-end="url(#green)"/>
<text x="555" y="1149" font-size="18" fill="#286852" font-weight="600" text-anchor="middle">各司其用</text>
<path d="M855,1256 L855,1295 L1340,1295 L1340,1259" fill="none" stroke="#348269" stroke-width="2.5" marker-end="url(#green)"/>
<text x="1098" y="1326" font-size="20" fill="#52667b" font-weight="400" text-anchor="middle">首帧参考 → 视频生成</text>
<rect x="40" y="1373" width="1520" height="177" rx="16" fill="#f3f5f8" stroke="#aab8c5" stroke-width="1.7"/>
<text x="62" y="1415" font-size="27" fill="#19314b" font-weight="650" text-anchor="start">所有关系共用：端点、语境、用途、约束、必要性、条件与版本范围</text>
<text x="62" y="1450" font-size="22" fill="#52667b" font-weight="400" text-anchor="start">同一组数据可从实体或视听镜头进入；具体方案另选准确版本、候选与原件。</text>
<text x="62" y="1480" font-size="22" fill="#52667b" font-weight="400" text-anchor="start">特殊关系可扩展类型与属性；语义未明确时保留说明，不自动安排执行。</text>
<text x="62" y="1510" font-size="22" fill="#52667b" font-weight="400" text-anchor="start">每种路线须根据实际制作需要确定，图中示例不要求全部生成。</text>
<text x="40" y="1620" font-size="20" fill="#52667b" font-weight="400" text-anchor="start">这是需求关系图；没有表达谁已被选用、哪些调用已发生或哪些候选已获质量认可。</text>
</svg>

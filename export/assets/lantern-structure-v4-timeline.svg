<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="850" viewBox="0 0 1360 850" role="img"><title>时间与读者何时知道什么</title><desc>让行动条件先出现；完整谋划发生在祭日前夜。</desc><defs><marker id="arrow-24746b" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="12" refY="6" orient="auto-start-reverse"><path d="M0,0 L0,12 L12,6 z" fill="#24746b"/></marker><marker id="arrow-a74535" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="12" refY="6" orient="auto-start-reverse"><path d="M0,0 L0,12 L12,6 z" fill="#a74535"/></marker><marker id="arrow-213d43" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="12" refY="6" orient="auto-start-reverse"><path d="M0,0 L0,12 L12,6 z" fill="#213d43"/></marker><marker id="arrow-63777a" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="12" refY="6" orient="auto-start-reverse"><path d="M0,0 L0,12 L12,6 z" fill="#63777a"/></marker><marker id="arrow-426aa5" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="12" refY="6" orient="auto-start-reverse"><path d="M0,0 L0,12 L12,6 z" fill="#426aa5"/></marker><marker id="arrow-ac7429" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="12" refY="6" orient="auto-start-reverse"><path d="M0,0 L0,12 L12,6 z" fill="#ac7429"/></marker></defs><rect width="1360" height="850" fill="#faf8f1"/>
<text x="36" y="50" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" fill="#213d43" text-anchor="start" font-weight="normal">时间与读者何时知道什么</text>
<text x="36" y="84" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#63777a" text-anchor="start" font-weight="normal">让行动条件先出现；完整谋划发生在祭日前夜。</text>
<rect x="40" y="132" width="1280" height="90" rx="10" fill="#fff" stroke="#c8d5d1" stroke-width="1.5"/>
<text x="56" y="164" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#24746b" text-anchor="start" font-weight="bold">十余日前</text>
<text x="265" y="170" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="22" fill="#24746b" text-anchor="start" font-weight="normal">歌本、生计与信任</text>
<text x="625" y="190" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" fill="#213d43" text-anchor="start" font-weight="normal">认识两位女孩、父辈故交、唱曲收入</text>
<rect x="40" y="237" width="1280" height="90" rx="10" fill="#fff" stroke="#c8d5d1" stroke-width="1.5"/>
<text x="56" y="269" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#24746b" text-anchor="start" font-weight="bold">点名与第一日</text>
<text x="265" y="275" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="22" fill="#24746b" text-anchor="start" font-weight="normal">应募、保护、探路</text>
<text x="625" y="295" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" fill="#213d43" text-anchor="start" font-weight="normal">知道祭日期限、成人分工、庙院后路</text>
<rect x="40" y="342" width="1280" height="90" rx="10" fill="#fff" stroke="#c8d5d1" stroke-width="1.5"/>
<text x="56" y="374" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#24746b" text-anchor="start" font-weight="bold">第二日白天</text>
<text x="265" y="380" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="22" fill="#24746b" text-anchor="start" font-weight="normal">备粮疑点、搭台</text>
<text x="625" y="400" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" fill="#213d43" text-anchor="start" font-weight="normal">分清查账与搬粮，认识两院和器具</text>
<rect x="40" y="447" width="1280" height="90" rx="10" fill="#edf3ee" stroke="#c8d5d1" stroke-width="1.5"/>
<text x="56" y="479" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#24746b" text-anchor="start" font-weight="bold">第二日夜里</text>
<text x="265" y="485" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="22" fill="#24746b" text-anchor="start" font-weight="normal">试验失败、灯下商量</text>
<text x="625" y="505" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" fill="#213d43" text-anchor="start" font-weight="normal">看见蛇的力量，听清次日主计划与退路</text>
<rect x="40" y="552" width="1280" height="90" rx="10" fill="#fff" stroke="#c8d5d1" stroke-width="1.5"/>
<text x="56" y="584" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#24746b" text-anchor="start" font-weight="bold">第三日</text>
<text x="265" y="590" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="22" fill="#24746b" text-anchor="start" font-weight="normal">拖延、救援、斩蛇</text>
<text x="625" y="610" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" fill="#213d43" text-anchor="start" font-weight="normal">按已知位置追随意外及每次临场选择</text>
<rect x="40" y="657" width="1280" height="90" rx="10" fill="#fff" stroke="#c8d5d1" stroke-width="1.5"/>
<text x="56" y="689" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#24746b" text-anchor="start" font-weight="bold">次日至月余</text>
<text x="265" y="695" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="22" fill="#24746b" text-anchor="start" font-weight="normal">寻遗物、核账、养伤、复演</text>
<text x="625" y="715" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" fill="#213d43" text-anchor="start" font-weight="normal">证据分次查清，伤势与失去的人留有后果</text>
<text x="36" y="805" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#63777a" text-anchor="start" font-weight="normal">章节按场景组织；不以相等篇幅或固定分钟数压缩必要背景。</text>
</svg>
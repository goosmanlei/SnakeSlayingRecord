<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1330" viewBox="0 0 1360 1330" role="img"><title>第三阶段：戏台分工与最后一剑</title><desc>上图是入台前，下图是李诞受困后；同一地点在两个时刻分别展示</desc><defs><marker id="arrow-24746b" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="12" refY="6" orient="auto-start-reverse"><path d="M0,0 L0,12 L12,6 z" fill="#24746b"/></marker><marker id="arrow-a74535" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="12" refY="6" orient="auto-start-reverse"><path d="M0,0 L0,12 L12,6 z" fill="#a74535"/></marker><marker id="arrow-213d43" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="12" refY="6" orient="auto-start-reverse"><path d="M0,0 L0,12 L12,6 z" fill="#213d43"/></marker><marker id="arrow-63777a" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="12" refY="6" orient="auto-start-reverse"><path d="M0,0 L0,12 L12,6 z" fill="#63777a"/></marker><marker id="arrow-426aa5" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="12" refY="6" orient="auto-start-reverse"><path d="M0,0 L0,12 L12,6 z" fill="#426aa5"/></marker><marker id="arrow-ac7429" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="12" refY="6" orient="auto-start-reverse"><path d="M0,0 L0,12 L12,6 z" fill="#ac7429"/></marker></defs><rect width="1360" height="1330" fill="#faf8f1"/>
<text x="36" y="50" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" fill="#213d43" text-anchor="start" font-weight="normal">第三阶段：戏台分工与最后一剑</text>
<text x="36" y="84" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#63777a" text-anchor="start" font-weight="normal">上图是入台前，下图是李诞受困后；同一地点在两个时刻分别展示</text>
<rect x="40" y="135" width="360" height="115" rx="10" fill="#ffffff" stroke="#c8d5d1" stroke-width="1.5"/>
<text x="56" y="167" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#24746b" text-anchor="start" font-weight="bold">西墙外高处：阿蘅</text>
<text x="56" y="199" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">看见才报位；母亲在旁照料</text>
<rect x="485" y="145" width="395" height="95" rx="10" fill="#ffffff" stroke="#c8d5d1" stroke-width="1.5"/>
<text x="501" y="177" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#24746b" text-anchor="start" font-weight="bold">台北：李诞</text>
<text x="501" y="209" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">手持长矛，退路向西</text>
<rect x="485" y="440" width="395" height="100" rx="10" fill="#ffffff" stroke="#c8d5d1" stroke-width="1.5"/>
<text x="501" y="472" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#24746b" text-anchor="start" font-weight="bold">台南：程差役</text>
<text x="501" y="504" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">柱旁留备用矛</text>
<rect x="40" y="320" width="360" height="148" rx="10" fill="#ffffff" stroke="#c8d5d1" stroke-width="1.5"/>
<text x="56" y="352" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#24746b" text-anchor="start" font-weight="bold">西墙外：李绡、孙六</text>
<text x="56" y="384" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">李绡操吊篮；孙六拉落梁绳</text>
<text x="56" y="412" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">墙缺通台西；撬杆已备好</text>
<rect x="1060" y="220" width="260" height="130" rx="10" fill="#ffffff" stroke="#c8d5d1" stroke-width="1.5"/>
<text x="1076" y="252" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#24746b" text-anchor="start" font-weight="bold">东侧石门</text>
<text x="1076" y="284" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">蛇从东向西进入</text>
<text x="1076" y="312" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">尾部先离开断桥</text>
<path d="M1050 318 H560" fill="none" stroke="#a74535" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-a74535)"/>
<text x="783" y="303" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21" fill="#a74535" text-anchor="middle" font-weight="normal">蛇身进入台柱之间</text>
<path d="M875 256 V423" fill="none" stroke="#ac7429" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
<text x="920" y="411" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21" fill="#ac7429" text-anchor="start" font-weight="normal">落梁</text>
<path d="M670 247 L678 300" fill="none" stroke="#426aa5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-426aa5)"/>
<path d="M670 433 L690 350" fill="none" stroke="#426aa5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-426aa5)"/>
<path d="M400 397 H508" fill="none" stroke="#24746b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-24746b)"/>
<text x="432" y="375" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#24746b" text-anchor="middle" font-weight="normal">墙缺</text>
<path d="M35 590 H1325" fill="none" stroke="#c8d5d1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="40" y="631" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="25" fill="#24746b" text-anchor="start" font-weight="bold">受困后的台西局部（放大）</text>
<rect x="480" y="700" width="370" height="120" rx="10" fill="#ffffff" stroke="#c8d5d1" stroke-width="1.5"/>
<text x="496" y="732" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#24746b" text-anchor="start" font-weight="bold">李诞：台基西北角</text>
<text x="496" y="764" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">小腿被夹，向西撤离受阻</text>
<rect x="60" y="730" width="355" height="145" rx="10" fill="#ffffff" stroke="#c8d5d1" stroke-width="1.5"/>
<text x="76" y="762" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#24746b" text-anchor="start" font-weight="bold">孙六、李寄母亲</text>
<text x="76" y="794" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">从墙缺进来，站台西撬板</text>
<text x="76" y="822" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">两人不能松杆，板下是小腿</text>
<rect x="60" y="1030" width="355" height="130" rx="10" fill="#ffffff" stroke="#c8d5d1" stroke-width="1.5"/>
<text x="76" y="1062" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#24746b" text-anchor="start" font-weight="bold">李绡：西墙外</text>
<text x="76" y="1094" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">粗绳绕木桩，牵住梁端</text>
<text x="76" y="1122" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">限制断梁倒向救援者</text>
<rect x="930" y="965" width="390" height="140" rx="10" fill="#ffffff" stroke="#c8d5d1" stroke-width="1.5"/>
<text x="946" y="997" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#24746b" text-anchor="start" font-weight="bold">程差役：台南</text>
<text x="946" y="1029" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">取身旁备用矛，抵住蛇头</text>
<text x="946" y="1057" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">不能抽身递剑或撬板</text>
<path d="M1270 760 C1120 735 1040 755 970 825 S805 900 745 870" fill="none" stroke="#a74535" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-a74535)"/>
<circle cx="742" cy="870" r="17" fill="#a74535"/>
<text x="742" y="877" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#fff" text-anchor="middle" font-weight="bold">头</text>
<text x="1060" y="712" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" fill="#a74535" text-anchor="middle" font-weight="normal">蛇颈有断矛撕开的伤口</text>
<path d="M982 959 L785 909" fill="none" stroke="#426aa5" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-426aa5)"/>
<text x="943" y="923" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#426aa5" text-anchor="start" font-weight="normal">抵住下颌</text>
<path d="M415 814 H471" fill="none" stroke="#24746b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-24746b)"/>
<text x="441" y="796" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#24746b" text-anchor="middle" font-weight="normal">撬板</text>
<rect x="470" y="1050" width="395" height="125" rx="10" fill="#ffffff" stroke="#c8d5d1" stroke-width="1.5"/>
<text x="486" y="1082" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#24746b" text-anchor="start" font-weight="bold">李寄：台基西侧开口</text>
<text x="486" y="1114" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">先割缠布；再看清伤口</text>
<text x="486" y="1142" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">听到呼喊，立即退出开口</text>
<path d="M643 1040 L718 930" fill="none" stroke="#24746b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-24746b)"/>
<text x="581" y="978" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#24746b" text-anchor="start" font-weight="normal">贴石沿接近</text>
<path d="M420 1090 H450 V867" fill="none" stroke="#ac7429" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-ac7429)" stroke-dasharray="8 7"/>
<text x="425" y="846" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#ac7429" text-anchor="start" font-weight="normal">梁端</text>
<text x="36" y="1240" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#63777a" text-anchor="start" font-weight="normal">阿蘅的报位不能代替李寄亲眼确认；短剑由父亲跌落处取得，其他人的手正用于救援。</text>
<text x="36" y="1284" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#63777a" text-anchor="start" font-weight="normal">斩蛇后先拖出李诞，再依次退过西墙缺口；程差役从台南最后撤到西坡。</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1000" viewBox="0 0 1360 1000" role="img"><title>戏台决战：先认识分工，再看意外</title><desc>左：入台时；右：差役刺伤蛇后，北侧台架翻倒，李诞受困。</desc><defs><marker id="arrow-24746b" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="12" refY="6" orient="auto-start-reverse"><path d="M0,0 L0,12 L12,6 z" fill="#24746b"/></marker><marker id="arrow-a74535" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="12" refY="6" orient="auto-start-reverse"><path d="M0,0 L0,12 L12,6 z" fill="#a74535"/></marker><marker id="arrow-213d43" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="12" refY="6" orient="auto-start-reverse"><path d="M0,0 L0,12 L12,6 z" fill="#213d43"/></marker><marker id="arrow-63777a" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="12" refY="6" orient="auto-start-reverse"><path d="M0,0 L0,12 L12,6 z" fill="#63777a"/></marker><marker id="arrow-426aa5" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="12" refY="6" orient="auto-start-reverse"><path d="M0,0 L0,12 L12,6 z" fill="#426aa5"/></marker><marker id="arrow-ac7429" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="12" refY="6" orient="auto-start-reverse"><path d="M0,0 L0,12 L12,6 z" fill="#ac7429"/></marker></defs><rect width="1360" height="1000" fill="#faf8f1"/>
<text x="36" y="50" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" fill="#213d43" text-anchor="start" font-weight="normal">戏台决战：先认识分工，再看意外</text>
<text x="36" y="84" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#63777a" text-anchor="start" font-weight="normal">左：入台时；右：差役刺伤蛇后，北侧台架翻倒，李诞受困。</text>
<rect x="35" y="125" width="620" height="710" rx="10" fill="#edf3ee" stroke="#c8d5d1" stroke-width="1.5"/>
<text x="51" y="157" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#24746b" text-anchor="start" font-weight="bold">一、原来的布置</text>
<rect x="705" y="125" width="620" height="710" rx="10" fill="#fff3eb" stroke="#c8d5d1" stroke-width="1.5"/>
<text x="721" y="157" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#24746b" text-anchor="start" font-weight="bold">二、受困后的救援</text>
<rect x="225" y="225" width="370" height="105" rx="10" fill="#ffffff" stroke="#c8d5d1" stroke-width="1.5"/>
<text x="241" y="257" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#24746b" text-anchor="start" font-weight="bold">北石沿：李诞</text>
<text x="241" y="289" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">持矛；西退可到墙缺</text>
<rect x="225" y="540" width="370" height="105" rx="10" fill="#ffffff" stroke="#c8d5d1" stroke-width="1.5"/>
<text x="241" y="572" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#24746b" text-anchor="start" font-weight="bold">南石沿：程差役</text>
<text x="241" y="604" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">持矛；备用矛放手边</text>
<path d="M590 410 H270" fill="none" stroke="#a74535" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-a74535)"/>
<text x="330" y="382" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#a74535" text-anchor="start" font-weight="normal">蛇由东向西进入</text>
<path d="M465 344 V479" fill="none" stroke="#ac7429" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
<text x="476" y="475" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#ac7429" text-anchor="start" font-weight="normal">落梁</text>
<text x="70" y="407" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#24746b" text-anchor="start" font-weight="normal">吊篮</text>
<text x="70" y="437" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#24746b" text-anchor="start" font-weight="normal">引它抬头</text>
<text x="60" y="713" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" fill="#24746b" text-anchor="start" font-weight="normal">墙外：李绡操篮，孙六拉绳放梁</text>
<text x="60" y="753" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#24746b" text-anchor="start" font-weight="normal">梁端粗绳绕桩，防止立刻弹开</text>
<rect x="735" y="225" width="550" height="115" rx="10" fill="#ffffff" stroke="#c8d5d1" stroke-width="1.5"/>
<text x="751" y="257" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#24746b" text-anchor="start" font-weight="bold">台西：父亲腿被夹住</text>
<text x="751" y="289" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">孙六、母亲撬木料；李寄来接应</text>
<rect x="735" y="390" width="260" height="180" rx="10" fill="#ffffff" stroke="#c8d5d1" stroke-width="1.5"/>
<text x="751" y="422" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#24746b" text-anchor="start" font-weight="bold">近处的李寄</text>
<text x="751" y="454" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">短剑落在父亲身侧</text>
<text x="751" y="482" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">先参与救人</text>
<text x="751" y="510" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">听报位后亲眼看伤口</text>
<rect x="1015" y="390" width="270" height="180" rx="10" fill="#ffffff" stroke="#c8d5d1" stroke-width="1.5"/>
<text x="1031" y="422" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#a74535" text-anchor="start" font-weight="bold">蛇颈下的伤口</text>
<text x="1031" y="454" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">程差役先用矛刺伤</text>
<text x="1031" y="482" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">断杆撕开裂口</text>
<text x="1031" y="510" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">备用矛挡住蛇头</text>
<path d="M995 477 H1009" fill="none" stroke="#a74535" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-a74535)"/>
<rect x="735" y="615" width="550" height="150" rx="10" fill="#ffffff" stroke="#c8d5d1" stroke-width="1.5"/>
<text x="751" y="647" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#24746b" text-anchor="start" font-weight="bold">仍在救援的同伴</text>
<text x="751" y="679" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">李绡隔墙牵住梁端，争取片刻</text>
<text x="751" y="707" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">阿蘅在跪牛石报位；看不见就直说</text>
<text x="751" y="735" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">李寄出剑后退回台西，众人一起撤</text>
<text x="36" y="902" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#63777a" text-anchor="start" font-weight="normal">最后一剑用已有兵刃、已有伤口和众人争取的机会；不是临时练成高明剑术。</text>
<text x="36" y="939" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#63777a" text-anchor="start" font-weight="normal">灯照台西退路；高处的声音传递位置。灯、歌与鼓均不控制蛇。</text>
</svg>
<text x="36" y="84" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#63777a" text-anchor="start" font-weight="normal">北在上 · 位置与连通示意，不按比例 · 绿色是人的路，红色是蛇失控后的路</text>

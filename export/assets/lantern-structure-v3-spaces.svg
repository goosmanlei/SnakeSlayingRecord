<rect x="1050" y="495" width="270" height="164" rx="10" fill="#ffffff" stroke="#c8d5d1" stroke-width="1.5"/>
<text x="1066" y="527" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#24746b" text-anchor="start" font-weight="bold">仓院</text>
<text x="1066" y="559" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">西门朝木桥</text>
<text x="1066" y="587" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">南门下石坎撤离</text>
<text x="1066" y="615" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">南侧有拌饵棚</text>
<rect x="865" y="607" width="184" height="38" fill="#c6aa7f"/>
<text x="958" y="592" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21" fill="#ac7429" text-anchor="middle" font-weight="normal">木桥</text>
<text x="470" y="810" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21" fill="#63777a" text-anchor="start" font-weight="normal">南面正门 → 下山大道</text>
<rect x="730" y="880" width="590" height="110" rx="10" fill="#ffffff" stroke="#c8d5d1" stroke-width="1.5"/>
<text x="746" y="912" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#24746b" text-anchor="start" font-weight="bold">干沟南端缓坡 → 晒场</text>
<text x="746" y="944" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">仓院撤离、接孩子与搬粮的路线</text>

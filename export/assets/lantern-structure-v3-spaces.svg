<text x="895" y="428" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" fill="#63777a" text-anchor="start" font-weight="normal">沟西岸</text>
<text x="36" y="1030" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#63777a" text-anchor="start" font-weight="normal">出木屋 ≠ 出庙院；桥断后仍能绕沟南走。东侧通道出口在沟西，不能跳过木桥直接到仓门。</text>

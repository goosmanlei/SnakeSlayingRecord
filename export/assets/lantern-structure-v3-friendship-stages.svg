<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="970" viewBox="0 0 1360 970" role="img"><title>李寄与阿蘅：五个阶段</title><desc>关心始终存在；修复发生在共同生活和选择中</desc><defs><marker id="arrow-24746b" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="12" refY="6" orient="auto-start-reverse"><path d="M0,0 L0,12 L12,6 z" fill="#24746b"/></marker><marker id="arrow-a74535" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="12" refY="6" orient="auto-start-reverse"><path d="M0,0 L0,12 L12,6 z" fill="#a74535"/></marker><marker id="arrow-213d43" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="12" refY="6" orient="auto-start-reverse"><path d="M0,0 L0,12 L12,6 z" fill="#213d43"/></marker><marker id="arrow-63777a" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="12" refY="6" orient="auto-start-reverse"><path d="M0,0 L0,12 L12,6 z" fill="#63777a"/></marker><marker id="arrow-426aa5" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="12" refY="6" orient="auto-start-reverse"><path d="M0,0 L0,12 L12,6 z" fill="#426aa5"/></marker><marker id="arrow-ac7429" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="12" refY="6" orient="auto-start-reverse"><path d="M0,0 L0,12 L12,6 z" fill="#ac7429"/></marker></defs><rect width="1360" height="970" fill="#faf8f1"/>
<text x="36" y="50" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" fill="#213d43" text-anchor="start" font-weight="normal">李寄与阿蘅：五个阶段</text>
<text x="36" y="84" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#63777a" text-anchor="start" font-weight="normal">关心始终存在；修复发生在共同生活和选择中</text>
<circle cx="63" cy="167" r="17" fill="#24746b"/>
<text x="63" y="174" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#fff" text-anchor="middle" font-weight="bold">1</text>
<rect x="100" y="130" width="1220" height="128" rx="10" fill="#ffffff" stroke="#c8d5d1" stroke-width="1.5"/>
<text x="116" y="162" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#24746b" text-anchor="start" font-weight="bold">一起长大</text>
<text x="116" y="194" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">跟歌、搬物、玩笑，知道对方的习惯</text>
<text x="116" y="222" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">父辈故交让两家长期往来</text>
<path d="M63 190 V273" fill="none" stroke="#24746b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-24746b)"/>
<circle cx="63" cy="320" r="17" fill="#24746b"/>
<text x="63" y="327" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#fff" text-anchor="middle" font-weight="bold">2</text>
<rect x="100" y="283" width="1220" height="128" rx="10" fill="#ffffff" stroke="#c8d5d1" stroke-width="1.5"/>
<text x="116" y="315" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#24746b" text-anchor="start" font-weight="bold">歌本受损</text>
<text x="116" y="347" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">李寄害怕朋友遇害，冲动扔本</text>
<text x="116" y="375" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">阿蘅感到关心，也为失约、生计和被越过而生气</text>
<path d="M63 343 V426" fill="none" stroke="#24746b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-24746b)"/>
<circle cx="63" cy="473" r="17" fill="#24746b"/>
<text x="63" y="480" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#fff" text-anchor="middle" font-weight="bold">3</text>
<rect x="100" y="436" width="1220" height="128" rx="10" fill="#ffffff" stroke="#c8d5d1" stroke-width="1.5"/>
<text x="116" y="468" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#24746b" text-anchor="start" font-weight="bold">重新商量</text>
<text x="116" y="500" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">补纸、安排零活；说清债务与照料困难</text>
<text x="116" y="528" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">父亲应募后，李寄也开始害怕失去亲人</text>
<path d="M63 496 V579" fill="none" stroke="#24746b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-24746b)"/>
<circle cx="63" cy="626" r="17" fill="#24746b"/>
<text x="63" y="633" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#fff" text-anchor="middle" font-weight="bold">4</text>
<rect x="100" y="589" width="1220" height="128" rx="10" fill="#ffffff" stroke="#c8d5d1" stroke-width="1.5"/>
<text x="116" y="621" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#24746b" text-anchor="start" font-weight="bold">共同救援</text>
<text x="116" y="653" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">李寄回应求救；阿蘅在高处报真实位置</text>
<text x="116" y="681" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">听见撤退就退；看不清就说看不清</text>
<path d="M63 649 V732" fill="none" stroke="#24746b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-24746b)"/>
<circle cx="63" cy="779" r="17" fill="#24746b"/>
<text x="63" y="786" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#fff" text-anchor="middle" font-weight="bold">5</text>
<rect x="100" y="742" width="1220" height="128" rx="10" fill="#ffffff" stroke="#c8d5d1" stroke-width="1.5"/>
<text x="116" y="774" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#24746b" text-anchor="start" font-weight="bold">各自生活</text>
<text x="116" y="806" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">共同补词，先问学唱的愿望</text>
<text x="116" y="834" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">商量母亲照料、行期与回来再见的日子</text>
</svg>
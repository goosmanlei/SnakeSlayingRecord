<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="920" viewBox="0 0 1360 920" role="img"><title>仓院救人：守住西口，从南门撤出</title><desc>两个动作依次完成：先疏散大部分乡人，再引开蛇让守门者脱身。</desc><defs><marker id="arrow-24746b" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="12" refY="6" orient="auto-start-reverse"><path d="M0,0 L0,12 L12,6 z" fill="#24746b"/></marker><marker id="arrow-a74535" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="12" refY="6" orient="auto-start-reverse"><path d="M0,0 L0,12 L12,6 z" fill="#a74535"/></marker><marker id="arrow-213d43" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="12" refY="6" orient="auto-start-reverse"><path d="M0,0 L0,12 L12,6 z" fill="#213d43"/></marker><marker id="arrow-63777a" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="12" refY="6" orient="auto-start-reverse"><path d="M0,0 L0,12 L12,6 z" fill="#63777a"/></marker><marker id="arrow-426aa5" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="12" refY="6" orient="auto-start-reverse"><path d="M0,0 L0,12 L12,6 z" fill="#426aa5"/></marker><marker id="arrow-ac7429" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="12" refY="6" orient="auto-start-reverse"><path d="M0,0 L0,12 L12,6 z" fill="#ac7429"/></marker></defs><rect width="1360" height="920" fill="#faf8f1"/>
<text x="36" y="50" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" fill="#213d43" text-anchor="start" font-weight="normal">仓院救人：守住西口，从南门撤出</text>
<text x="36" y="84" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#63777a" text-anchor="start" font-weight="normal">两个动作依次完成：先疏散大部分乡人，再引开蛇让守门者脱身。</text>
<rect x="50" y="180" width="350" height="320" rx="10" fill="#edf3ee" stroke="#c8d5d1" stroke-width="1.5"/>
<text x="66" y="212" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#24746b" text-anchor="start" font-weight="bold">庙院</text>
<text x="66" y="244" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">西坡进入，沿空场到东门</text>
<text x="66" y="272" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">李绡、李寄从这一侧放饵</text>
<text x="66" y="300" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">随后退回西坡</text>
<rect x="540" y="180" width="270" height="220" rx="10" fill="#f8ede6" stroke="#c8d5d1" stroke-width="1.5"/>
<text x="556" y="212" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#a74535" text-anchor="start" font-weight="bold">两院相连的门</text>
<text x="556" y="244" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">蛇头逼住仓院西口</text>
<text x="556" y="272" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">李诞、陶伯抵门板</text>
<text x="556" y="300" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">程差役赶来支援</text>
<rect x="930" y="180" width="360" height="260" rx="10" fill="#ffffff" stroke="#c8d5d1" stroke-width="1.5"/>
<text x="946" y="212" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#24746b" text-anchor="start" font-weight="bold">仓院</text>
<text x="946" y="244" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">乡人、粮堆在门内</text>
<text x="946" y="272" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">周掌柜说明去晒场续发</text>
<text x="946" y="300" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">老人孩子由南门接出</text>
<path d="M535 270 H405" fill="none" stroke="#a74535" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-a74535)"/>
<text x="410" y="247" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#a74535" text-anchor="start" font-weight="normal">引离仓门</text>
<path d="M1110 440 V625" fill="none" stroke="#24746b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-24746b)"/>
<text x="1126" y="541" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#24746b" text-anchor="start" font-weight="normal">南门台阶</text>
<rect x="850" y="630" width="440" height="135" rx="10" fill="#ffffff" stroke="#c8d5d1" stroke-width="1.5"/>
<text x="866" y="662" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#24746b" text-anchor="start" font-weight="bold">晒场</text>
<text x="866" y="694" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">先接人，能顺手带走的粮再带</text>
<text x="866" y="722" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">掌柜核票续发，伤者下山求援</text>
<path d="M850 725 H235 V505" fill="none" stroke="#24746b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-24746b)" stroke-dasharray="8 7"/>
<text x="345" y="702" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" fill="#24746b" text-anchor="start" font-weight="normal">院外路回西坡，不穿蛇身</text>
<text x="36" y="850" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#63777a" text-anchor="start" font-weight="normal">蛇退开后，守门者走南门和院外路返回；两院之间不设断桥或额外暗道。</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1000" viewBox="0 0 1360 1000" role="img"><title>第一阶段：先出木屋，再出庙院</title><desc>局部放大 · 图中标出阿蘅被救出的先后位置，不表示同一时刻有多个阿蘅</desc><defs><marker id="arrow-24746b" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="12" refY="6" orient="auto-start-reverse"><path d="M0,0 L0,12 L12,6 z" fill="#24746b"/></marker><marker id="arrow-a74535" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="12" refY="6" orient="auto-start-reverse"><path d="M0,0 L0,12 L12,6 z" fill="#a74535"/></marker><marker id="arrow-213d43" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="12" refY="6" orient="auto-start-reverse"><path d="M0,0 L0,12 L12,6 z" fill="#213d43"/></marker><marker id="arrow-63777a" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="12" refY="6" orient="auto-start-reverse"><path d="M0,0 L0,12 L12,6 z" fill="#63777a"/></marker><marker id="arrow-426aa5" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="12" refY="6" orient="auto-start-reverse"><path d="M0,0 L0,12 L12,6 z" fill="#426aa5"/></marker><marker id="arrow-ac7429" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="12" refY="6" orient="auto-start-reverse"><path d="M0,0 L0,12 L12,6 z" fill="#ac7429"/></marker></defs><rect width="1360" height="1000" fill="#faf8f1"/>
<text x="36" y="50" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" fill="#213d43" text-anchor="start" font-weight="normal">第一阶段：先出木屋，再出庙院</text>
<text x="36" y="84" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#63777a" text-anchor="start" font-weight="normal">局部放大 · 图中标出阿蘅被救出的先后位置，不表示同一时刻有多个阿蘅</text>
<rect x="465" y="150" width="755" height="585" fill="#efeee4"/><path d="M465 150 V530 M465 625 V735" stroke="#63777a" stroke-width="13"/>
<text x="350" y="180" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="25" fill="#24746b" text-anchor="start" font-weight="normal">院外后坡</text>
<text x="820" y="180" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="25" fill="#63777a" text-anchor="start" font-weight="normal">庙院内</text>
<rect x="620" y="235" width="400" height="235" rx="10" fill="#ffffff" stroke="#c8d5d1" stroke-width="1.5"/>
<text x="636" y="267" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#24746b" text-anchor="start" font-weight="bold">井旁木屋</text>
<text x="636" y="299" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">阿蘅被锁在屋内</text>
<text x="636" y="327" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">后墙朝西；南面是庙院</text>
<text x="636" y="355" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">账签与祭衣在屋中箱内</text>
<text x="504" y="250" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#63777a" text-anchor="start" font-weight="normal">窄道</text>
<text x="485" y="293" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#63777a" text-anchor="start" font-weight="normal">仍在院内</text>
<path d="M820 420 H566 V575 H355" fill="none" stroke="#24746b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-24746b)"/>
<circle cx="800" cy="420" r="17" fill="#24746b"/>
<text x="800" y="427" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#fff" text-anchor="middle" font-weight="bold">1</text>
<circle cx="565" cy="495" r="17" fill="#24746b"/>
<text x="565" y="502" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#fff" text-anchor="middle" font-weight="bold">2</text>
<circle cx="415" cy="575" r="17" fill="#24746b"/>
<text x="415" y="582" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#fff" text-anchor="middle" font-weight="bold">3</text>
<path d="M470 545 L455 600 M470 570 L455 625" fill="none" stroke="#a74535" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<text x="490" y="630" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" fill="#a74535" text-anchor="start" font-weight="normal">封住缺口的厚板</text>
<rect x="50" y="315" width="330" height="132" rx="10" fill="#ffffff" stroke="#c8d5d1" stroke-width="1.5"/>
<text x="66" y="347" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#24746b" text-anchor="start" font-weight="bold">先拆屋后墙</text>
<text x="66" y="379" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">李绡、李寄接人</text>
<text x="66" y="407" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">程差役撬西墙缺口挡板</text>
<rect x="50" y="680" width="340" height="130" rx="10" fill="#ffffff" stroke="#c8d5d1" stroke-width="1.5"/>
<text x="66" y="712" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#24746b" text-anchor="start" font-weight="bold">穿过西墙缺口后</text>
<text x="66" y="744" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">孙六接阿蘅与受伤的墨耳</text>
<text x="66" y="772" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">送到石后，交母亲照料</text>
<path d="M950 550 H605 V585" fill="none" stroke="#a74535" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-a74535)"/>
<text x="802" y="523" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="22" fill="#a74535" text-anchor="start" font-weight="normal">蛇绕木屋南角逼近</text>
<path d="M1020 590 H1170 V735" fill="none" stroke="#a74535" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-a74535)" stroke-dasharray="8 7"/>
<text x="985" y="783" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21" fill="#a74535" text-anchor="start" font-weight="normal">随后被漏饵引向东侧通道</text>
<text x="36" y="878" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">① 离开锁住的屋子　② 到屋后窄道　③ 拆开挡板、真正出庙院</text>
<text x="36" y="923" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#63777a" text-anchor="start" font-weight="normal">墨耳护人与众人救狗发生在最后撤出之前；阿蘅此后不再返回院内。</text>
</svg>
<text x="492" y="219" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" fill="#203b41" font-weight="normal" text-anchor="start">歌本失约；同伴受伤</text>
<rect x="779" y="157" width="277" height="98" rx="12" fill="#fff" stroke="#d5dcd6"/>
<rect x="779" y="169" width="4" height="74" rx="2" fill="#33766b"/>
<text x="797" y="189" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21" fill="#33766b" font-weight="bold" text-anchor="start"></text>
<text x="797" y="219" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" fill="#203b41" font-weight="normal" text-anchor="start">听清情况，仍敢作决定</text>

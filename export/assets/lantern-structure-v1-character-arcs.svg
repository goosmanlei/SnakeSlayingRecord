<rect x="169" y="677" width="4" height="74" rx="2" fill="#33766b"/>
<text x="187" y="697" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21" fill="#33766b" font-weight="bold" text-anchor="start"></text>
<text x="187" y="727" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" fill="#203b41" font-weight="normal" text-anchor="start">朴实、怕蛇、重情分</text>
<rect x="474" y="665" width="277" height="98" rx="12" fill="#fff" stroke="#d5dcd6"/>
<rect x="474" y="677" width="4" height="74" rx="2" fill="#33766b"/>
<text x="492" y="697" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21" fill="#33766b" font-weight="bold" text-anchor="start"></text>
<text x="492" y="727" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" fill="#203b41" font-weight="normal" text-anchor="start">同伴和女孩身陷危险</text>
<rect x="779" y="665" width="277" height="98" rx="12" fill="#fff" stroke="#d5dcd6"/>
<rect x="779" y="677" width="4" height="74" rx="2" fill="#33766b"/>
<text x="797" y="697" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21" fill="#33766b" font-weight="bold" text-anchor="start"></text>
<text x="797" y="727" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" fill="#203b41" font-weight="normal" text-anchor="start">从护送接应到撬板救人</text>
<path d="M447,715 L468,715" fill="none" stroke="#33766b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M752,715 L773,715" fill="none" stroke="#33766b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="36" y="826" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="15" fill="#53696d" font-weight="normal" text-anchor="start">阿蘅与李寄互相承担；成年人持续承担保护责任。</text>

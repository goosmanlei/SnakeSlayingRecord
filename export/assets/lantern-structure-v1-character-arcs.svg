<rect x="779" y="550" width="4" height="74" rx="2" fill="#33766b"/>
<text x="797" y="570" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21" fill="#33766b" font-weight="bold" text-anchor="start"></text>
<text x="797" y="600" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" fill="#203b41" font-weight="normal" text-anchor="start">接人求援，再承担险处</text>

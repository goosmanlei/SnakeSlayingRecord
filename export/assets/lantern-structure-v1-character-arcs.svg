<rect x="779" y="423" width="4" height="74" rx="2" fill="#33766b"/>
<text x="797" y="443" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21" fill="#33766b" font-weight="bold" text-anchor="start"></text>
<text x="797" y="473" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" fill="#203b41" font-weight="normal" text-anchor="start">共同承担损耗，留好退路</text>
<path d="M447,461 L468,461" fill="none" stroke="#33766b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M752,461 L773,461" fill="none" stroke="#33766b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="37" y="592" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#203b41" font-weight="bold" text-anchor="start">李诞</text>
<rect x="169" y="538" width="277" height="98" rx="12" fill="#fff" stroke="#d5dcd6"/>
<rect x="169" y="550" width="4" height="74" rx="2" fill="#33766b"/>
<text x="187" y="570" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21" fill="#33766b" font-weight="bold" text-anchor="start"></text>
<text x="187" y="600" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" fill="#203b41" font-weight="normal" text-anchor="start">谨慎、重责任</text>

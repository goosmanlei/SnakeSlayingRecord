<text x="803" y="128" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#33766b" font-weight="bold" text-anchor="start">后续行动</text>
<text x="37" y="211" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#203b41" font-weight="bold" text-anchor="start">李寄</text>
<rect x="169" y="157" width="277" height="98" rx="12" fill="#fff" stroke="#d5dcd6"/>
<rect x="169" y="169" width="4" height="74" rx="2" fill="#33766b"/>
<text x="187" y="189" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21" fill="#33766b" font-weight="bold" text-anchor="start"></text>
<text x="187" y="219" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" fill="#203b41" font-weight="normal" text-anchor="start">率直、急于护人</text>
<rect x="474" y="157" width="277" height="98" rx="12" fill="#fff" stroke="#d5dcd6"/>
<rect x="474" y="169" width="4" height="74" rx="2" fill="#33766b"/>

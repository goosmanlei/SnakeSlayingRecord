<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="850" viewBox="0 0 1120 850" role="img"><title>人物底色与变化</title><desc>每个人保持自己的性格；经历改变的是判断和相处方式。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto-start-reverse"><path d="M0,0 L0,6 L7,3 z" fill="context-stroke"/></marker></defs><rect width="1120" height="850" fill="#faf8f1"/>
<text x="36" y="48" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" fill="#203b41" font-weight="bold" text-anchor="start">人物底色与变化</text>
<text x="36" y="80" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" fill="#53696d" font-weight="normal" text-anchor="start">每个人保持自己的性格；经历改变的是判断和相处方式。</text>
<text x="190" y="128" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#33766b" font-weight="bold" text-anchor="start">稳定底色</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1070" viewBox="0 0 1360 1070" role="img"><title>事件、盘算与后果</title><desc>每次改变行动目标，都有新的危险或明确选择</desc><defs><marker id="arrow-24746b" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="12" refY="6" orient="auto-start-reverse"><path d="M0,0 L0,12 L12,6 z" fill="#24746b"/></marker><marker id="arrow-a74535" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="12" refY="6" orient="auto-start-reverse"><path d="M0,0 L0,12 L12,6 z" fill="#a74535"/></marker><marker id="arrow-213d43" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="12" refY="6" orient="auto-start-reverse"><path d="M0,0 L0,12 L12,6 z" fill="#213d43"/></marker><marker id="arrow-63777a" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="12" refY="6" orient="auto-start-reverse"><path d="M0,0 L0,12 L12,6 z" fill="#63777a"/></marker><marker id="arrow-426aa5" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="12" refY="6" orient="auto-start-reverse"><path d="M0,0 L0,12 L12,6 z" fill="#426aa5"/></marker><marker id="arrow-ac7429" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="12" refY="6" orient="auto-start-reverse"><path d="M0,0 L0,12 L12,6 z" fill="#ac7429"/></marker></defs><rect width="1360" height="1070" fill="#faf8f1"/>
<text x="36" y="50" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" fill="#213d43" text-anchor="start" font-weight="normal">事件、盘算与后果</text>
<text x="36" y="84" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#63777a" text-anchor="start" font-weight="normal">每次改变行动目标，都有新的危险或明确选择</text>
<circle cx="62" cy="162" r="17" fill="#24746b"/>
<text x="62" y="169" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#fff" text-anchor="middle" font-weight="bold">1</text>
<rect x="99" y="125" width="1225" height="102" rx="10" fill="#ffffff" stroke="#c8d5d1" stroke-width="1.5"/>
<text x="115" y="157" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#24746b" text-anchor="start" font-weight="bold">保护朋友，却先伤了她</text>
<text x="115" y="189" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">李寄扔本，阿蘅失约；旧债与祭名继续逼近。</text>
<path d="M62 185 V242" fill="none" stroke="#24746b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-24746b)"/>
<circle cx="62" cy="288" r="17" fill="#24746b"/>
<text x="62" y="295" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#fff" text-anchor="middle" font-weight="bold">2</text>
<rect x="99" y="251" width="1225" height="102" rx="10" fill="#ffffff" stroke="#c8d5d1" stroke-width="1.5"/>
<text x="115" y="283" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#24746b" text-anchor="start" font-weight="bold">争取县里的力量</text>
<text x="115" y="315" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">成人承担风险，展示准备，县丞从怀疑到有限支持。</text>
<path d="M62 311 V368" fill="none" stroke="#24746b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-24746b)"/>
<circle cx="62" cy="414" r="17" fill="#a74535"/>
<text x="62" y="421" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#fff" text-anchor="middle" font-weight="bold">3</text>
<rect x="99" y="377" width="1225" height="102" rx="10" fill="#ffffff" stroke="#c8d5d1" stroke-width="1.5"/>
<text x="115" y="409" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#24746b" text-anchor="start" font-weight="bold">庙方赌县里仍会需要自己</text>
<text x="115" y="441" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">县丞不愿废祭查账；庙方扣人、先喂蛇，想以安神挤掉试杀。</text>
<path d="M62 437 V494" fill="none" stroke="#a74535" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-a74535)"/>
<circle cx="62" cy="540" r="17" fill="#a74535"/>
<text x="62" y="547" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#fff" text-anchor="middle" font-weight="bold">4</text>
<rect x="99" y="503" width="1225" height="102" rx="10" fill="#ffffff" stroke="#c8d5d1" stroke-width="1.5"/>
<text x="115" y="535" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#24746b" text-anchor="start" font-weight="bold">提前开闸与漏饵打破盘算</text>
<text x="115" y="567" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">救阿蘅尚未结束，蛇循漏饵出东侧通道，压塌木桥、威胁仓门。</text>
<path d="M62 563 V620" fill="none" stroke="#a74535" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-a74535)"/>
<circle cx="62" cy="666" r="17" fill="#24746b"/>
<text x="62" y="673" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#fff" text-anchor="middle" font-weight="bold">5</text>
<rect x="99" y="629" width="1225" height="102" rx="10" fill="#ffffff" stroke="#c8d5d1" stroke-width="1.5"/>
<text x="115" y="661" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#24746b" text-anchor="start" font-weight="bold">先保住人，再把蛇引离人群</text>
<text x="115" y="693" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">西坡安置伤者，沟南撤人搬粮；用食饵将蛇引回空戏台。</text>
<path d="M62 689 V746" fill="none" stroke="#24746b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-24746b)"/>
<circle cx="62" cy="792" r="17" fill="#24746b"/>
<text x="62" y="799" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#fff" text-anchor="middle" font-weight="bold">6</text>
<rect x="99" y="755" width="1225" height="102" rx="10" fill="#ffffff" stroke="#c8d5d1" stroke-width="1.5"/>
<text x="115" y="787" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#24746b" text-anchor="start" font-weight="bold">试杀转为救被困的父亲</text>
<text x="115" y="819" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">梁与矛只能暂拦，蛇反击毁退路；众人各守一处，李寄完成最后一剑。</text>
<path d="M62 815 V872" fill="none" stroke="#24746b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-24746b)"/>
<circle cx="62" cy="918" r="17" fill="#24746b"/>
<text x="62" y="925" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#fff" text-anchor="middle" font-weight="bold">7</text>
<rect x="99" y="881" width="1225" height="102" rx="10" fill="#ffffff" stroke="#c8d5d1" stroke-width="1.5"/>
<text x="115" y="913" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#24746b" text-anchor="start" font-weight="bold">支持不能抵消旧账</text>
<text x="115" y="945" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">救治、遗物、复查；庙方作恶与县里的失察分别追责。</text>
</svg>
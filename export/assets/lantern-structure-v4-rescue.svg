<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="790" viewBox="0 0 1360 790" role="img"><title>木屋救援：先出屋，再出院</title><desc>阿蘅被扣时，李家正在按约撤离；庙工随后封住西墙缺口。</desc><defs><marker id="arrow-24746b" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="12" refY="6" orient="auto-start-reverse"><path d="M0,0 L0,12 L12,6 z" fill="#24746b"/></marker><marker id="arrow-a74535" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="12" refY="6" orient="auto-start-reverse"><path d="M0,0 L0,12 L12,6 z" fill="#a74535"/></marker><marker id="arrow-213d43" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="12" refY="6" orient="auto-start-reverse"><path d="M0,0 L0,12 L12,6 z" fill="#213d43"/></marker><marker id="arrow-63777a" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="12" refY="6" orient="auto-start-reverse"><path d="M0,0 L0,12 L12,6 z" fill="#63777a"/></marker><marker id="arrow-426aa5" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="12" refY="6" orient="auto-start-reverse"><path d="M0,0 L0,12 L12,6 z" fill="#426aa5"/></marker><marker id="arrow-ac7429" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="12" refY="6" orient="auto-start-reverse"><path d="M0,0 L0,12 L12,6 z" fill="#ac7429"/></marker></defs><rect width="1360" height="790" fill="#faf8f1"/>
<text x="36" y="50" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" fill="#213d43" text-anchor="start" font-weight="normal">木屋救援：先出屋，再出院</text>
<text x="36" y="84" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#63777a" text-anchor="start" font-weight="normal">阿蘅被扣时，李家正在按约撤离；庙工随后封住西墙缺口。</text>
<rect x="70" y="145" width="330" height="210" rx="10" fill="#ffffff" stroke="#c8d5d1" stroke-width="1.5"/>
<text x="86" y="177" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#24746b" text-anchor="start" font-weight="bold">木屋里：阿蘅</text>
<text x="86" y="209" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">前门被赵执事锁住</text>
<text x="86" y="237" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">后墙脚有勘查时见过的朽板</text>
<text x="86" y="265" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">用木销敲两下求援</text>
<rect x="490" y="145" width="340" height="210" rx="10" fill="#ffffff" stroke="#c8d5d1" stroke-width="1.5"/>
<text x="506" y="177" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#24746b" text-anchor="start" font-weight="bold">屋后窄道：姐妹接人</text>
<text x="506" y="209" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">李绡拆板，李寄托住阿蘅</text>
<text x="506" y="237" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">程差役守住南侧转角</text>
<text x="506" y="265" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">出来后仍在院墙里面</text>
<rect x="920" y="145" width="370" height="210" rx="10" fill="#ffffff" stroke="#c8d5d1" stroke-width="1.5"/>
<text x="936" y="177" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#24746b" text-anchor="start" font-weight="bold">墙缺：孙六与母亲</text>
<text x="936" y="209" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">厚板是当场新钉的</text>
<text x="936" y="237" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">两人分别从内外撬开</text>
<text x="936" y="265" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">接人到西坡、包伤</text>
<path d="M400 250 H485" fill="none" stroke="#24746b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-24746b)"/>
<path d="M830 250 H915" fill="none" stroke="#24746b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-24746b)"/>
<rect x="70" y="460" width="535" height="160" rx="10" fill="#f8ede6" stroke="#c8d5d1" stroke-width="1.5"/>
<text x="86" y="492" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#a74535" text-anchor="start" font-weight="bold">蛇到木屋附近</text>
<text x="86" y="524" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">开闸失控；漏饵先洒在屋前</text>
<text x="86" y="552" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">差役挡蛇，墨耳护人受伤</text>
<rect x="755" y="460" width="535" height="160" rx="10" fill="#f8ede6" stroke="#c8d5d1" stroke-width="1.5"/>
<text x="771" y="492" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#a74535" text-anchor="start" font-weight="bold">漏饵转向仓院</text>
<text x="771" y="524" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">庙工提桶逃向东门，蛇循味离开</text>
<text x="771" y="552" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">这段空隙让救援者接回墨耳并撤出</text>
<path d="M605 530 H750" fill="none" stroke="#a74535" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-a74535)"/>
<text x="36" y="700" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#63777a" text-anchor="start" font-weight="normal">每一步先交代障碍和目的，再写动作；阿蘅获救后留在跪牛石旁，不重回院内。</text>
</svg>
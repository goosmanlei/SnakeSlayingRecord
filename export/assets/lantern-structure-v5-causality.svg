<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1030" viewBox="0 0 1360 1030" role="img"><title>计划怎样被打断，又怎样接续</title><desc>每次改变目标，先给出触发原因和眼前必须解决的事。</desc><defs><marker id="arrow-24746b" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="12" refY="6" orient="auto-start-reverse"><path d="M0,0 L0,12 L12,6 z" fill="#24746b"/></marker><marker id="arrow-a74535" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="12" refY="6" orient="auto-start-reverse"><path d="M0,0 L0,12 L12,6 z" fill="#a74535"/></marker><marker id="arrow-213d43" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="12" refY="6" orient="auto-start-reverse"><path d="M0,0 L0,12 L12,6 z" fill="#213d43"/></marker><marker id="arrow-63777a" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="12" refY="6" orient="auto-start-reverse"><path d="M0,0 L0,12 L12,6 z" fill="#63777a"/></marker><marker id="arrow-426aa5" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="12" refY="6" orient="auto-start-reverse"><path d="M0,0 L0,12 L12,6 z" fill="#426aa5"/></marker><marker id="arrow-ac7429" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="12" refY="6" orient="auto-start-reverse"><path d="M0,0 L0,12 L12,6 z" fill="#ac7429"/></marker></defs><rect width="1360" height="1030" fill="#faf8f1"/>
<text x="36" y="50" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" fill="#213d43" text-anchor="start" font-weight="normal">计划怎样被打断，又怎样接续</text>
<text x="36" y="84" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#63777a" text-anchor="start" font-weight="normal">每次改变目标，先给出触发原因和眼前必须解决的事。</text>
<rect x="40" y="135" width="1280" height="95" rx="10" fill="#fff" stroke="#c8d5d1" stroke-width="1.5"/>
<text x="56" y="167" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#24746b" text-anchor="start" font-weight="bold">原计划</text>
<text x="215" y="191" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" fill="#213d43" text-anchor="start" font-weight="normal">清空两院、晒场续发粮 → 空戏台诱蛇、落梁、持矛 → 不成便撤</text>
<path d="M105 230 V249" fill="none" stroke="#24746b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-24746b)"/>
<rect x="40" y="253" width="1280" height="95" rx="10" fill="#fff1ea" stroke="#c8d5d1" stroke-width="1.5"/>
<text x="56" y="285" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#a74535" text-anchor="start" font-weight="bold">庙方盘算</text>
<text x="215" y="309" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" fill="#213d43" text-anchor="start" font-weight="normal">拖住领粮者、扣阿蘅停试 → 正常供食收蛇 → 向乡老证明还得靠庙方</text>
<path d="M105 348 V367" fill="none" stroke="#a74535" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-a74535)"/>
<rect x="40" y="371" width="1280" height="95" rx="10" fill="#fff1ea" stroke="#c8d5d1" stroke-width="1.5"/>
<text x="56" y="403" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#a74535" text-anchor="start" font-weight="bold">真正发生</text>
<text x="215" y="427" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" fill="#213d43" text-anchor="start" font-weight="normal">阻拦变成伤差役 → 仓促开闸、漏饵 → 蛇逼木屋，又追到仓门</text>
<path d="M105 466 V485" fill="none" stroke="#a74535" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-a74535)"/>
<rect x="40" y="489" width="1280" height="95" rx="10" fill="#fff" stroke="#c8d5d1" stroke-width="1.5"/>
<text x="56" y="521" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#24746b" text-anchor="start" font-weight="bold">先救人</text>
<text x="215" y="545" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" fill="#213d43" text-anchor="start" font-weight="normal">拆屋板、撬墙缺 → 阿蘅与墨耳留西坡 → 仓院南门接人，守住西口</text>
<path d="M105 584 V603" fill="none" stroke="#24746b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-24746b)"/>
<rect x="40" y="607" width="1280" height="95" rx="10" fill="#fff" stroke="#c8d5d1" stroke-width="1.5"/>
<text x="56" y="639" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#24746b" text-anchor="start" font-weight="bold">把危险引开</text>
<text x="215" y="663" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" fill="#213d43" text-anchor="start" font-weight="normal">阿蘅观察漏饵 → 孙六传话 → 李绡走外路，在庙院一侧放饵</text>
<path d="M105 702 V721" fill="none" stroke="#24746b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-24746b)"/>
<rect x="40" y="725" width="1280" height="95" rx="10" fill="#fff" stroke="#c8d5d1" stroke-width="1.5"/>
<text x="56" y="757" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#24746b" text-anchor="start" font-weight="bold">复用准备</text>
<text x="215" y="781" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" fill="#213d43" text-anchor="start" font-weight="normal">人群未走远 → 引蛇留在空戏台 → 成人刺伤蛇 → 回救受困父亲</text>
<path d="M105 820 V839" fill="none" stroke="#24746b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-24746b)"/>
<rect x="40" y="843" width="1280" height="95" rx="10" fill="#fff" stroke="#c8d5d1" stroke-width="1.5"/>
<text x="56" y="875" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#24746b" text-anchor="start" font-weight="bold">最后一剑</text>
<text x="215" y="899" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" fill="#213d43" text-anchor="start" font-weight="normal">各人仍在救援 → 李寄听报位、自己看清伤口 → 出剑并撤回</text>
</svg>
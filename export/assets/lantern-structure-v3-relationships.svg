<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1210" viewBox="0 0 1360 1210" role="img"><title>人物关系：家人、故交与权力</title><desc>每个角色独立成节点；上方是日常关系，下方是祭务中的约束与施压</desc><defs><marker id="arrow-24746b" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="12" refY="6" orient="auto-start-reverse"><path d="M0,0 L0,12 L12,6 z" fill="#24746b"/></marker><marker id="arrow-a74535" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="12" refY="6" orient="auto-start-reverse"><path d="M0,0 L0,12 L12,6 z" fill="#a74535"/></marker><marker id="arrow-213d43" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="12" refY="6" orient="auto-start-reverse"><path d="M0,0 L0,12 L12,6 z" fill="#213d43"/></marker><marker id="arrow-63777a" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="12" refY="6" orient="auto-start-reverse"><path d="M0,0 L0,12 L12,6 z" fill="#63777a"/></marker><marker id="arrow-426aa5" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="12" refY="6" orient="auto-start-reverse"><path d="M0,0 L0,12 L12,6 z" fill="#426aa5"/></marker><marker id="arrow-ac7429" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="12" refY="6" orient="auto-start-reverse"><path d="M0,0 L0,12 L12,6 z" fill="#ac7429"/></marker></defs><rect width="1360" height="1210" fill="#faf8f1"/>
<text x="36" y="50" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" fill="#213d43" text-anchor="start" font-weight="normal">人物关系：家人、故交与权力</text>
<text x="36" y="84" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#63777a" text-anchor="start" font-weight="normal">每个角色独立成节点；上方是日常关系，下方是祭务中的约束与施压</text>
<rect x="40" y="150" width="400" height="112" rx="10" fill="#ffffff" stroke="#c8d5d1" stroke-width="1.5"/>
<text x="56" y="182" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#24746b" text-anchor="start" font-weight="bold">李诞</text>
<text x="56" y="214" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">李寄、李绡的父亲</text>
<rect x="480" y="150" width="400" height="112" rx="10" fill="#ffffff" stroke="#c8d5d1" stroke-width="1.5"/>
<text x="496" y="182" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#24746b" text-anchor="start" font-weight="bold">阿蘅父亲（已故）</text>
<text x="496" y="214" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">三家长期往来、照看孩子</text>
<rect x="920" y="150" width="400" height="112" rx="10" fill="#ffffff" stroke="#c8d5d1" stroke-width="1.5"/>
<text x="936" y="182" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#24746b" text-anchor="start" font-weight="bold">孙六</text>
<text x="936" y="214" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">鼓手；照应亡友妻女</text>
<path d="M440 205 H478" fill="none" stroke="#24746b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-24746b)"/>
<text x="460" y="184" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" fill="#24746b" text-anchor="middle" font-weight="normal">深交</text>
<path d="M880 205 H918" fill="none" stroke="#24746b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-24746b)"/>
<text x="900" y="184" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" fill="#24746b" text-anchor="middle" font-weight="normal">深交</text>
<path d="M240 150 V120 H1120 V148" fill="none" stroke="#426aa5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-426aa5)"/>
<text x="680" y="115" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" fill="#426aa5" text-anchor="middle" font-weight="normal">李诞与孙六也是多年故交</text>
<rect x="40" y="360" width="350" height="116" rx="10" fill="#ffffff" stroke="#c8d5d1" stroke-width="1.5"/>
<text x="56" y="392" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#24746b" text-anchor="start" font-weight="bold">李绡</text>
<text x="56" y="424" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">带领戏班；李寄的五姐</text>
<rect x="480" y="360" width="350" height="116" rx="10" fill="#ffffff" stroke="#c8d5d1" stroke-width="1.5"/>
<text x="496" y="392" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#24746b" text-anchor="start" font-weight="bold">李寄</text>
<text x="496" y="424" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">急切保护朋友，逐渐学会商量</text>
<rect x="970" y="360" width="350" height="116" rx="10" fill="#ffffff" stroke="#c8d5d1" stroke-width="1.5"/>
<text x="986" y="392" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#24746b" text-anchor="start" font-weight="bold">阿蘅</text>
<text x="986" y="424" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">从小亲近的朋友；独立谋生</text>
<path d="M200 264 V358" fill="none" stroke="#24746b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-24746b)"/>
<text x="212" y="316" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#24746b" text-anchor="start" font-weight="normal">父女</text>
<path d="M280 264 V300 H630 V358" fill="none" stroke="#24746b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-24746b)"/>
<text x="452" y="293" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#24746b" text-anchor="start" font-weight="normal">父女</text>
<path d="M680 264 V320 H1130 V358" fill="none" stroke="#426aa5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-426aa5)"/>
<text x="824" y="310" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#426aa5" text-anchor="start" font-weight="normal">父女</text>
<path d="M1120 264 H1335 V493 H1140 V478" fill="none" stroke="#426aa5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-426aa5)"/>
<text x="1090" y="525" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#426aa5" text-anchor="start" font-weight="normal">孙六持续照料阿蘅</text>
<path d="M830 420 H966" fill="none" stroke="#24746b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-24746b)"/>
<text x="900" y="395" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#24746b" text-anchor="middle" font-weight="normal">姐妹般旧友</text>
<path d="M390 420 H476" fill="none" stroke="#24746b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-24746b)"/>
<text x="430" y="455" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" fill="#24746b" text-anchor="middle" font-weight="normal">姐妹</text>
<path d="M1320 235 H1345 V565 H215 V478" fill="none" stroke="#ac7429" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-ac7429)" stroke-dasharray="8 7"/>
<text x="470" y="554" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" fill="#ac7429" text-anchor="start" font-weight="normal">孙六与李绡：戏班共事</text>
<rect x="40" y="620" width="400" height="160" rx="10" fill="#eaf0f8" stroke="#c8d5d1" stroke-width="1.5"/>
<text x="56" y="652" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#426aa5" text-anchor="start" font-weight="bold">县丞与书吏</text>
<text x="56" y="684" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">有权停祭、派人、拨物资</text>
<text x="56" y="712" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">支持试杀，也默许旧例延续</text>
<rect x="500" y="620" width="360" height="160" rx="10" fill="#f8ede6" stroke="#c8d5d1" stroke-width="1.5"/>
<text x="516" y="652" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#a74535" text-anchor="start" font-weight="bold">巫祝</text>
<text x="516" y="684" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">解释神意、主持祭名</text>
<text x="516" y="712" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">争回号令权，借祭礼安民</text>
<rect x="920" y="620" width="400" height="160" rx="10" fill="#f8ede6" stroke="#c8d5d1" stroke-width="1.5"/>
<text x="936" y="652" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#a74535" text-anchor="start" font-weight="bold">赵执事</text>
<text x="936" y="684" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">粮账、借贷、庙工、喂蛇</text>
<text x="936" y="712" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">扣人、造假、执行庙方安排</text>
<path d="M440 695 H496" fill="none" stroke="#426aa5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-426aa5)"/>
<text x="468" y="670" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" fill="#426aa5" text-anchor="middle" font-weight="normal">约束</text>
<path d="M860 695 H916" fill="none" stroke="#a74535" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-a74535)"/>
<text x="889" y="670" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" fill="#a74535" text-anchor="middle" font-weight="normal">合谋</text>
<rect x="40" y="940" width="560" height="128" rx="10" fill="#ffffff" stroke="#c8d5d1" stroke-width="1.5"/>
<text x="56" y="972" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#24746b" text-anchor="start" font-weight="bold">李家、戏班与救援同伴</text>
<text x="56" y="1004" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">得到官府支持，才能查路、试饵、保护阿蘅</text>
<rect x="760" y="940" width="560" height="128" rx="10" fill="#ffffff" stroke="#c8d5d1" stroke-width="1.5"/>
<text x="776" y="972" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#24746b" text-anchor="start" font-weight="bold">乡人、祭户与领粮者</text>
<text x="776" y="1004" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">真实蛇患、缺粮与恐惧，使他们依赖庙方</text>
<path d="M240 780 V938" fill="none" stroke="#426aa5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-426aa5)"/>
<text x="254" y="859" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#426aa5" text-anchor="start" font-weight="normal">文书、人手和兵刃</text>
<path d="M680 780 V885 H1020 V938" fill="none" stroke="#a74535" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-a74535)"/>
<text x="835" y="874" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#a74535" text-anchor="start" font-weight="normal">神意说辞与群体压力</text>
<path d="M1120 780 V938" fill="none" stroke="#a74535" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-a74535)"/>
<text x="1132" y="827" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#a74535" text-anchor="start" font-weight="normal">债务与祭粮</text>
<text x="36" y="1130" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#63777a" text-anchor="start" font-weight="normal">县丞的支持与其失察责任同时存在；未设县丞收贿分赃。</text>
<text x="36" y="1165" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#63777a" text-anchor="start" font-weight="normal">庙方企图利用县丞的保留态度恢复祭礼，伤人和放蛇最终超出他们的盘算。</text>
</svg>
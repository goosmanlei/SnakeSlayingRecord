<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="920" viewBox="0 0 1360 920" role="img"><title>两院相邻：人从哪里来，又往哪里退</title><desc>上北下南；示意相邻与通行关系，不按比例。绿色为人的退路，红色为蛇的去向。</desc><defs><marker id="arrow-24746b" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="12" refY="6" orient="auto-start-reverse"><path d="M0,0 L0,12 L12,6 z" fill="#24746b"/></marker><marker id="arrow-a74535" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="12" refY="6" orient="auto-start-reverse"><path d="M0,0 L0,12 L12,6 z" fill="#a74535"/></marker><marker id="arrow-213d43" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="12" refY="6" orient="auto-start-reverse"><path d="M0,0 L0,12 L12,6 z" fill="#213d43"/></marker><marker id="arrow-63777a" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="12" refY="6" orient="auto-start-reverse"><path d="M0,0 L0,12 L12,6 z" fill="#63777a"/></marker><marker id="arrow-426aa5" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="12" refY="6" orient="auto-start-reverse"><path d="M0,0 L0,12 L12,6 z" fill="#426aa5"/></marker><marker id="arrow-ac7429" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="12" refY="6" orient="auto-start-reverse"><path d="M0,0 L0,12 L12,6 z" fill="#ac7429"/></marker></defs><rect width="1360" height="920" fill="#faf8f1"/>
<text x="36" y="50" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" fill="#213d43" text-anchor="start" font-weight="normal">两院相邻：人从哪里来，又往哪里退</text>
<text x="36" y="84" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#63777a" text-anchor="start" font-weight="normal">上北下南；示意相邻与通行关系，不按比例。绿色为人的退路，红色为蛇的去向。</text>
<rect x="400" y="125" width="360" height="100" rx="10" fill="#ffffff" stroke="#c8d5d1" stroke-width="1.5"/>
<text x="416" y="157" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#24746b" text-anchor="start" font-weight="bold">蛇洞与食槽</text>
<text x="416" y="189" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">闸前有供食护墙</text>
<rect x="225" y="265" width="250" height="130" rx="10" fill="#ffffff" stroke="#c8d5d1" stroke-width="1.5"/>
<text x="241" y="297" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#24746b" text-anchor="start" font-weight="bold">井旁木屋</text>
<text x="241" y="329" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">屋后窄道向南</text>
<text x="241" y="357" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">通往西墙缺口</text>
<rect x="380" y="520" width="380" height="145" rx="10" fill="#ffffff" stroke="#c8d5d1" stroke-width="1.5"/>
<text x="396" y="552" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#24746b" text-anchor="start" font-weight="bold">旧戏台</text>
<text x="396" y="584" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">蛇从东侧进入两柱间</text>
<text x="396" y="612" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">北、南石沿站持矛的人</text>
<rect x="850" y="245" width="430" height="275" rx="10" fill="#ffffff" stroke="#c8d5d1" stroke-width="1.5"/>
<text x="866" y="277" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#24746b" text-anchor="start" font-weight="bold">仓院</text>
<text x="866" y="309" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">西口：两院相连的东门</text>
<text x="866" y="337" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">北边粮房；南侧拌饵棚</text>
<text x="866" y="365" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">南门：几级窄台阶</text>
<rect x="40" y="485" width="220" height="165" rx="10" fill="#e9f2ed" stroke="#c8d5d1" stroke-width="1.5"/>
<text x="56" y="517" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#24746b" text-anchor="start" font-weight="bold">西坡与跪牛石</text>
<text x="56" y="549" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">墙缺外可集合</text>
<text x="56" y="577" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">高处能望见戏台</text>
<text x="56" y="605" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">受伤者在此照料</text>
<rect x="880" y="715" width="380" height="105" rx="10" fill="#e9f2ed" stroke="#c8d5d1" stroke-width="1.5"/>
<text x="896" y="747" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#24746b" text-anchor="start" font-weight="bold">晒场与下山路</text>
<text x="896" y="779" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">领粮者继续往山下撤</text>
<path d="M475 225 V250 H520 V350 H845" fill="none" stroke="#a74535" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-a74535)"/>
<text x="575" y="332" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#a74535" text-anchor="start" font-weight="normal">漏饵经东门入仓</text>
<path d="M845 460 H785 V550 H762" fill="none" stroke="#a74535" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-a74535)" stroke-dasharray="8 7"/>
<text x="578" y="477" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#a74535" text-anchor="start" font-weight="normal">回引仍走东门</text>
<path d="M225 370 H185 V480" fill="none" stroke="#24746b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-24746b)"/>
<text x="42" y="420" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#24746b" text-anchor="start" font-weight="normal">屋后 → 墙缺</text>
<path d="M380 605 H266" fill="none" stroke="#24746b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-24746b)"/>
<text x="272" y="585" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#24746b" text-anchor="start" font-weight="normal">退向西</text>
<path d="M1100 520 V710" fill="none" stroke="#24746b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-24746b)"/>
<text x="1115" y="615" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#24746b" text-anchor="start" font-weight="normal">仓院南门</text>
<path d="M880 780 H150 V655" fill="none" stroke="#24746b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-24746b)" stroke-dasharray="8 7"/>
<text x="340" y="759" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" fill="#24746b" text-anchor="start" font-weight="normal">院外小路：晒场与西坡之间往返</text>
<text x="36" y="875" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#63777a" text-anchor="start" font-weight="normal">读者先在探路时认识这几个位置；危机中只使用已经交代的门、路和场地。</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1040" viewBox="0 0 1360 1040" role="img"><title>第二阶段：仓门挡蛇，沟南撤人</title><desc>分清蛇的路、乡人的退路、成年人的回援路；先疏散，再回引</desc><defs><marker id="arrow-24746b" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="12" refY="6" orient="auto-start-reverse"><path d="M0,0 L0,12 L12,6 z" fill="#24746b"/></marker><marker id="arrow-a74535" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="12" refY="6" orient="auto-start-reverse"><path d="M0,0 L0,12 L12,6 z" fill="#a74535"/></marker><marker id="arrow-213d43" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="12" refY="6" orient="auto-start-reverse"><path d="M0,0 L0,12 L12,6 z" fill="#213d43"/></marker><marker id="arrow-63777a" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="12" refY="6" orient="auto-start-reverse"><path d="M0,0 L0,12 L12,6 z" fill="#63777a"/></marker><marker id="arrow-426aa5" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="12" refY="6" orient="auto-start-reverse"><path d="M0,0 L0,12 L12,6 z" fill="#426aa5"/></marker><marker id="arrow-ac7429" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="12" refY="6" orient="auto-start-reverse"><path d="M0,0 L0,12 L12,6 z" fill="#ac7429"/></marker></defs><rect width="1360" height="1040" fill="#faf8f1"/>
<text x="36" y="50" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" fill="#213d43" text-anchor="start" font-weight="normal">第二阶段：仓门挡蛇，沟南撤人</text>
<text x="36" y="84" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#63777a" text-anchor="start" font-weight="normal">分清蛇的路、乡人的退路、成年人的回援路；先疏散，再回引</text>
<rect x="650" y="150" width="145" height="635" fill="#e1e7e5"/>
<text x="720" y="210" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24" fill="#63777a" text-anchor="middle" font-weight="normal">干沟</text>
<text x="36" y="140" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="22" fill="#24746b" text-anchor="start" font-weight="normal">北 ↑</text>
<rect x="80" y="190" width="420" height="120" rx="10" fill="#ffffff" stroke="#c8d5d1" stroke-width="1.5"/>
<text x="96" y="222" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#24746b" text-anchor="start" font-weight="bold">东侧通道 → 沟西竹林</text>
<text x="96" y="254" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">蛇循漏饵向南，到木桥西头</text>
<rect x="70" y="455" width="430" height="135" rx="10" fill="#ffffff" stroke="#c8d5d1" stroke-width="1.5"/>
<text x="86" y="487" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#24746b" text-anchor="start" font-weight="bold">庙院石门、空戏台</text>
<text x="86" y="519" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">李绡在石门墙后引饵</text>
<text x="86" y="547" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">回引方向朝西，远离撤离人群</text>
<rect x="890" y="350" width="410" height="220" rx="10" fill="#ffffff" stroke="#c8d5d1" stroke-width="1.5"/>
<text x="906" y="382" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#24746b" text-anchor="start" font-weight="bold">仓院</text>
<text x="906" y="414" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">西门：李诞、陶伯挡蛇</text>
<text x="906" y="442" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">程差役经沟南绕到仓侧支援</text>
<text x="906" y="470" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">南侧小门：人、粮分批撤出</text>
<text x="906" y="498" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">拌饵棚：空篮、备用供饵</text>
<path d="M500 475 H884" fill="none" stroke="#ac7429" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
<text x="707" y="515" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#ac7429" text-anchor="middle" font-weight="normal">断桥斜木仍在沟中</text>
<path d="M460 315 V408 H875" fill="none" stroke="#a74535" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-a74535)"/>
<text x="740" y="385" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21" fill="#a74535" text-anchor="start" font-weight="normal">蛇头朝仓门</text>
<circle cx="863" cy="408" r="17" fill="#a74535"/>
<text x="863" y="415" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#fff" text-anchor="middle" font-weight="bold">蛇</text>
<path d="M1105 574 V760 H820 L760 850 H325" fill="none" stroke="#24746b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-24746b)"/>
<text x="1060" y="660" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" fill="#24746b" text-anchor="start" font-weight="normal">下石坎，需要接应</text>
<text x="475" y="886" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="22" fill="#24746b" text-anchor="start" font-weight="normal">沟南缓坡：接孩子、扶老人、搬粮</text>
<rect x="35" y="900" width="370" height="96" rx="10" fill="#ffffff" stroke="#c8d5d1" stroke-width="1.5"/>
<text x="51" y="932" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" fill="#24746b" text-anchor="start" font-weight="bold">晒场</text>
<text x="51" y="964" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#213d43" text-anchor="start" font-weight="normal">领粮者集中、伤者继续下山</text>
<path d="M990 579 V715 H845 L790 805 H575 V640 H405 V592" fill="none" stroke="#426aa5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-426aa5)" stroke-dasharray="8 7"/>
<text x="326" y="728" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#426aa5" text-anchor="start" font-weight="normal">李诞、程差役的返回路线</text>
<path d="M845 545 H540" fill="none" stroke="#a74535" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-a74535)" stroke-dasharray="8 7"/>
<text x="705" y="587" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#a74535" text-anchor="middle" font-weight="normal">引饵后，蛇转回西岸</text>
<text x="36" y="1015" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#63777a" text-anchor="start" font-weight="normal">实线红：蛇逼仓门；虚线红：之后回引。成人绕沟南返回，不能从蛇身旁跨断桥。</text>
</svg>
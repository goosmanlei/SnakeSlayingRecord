<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img" aria-labelledby="title desc">
<title id="title">《搜神记》卷十九：通行本与四库本异文对照</title>
<desc id="desc">本项目依维基文库两页文本制作，列出东越与东域、瓷与餈、研与斫、指与拜等异文。</desc>
<rect width="1000" height="660" fill="#f7f3e9"/>
<rect x="32" y="30" width="936" height="598" rx="18" fill="#fffdfa" stroke="#ded4c2"/>
<text x="70" y="95" font-family="serif" font-size="35" fill="#213d39">《搜神记》卷十九 · 异文对照</text>
<text x="70" y="126" font-family="sans-serif" font-size="16" fill="#6f756c">通行整理本与四库本 · 仅示差异，不代替原文</text>
<line x1="70" x2="930" y1="154" y2="154" stroke="#d9cbb9"/>
<text x="88" y="192" font-family="sans-serif" font-size="16" fill="#9d5d40">位置</text>
<text x="330" y="192" font-family="sans-serif" font-size="16" fill="#9d5d40">通行本</text>
<text x="650" y="192" font-family="sans-serif" font-size="16" fill="#9d5d40">四库本</text>
<g font-family="serif" font-size="22" fill="#263c37">
<text x="88" y="249">开篇地域</text><text x="330" y="249">东越闽中</text><text x="650" y="249">東域閩中</text>
<text x="88" y="322">引蛇食物</text><text x="330" y="322">闻瓷香气</text><text x="650" y="322">聞餈香氣</text>
<text x="88" y="395">斩蛇动作</text><text x="330" y="395">研得数创</text><text x="650" y="395">斫得數創</text>
<text x="88" y="468">父亲任官</text><text x="330" y="468">指其父为将乐令</text><text x="650" y="468">拜其父為將樂令</text>
</g>
<g stroke="#ece5d9"><line x1="70" x2="930" y1="271" y2="271"/><line x1="70" x2="930" y1="344" y2="344"/><line x1="70" x2="930" y1="417" y2="417"/><line x1="70" x2="930" y1="490" y2="490"/></g>

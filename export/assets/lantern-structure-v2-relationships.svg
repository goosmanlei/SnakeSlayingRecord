<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1220" viewBox="0 0 1120 1220" role="img"><title>人物关系总览</title><desc>先看三位父辈的深交，再看两代人的亲情、共事与救援责任。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto-start-reverse"><path d="M0,0 L0,6 L7,3 z" fill="context-stroke"/></marker></defs><rect width="1120" height="1220" fill="#faf8f1"/>
<text x="36" y="48" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" fill="#203b41" font-weight="bold" text-anchor="start">人物关系总览</text>
<text x="36" y="80" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" fill="#53696d" font-weight="normal" text-anchor="start">先看三位父辈的深交，再看两代人的亲情、共事与救援责任。</text>
<path d="M185,140 L185,115 L929,115 L929,140" fill="none" stroke="#33766b" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="557" y="107" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="15" fill="#33766b" font-weight="normal" text-anchor="middle">多年深交</text>
<rect x="35" y="146" width="300" height="120" rx="12" fill="#edf3ed" stroke="#c8d7cf"/>
<text x="53" y="178" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21" fill="#33766b" font-weight="bold" text-anchor="start">李诞</text>
<text x="53" y="209" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" fill="#203b41" font-weight="normal" text-anchor="start">年轻时同在码头做工</text>
<text x="53" y="238" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" fill="#203b41" font-weight="normal" text-anchor="start">继续照料母女、主动接人</text>
<rect x="407" y="146" width="300" height="120" rx="12" fill="#edf3ed" stroke="#c8d7cf"/>
<text x="425" y="178" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21" fill="#33766b" font-weight="bold" text-anchor="start">阿蘅的父亲（已故）</text>
<text x="425" y="209" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" fill="#203b41" font-weight="normal" text-anchor="start">与李诞、孙六都是深交故友</text>
<text x="425" y="238" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" fill="#203b41" font-weight="normal" text-anchor="start">三家常来往，一起照看孩子</text>
<rect x="779" y="146" width="300" height="120" rx="12" fill="#edf3ed" stroke="#c8d7cf"/>
<text x="797" y="178" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21" fill="#33766b" font-weight="bold" text-anchor="start">孙六</text>
<text x="797" y="209" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" fill="#203b41" font-weight="normal" text-anchor="start">从前共同抬货，后来进戏班</text>
<text x="797" y="238" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" fill="#203b41" font-weight="normal" text-anchor="start">照应亡友妻女、救受困老友</text>
<path d="M340,215 L402,215" fill="none" stroke="#33766b" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="371.0" y="199" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="14" fill="#33766b" font-weight="normal" text-anchor="middle">深交</text>
<path d="M712,215 L774,215" fill="none" stroke="#33766b" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="743.0" y="199" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="14" fill="#33766b" font-weight="normal" text-anchor="middle">深交</text>
<text x="35" y="301" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#203b41" font-weight="normal" text-anchor="start">一起做工、轮流吃饭、照看孩子；阿蘅父亲去世后，两位故友仍照应母女。</text>
<text x="35" y="333" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" fill="#53696d" font-weight="normal" text-anchor="start">送米修屋、介绍零活、接人守路和临危救援延续了感情；收入与能力仍有限。</text>
<path d="M35,367 H1084" stroke="#d5dcd6" stroke-width="1.5"/>
<g transform="translate(0 280)">
<rect x="35" y="122" width="300" height="115" rx="12" fill="#fff" stroke="#d5dcd6"/>
<rect x="35" y="134" width="4" height="91" rx="2" fill="#33766b"/>
<text x="53" y="154" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21" fill="#33766b" font-weight="bold" text-anchor="start">李家父母</text>
<text x="53" y="184" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" fill="#203b41" font-weight="normal" text-anchor="start">养育李寄、李绡</text>
<text x="53" y="211" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" fill="#203b41" font-weight="normal" text-anchor="start">父辈深交，持续照料阿蘅母女</text>
<rect x="407" y="122" width="300" height="115" rx="12" fill="#fff" stroke="#d5dcd6"/>
<rect x="407" y="134" width="4" height="91" rx="2" fill="#33766b"/>
<text x="425" y="154" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21" fill="#33766b" font-weight="bold" text-anchor="start">李绡 · 孙六</text>
<text x="425" y="184" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" fill="#203b41" font-weight="normal" text-anchor="start">孙六是两位父亲的故交</text>
<text x="425" y="211" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" fill="#203b41" font-weight="normal" text-anchor="start">李绡组织戏班，两人共同救援</text>
<rect x="779" y="122" width="305" height="115" rx="12" fill="#fff" stroke="#d5dcd6"/>
<rect x="779" y="134" width="4" height="91" rx="2" fill="#33766b"/>
<text x="797" y="154" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21" fill="#33766b" font-weight="bold" text-anchor="start">阿蘅母亲</text>
<text x="797" y="184" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" fill="#203b41" font-weight="normal" text-anchor="start">病弱但有手艺与判断</text>
<text x="797" y="211" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" fill="#203b41" font-weight="normal" text-anchor="start">与女儿相依，也与李家互助</text>
<rect x="212" y="353" width="290" height="112" rx="12" fill="#fff" stroke="#d5dcd6"/>
<rect x="212" y="365" width="4" height="88" rx="2" fill="#33766b"/>
<text x="230" y="385" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21" fill="#33766b" font-weight="bold" text-anchor="start">李寄</text>
<text x="230" y="415" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" fill="#203b41" font-weight="normal" text-anchor="start">早期只按自己想法帮助朋友</text>
<text x="230" y="442" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" fill="#203b41" font-weight="normal" text-anchor="start">逐渐学会听取她的判断</text>
<rect x="619" y="353" width="290" height="112" rx="12" fill="#fff" stroke="#d5dcd6"/>
<rect x="619" y="365" width="4" height="88" rx="2" fill="#33766b"/>
<text x="637" y="385" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21" fill="#33766b" font-weight="bold" text-anchor="start">阿蘅</text>
<text x="637" y="415" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" fill="#203b41" font-weight="normal" text-anchor="start">被迫面对祭名</text>
<text x="637" y="442" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" fill="#203b41" font-weight="normal" text-anchor="start">表达意愿，也照顾李寄</text>
<path d="M200,238 L340,346" fill="none" stroke="#33766b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="221.0" y="264.0" width="98" height="26" rx="12" fill="#faf8f1" stroke="#faf8f1"/>
<text x="270.0" y="283.0" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" fill="#33766b" font-weight="normal" text-anchor="middle">亲情与保护</text>
<path d="M507,238 L400,346" fill="none" stroke="#33766b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="404.5" y="264.0" width="98" height="26" rx="12" fill="#faf8f1" stroke="#faf8f1"/>
<text x="453.5" y="283.0" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" fill="#33766b" font-weight="normal" text-anchor="middle">姐妹与共事</text>
<path d="M609,238 L705,346" fill="none" stroke="#33766b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="608.0" y="264.0" width="98" height="26" rx="12" fill="#faf8f1" stroke="#faf8f1"/>
<text x="657.0" y="283.0" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" fill="#33766b" font-weight="normal" text-anchor="middle">照料与接应</text>
<path d="M926,238 L809,346" fill="none" stroke="#33766b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="826.5" y="264.0" width="82" height="26" rx="12" fill="#faf8f1" stroke="#faf8f1"/>
<text x="867.5" y="283.0" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" fill="#33766b" font-weight="normal" text-anchor="middle">母女牵挂</text>
<path d="M508,408 L612,408" fill="none" stroke="#33766b" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<rect x="511.0" y="380.0" width="98" height="26" rx="12" fill="#faf8f1" stroke="#faf8f1"/>
<text x="560.0" y="399.0" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" fill="#33766b" font-weight="normal" text-anchor="middle">姐妹般旧友</text>
<rect x="35" y="620" width="300" height="142" rx="12" fill="#fff" stroke="#d5dcd6"/>
<rect x="35" y="632" width="4" height="118" rx="2" fill="#33766b"/>
<text x="53" y="652" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21" fill="#33766b" font-weight="bold" text-anchor="start">乡人 · 陶伯 · 周掌柜</text>
<text x="53" y="682" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" fill="#203b41" font-weight="normal" text-anchor="start">受过伤害，也畏惧庙方</text>
<text x="53" y="709" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" fill="#203b41" font-weight="normal" text-anchor="start">从有限帮助到参与救援</text>
<text x="53" y="736" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" fill="#203b41" font-weight="normal" text-anchor="start">信任逐步建立</text>
<rect x="407" y="620" width="300" height="142" rx="12" fill="#fff" stroke="#d5dcd6"/>
<rect x="407" y="632" width="4" height="118" rx="2" fill="#33766b"/>
<text x="425" y="652" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21" fill="#33766b" font-weight="bold" text-anchor="start">程差役 · 县里</text>
<text x="425" y="682" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" fill="#203b41" font-weight="normal" text-anchor="start">差役：查验、救人、作证</text>
<text x="425" y="709" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" fill="#203b41" font-weight="normal" text-anchor="start">县里：给资源，却拖延查账</text>
<text x="425" y="736" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" fill="#203b41" font-weight="normal" text-anchor="start">结尾追究失察与旧欠</text>
<rect x="779" y="620" width="305" height="142" rx="12" fill="#fff" stroke="#d5dcd6"/>
<rect x="779" y="632" width="4" height="118" rx="2" fill="#a95339"/>
<text x="797" y="652" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21" fill="#a95339" font-weight="bold" text-anchor="start">巫祝 · 赵执事</text>
<text x="797" y="682" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" fill="#203b41" font-weight="normal" text-anchor="start">操纵祭名、借粮施压</text>
<text x="797" y="709" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" fill="#203b41" font-weight="normal" text-anchor="start">囚人堵路，提前开闸</text>
<text x="797" y="736" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" fill="#203b41" font-weight="normal" text-anchor="start">不能可靠控制蛇</text>
<path d="M222,615 L328,474" fill="none" stroke="#33766b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="226.0" y="516.5" width="98" height="26" rx="12" fill="#faf8f1" stroke="#faf8f1"/>
<text x="275.0" y="535.5" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" fill="#33766b" font-weight="normal" text-anchor="middle">帮助与见证</text>
<path d="M557,615 L557,504" fill="none" stroke="#33766b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="508.0" y="531.5" width="98" height="26" rx="12" fill="#faf8f1" stroke="#faf8f1"/>
<text x="557.0" y="550.5" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" fill="#33766b" font-weight="normal" text-anchor="middle">保护与追责</text>
<path d="M928,615 L808,474" fill="none" stroke="#a95339" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="803.0" y="516.5" width="130" height="26" rx="12" fill="#faf8f1" stroke="#faf8f1"/>
<text x="868.0" y="535.5" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" fill="#a95339" font-weight="normal" text-anchor="middle">债务与祭名施压</text>
<rect x="35" y="806" width="1049" height="77" rx="12" fill="#edf3ed" stroke="#d5dcd6"/>
<text x="55" y="837" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21" fill="#33766b" font-weight="bold" text-anchor="start">共同救援的基础：父辈深交、亲情、女孩间的友情与眼前责任。</text>
<text x="55" y="867" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" fill="#203b41" font-weight="normal" text-anchor="start">互助有经济和能力边界；参与者不是因为突然无所畏惧，也不是为了偿还救命旧债。</text>
<text x="36" y="916" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="15" fill="#53696d" font-weight="normal" text-anchor="start">父辈是多年故交，两位女孩是姐妹般旧友；亲属称谓仍须按各自家庭明确。</text>
</g></svg>
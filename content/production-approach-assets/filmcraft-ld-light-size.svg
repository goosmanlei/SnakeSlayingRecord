<svg xmlns="http://www.w3.org/2000/svg" width="900" height="610" viewBox="0 0 900 610" role="img" aria-labelledby="title desc">
<title id="title">光源有效面积与半影</title><desc id="desc">两幅平面示意比较相同中心方向的小光源和大光源。遮挡物与接收面相同，大光源形成更宽的部分遮挡区。非照度模拟。</desc>
<rect width="900" height="610" fill="#f6f3eb"/>
<text x="36" y="44" font-size="26" font-family="sans-serif" fill="#202b36">光质看影边，不由灯的亮度决定</text>
<text x="36" y="78" font-size="18" font-family="sans-serif" fill="#455463">条件：中心方向、遮挡物与接收面相同；省略环境反射</text>
<text x="36" y="126" font-size="23" font-family="sans-serif" fill="#202b36">A 小面积光源</text>
<rect x="144" y="180" width="12" height="30" fill="#c87f0a"/>
<line x1="150" y1="180" x2="750" y2="270" stroke="#c87f0a" stroke-width="2"/>
<line x1="150" y1="210" x2="750" y2="120" stroke="#c87f0a" stroke-width="2"/>
<line x1="150" y1="180" x2="750" y2="150" stroke="#c87f0a" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="150" y1="210" x2="750" y2="240" stroke="#c87f0a" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="444" y="165" width="12" height="60" fill="#202b36"/>
<rect x="741" y="110" width="18" height="170" fill="#fff4c9"/>
<rect x="741" y="120" width="18" height="30" fill="#b7b3a4"/>
<rect x="741" y="150" width="18" height="90" fill="#35434e"/>
<rect x="741" y="240" width="18" height="30" fill="#b7b3a4"/>
<text x="111" y="292" font-size="19" font-family="sans-serif" fill="#202b36">发光面</text>
<text x="410" y="292" font-size="19" font-family="sans-serif" fill="#202b36">遮挡物</text>
<text x="704" y="292" font-size="19" font-family="sans-serif" fill="#202b36">接收面</text>
<line x1="35" y1="320" x2="865" y2="320" stroke="#c4c7c8"/>
<text x="36" y="365" font-size="23" font-family="sans-serif" fill="#202b36">B 大面积光源</text>
<rect x="144" y="390" width="12" height="120" fill="#c87f0a"/>
<line x1="150" y1="390" x2="750" y2="570" stroke="#c87f0a" stroke-width="2"/>
<line x1="150" y1="510" x2="750" y2="330" stroke="#c87f0a" stroke-width="2"/>
<line x1="150" y1="390" x2="750" y2="450" stroke="#c87f0a" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="150" y1="510" x2="750" y2="450" stroke="#c87f0a" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="444" y="420" width="12" height="60" fill="#202b36"/>
<rect x="741" y="330" width="18" height="240" fill="#b7b3a4"/>
<text x="776" y="416" font-size="19" font-family="sans-serif" fill="#202b36">较宽的</text>
<text x="776" y="442" font-size="19" font-family="sans-serif" fill="#202b36">部分遮挡区</text>
<rect x="35" y="558" width="17" height="17" fill="#35434e"/>
<text x="60" y="574" font-size="18" font-family="sans-serif" fill="#202b36">完全遮挡</text>
<rect x="190" y="558" width="17" height="17" fill="#b7b3a4"/>
<text x="215" y="574" font-size="18" font-family="sans-serif" fill="#202b36">部分遮挡（半影）</text>
<text x="36" y="600" font-size="16" font-family="sans-serif" fill="#455463">原创几何示意；真实影边还取决于距离、形状和反射。</text>
</svg>

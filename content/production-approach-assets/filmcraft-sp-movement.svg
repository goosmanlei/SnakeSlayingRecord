<svg xmlns="http://www.w3.org/2000/svg" width="960" height="675" viewBox="0 0 960 675"><title>同一揭示，可以由相机或人物完成</title><desc>原创教学示意；不代表真实影片、拍摄参数或观众实验。橙色与蓝色区分人物。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 Z" fill="#263b47"/></marker></defs><rect x="0" y="0" width="960" height="675" rx="9" fill="#f7f4ee" stroke="#f7f4ee" stroke-width="2"/><text x="32" y="47" fill="#263b47" font-size="29" font-family="sans-serif">同一揭示，可以由相机或人物完成</text><text x="32" y="85" fill="#647581" font-size="21" font-family="sans-serif">灰墙遮住蓝人；橙人为当前主体。比较谁触发了信息出现。</text><text x="32" y="127" fill="#263b47" font-size="24" font-family="sans-serif">A  相机向左移：两人不动，近墙相对后景向右移</text><rect x="40" y="152" width="260" height="151" rx="9" fill="white" stroke="#cbd3d4" stroke-width="2"/><g transform="translate(234 231) scale(0.55)"><circle cx="0" cy="-43" r="14" fill="#c66d36"/><path d="M-20,-22 L20,-22 L25,20 L12,20 L12,63 L-2,63 L-2,21 L-11,21 L-11,63 L-25,63 L-25,16 Z" fill="#c66d36"/></g><g transform="translate(123 231) scale(0.55)"><circle cx="0" cy="-43" r="14" fill="#357e9a"/><path d="M-20,-22 L20,-22 L25,20 L12,20 L12,63 L-2,63 L-2,21 L-11,21 L-11,63 L-25,63 L-25,16 Z" fill="#357e9a"/></g><rect x="89" y="182" width="65" height="112" rx="9" fill="#d2d7d6" stroke="#d2d7d6" stroke-width="2"/><text x="55" y="330" fill="#263b47" font-size="20" font-family="sans-serif">起点：蓝人被遮住</text><line x1="305" y1="232" x2="343" y2="232" stroke="#263b47" stroke-width="3" marker-end="url(#arrow)"/><rect x="350" y="152" width="260" height="151" rx="9" fill="white" stroke="#cbd3d4" stroke-width="2"/><g transform="translate(544 231) scale(0.55)"><circle cx="0" cy="-43" r="14" fill="#c66d36"/><path d="M-20,-22 L20,-22 L25,20 L12,20 L12,63 L-2,63 L-2,21 L-11,21 L-11,63 L-25,63 L-25,16 Z" fill="#c66d36"/></g><g transform="translate(433 231) scale(0.55)"><circle cx="0" cy="-43" r="14" fill="#357e9a"/><path d="M-20,-22 L20,-22 L25,20 L12,20 L12,63 L-2,63 L-2,21 L-11,21 L-11,63 L-25,63 L-25,16 Z" fill="#357e9a"/></g><rect x="432" y="182" width="65" height="112" rx="9" fill="#d2d7d6" stroke="#d2d7d6" stroke-width="2"/><text x="365" y="330" fill="#263b47" font-size="20" font-family="sans-serif">中途：边缘显露</text><line x1="615" y1="232" x2="653" y2="232" stroke="#263b47" stroke-width="3" marker-end="url(#arrow)"/><rect x="660" y="152" width="260" height="151" rx="9" fill="white" stroke="#cbd3d4" stroke-width="2"/><g transform="translate(854 231) scale(0.55)"><circle cx="0" cy="-43" r="14" fill="#c66d36"/><path d="M-20,-22 L20,-22 L25,20 L12,20 L12,63 L-2,63 L-2,21 L-11,21 L-11,63 L-25,63 L-25,16 Z" fill="#c66d36"/></g><g transform="translate(743 231) scale(0.55)"><circle cx="0" cy="-43" r="14" fill="#357e9a"/><path d="M-20,-22 L20,-22 L25,20 L12,20 L12,63 L-2,63 L-2,21 L-11,21 L-11,63 L-25,63 L-25,16 Z" fill="#357e9a"/></g><rect x="775" y="182" width="65" height="112" rx="9" fill="#d2d7d6" stroke="#d2d7d6" stroke-width="2"/><text x="675" y="330" fill="#263b47" font-size="20" font-family="sans-serif">终点：看见蓝人</text><text x="32" y="381" fill="#263b47" font-size="24" font-family="sans-serif">B  相机固定：人物主动走出遮挡</text><rect x="40" y="403" width="260" height="148" rx="9" fill="white" stroke="#cbd3d4" stroke-width="2"/><g transform="translate(234 481) scale(0.55)"><circle cx="0" cy="-43" r="14" fill="#c66d36"/><path d="M-20,-22 L20,-22 L25,20 L12,20 L12,63 L-2,63 L-2,21 L-11,21 L-11,63 L-25,63 L-25,16 Z" fill="#c66d36"/></g><g transform="translate(120 481) scale(0.55)"><circle cx="0" cy="-43" r="14" fill="#357e9a"/><path d="M-20,-22 L20,-22 L25,20 L12,20 L12,63 L-2,63 L-2,21 L-11,21 L-11,63 L-25,63 L-25,16 Z" fill="#357e9a"/></g><rect x="88" y="431" width="65" height="110" rx="9" fill="#d2d7d6" stroke="#d2d7d6" stroke-width="2"/><text x="54" y="577" fill="#263b47" font-size="20" font-family="sans-serif">等待</text><line x1="305" y1="478" x2="343" y2="478" stroke="#263b47" stroke-width="3" marker-end="url(#arrow)"/><rect x="350" y="403" wi
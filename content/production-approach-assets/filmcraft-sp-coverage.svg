<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660"><title>覆盖看的是证据，不是镜头数量</title><desc>原创教学示意；不代表真实影片、拍摄参数或观众实验。橙色与蓝色区分人物。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 Z" fill="#263b47"/></marker></defs><rect x="0" y="0" width="960" height="660" rx="9" fill="#f7f4ee" stroke="#f7f4ee" stroke-width="2"/><text x="32" y="47" fill="#263b47" font-size="29" font-family="sans-serif">覆盖看的是证据，不是镜头数量</text><text x="32" y="85" fill="#647581" font-size="21" font-family="sans-serif">例：钥匙从甲转交乙。无论采用几镜，都要证明归属改变。</text><text x="32" y="124" fill="#263b47" font-size="24" font-family="sans-serif">A  同框保留关系与完整交接</text><rect x="45" y="148" width="250" height="165" rx="9" fill="white" stroke="#cbd3d4" stroke-width="2"/><g transform="translate(103 215) scale(0.7)"><circle cx="0" cy="-43" r="14" fill="#c66d36"/><path d="M-20,-22 L20,-22 L25,20 L12,20 L12,63 L-2,63 L-2,21 L-11,21 L-11,63 L-25,63 L-25,16 Z" fill="#c66d36"/></g><g transform="translate(234 215) scale(0.7)"><circle cx="0" cy="-43" r="14" fill="#357e9a"/><path d="M-20,-22 L20,-22 L25,20 L12,20 L12,63 L-2,63 L-2,21 L-11,21 L-11,63 L-25,63 L-25,16 Z" fill="#357e9a"/></g><line x1="112" y1="211" x2="139" y2="223" stroke="#c66d36" stroke-width="3"/><circle cx="139" cy="223" r="8" fill="none" stroke="#263b47" stroke-width="4"/><line x1="147" y1="223" x2="167" y2="223" stroke="#263b47" stroke-width="3"/><text x="55" y="342" fill="#263b47" font-size="21" font-family="sans-serif">开始：甲持有</text><line x1="298" y1="230" x2="345" y2="230" stroke="#263b47" stroke-width="3" marker-end="url(#arrow)"/><rect x="355" y="148" width="250" height="165" rx="9" fill="white" stroke="#cbd3d4" stroke-width="2"/><g transform="translate(413 215) scale(0.7)"><circle cx="0" cy="-43" r="14" fill="#c66d36"/><path d="M-20,-22 L20,-22 L25,20 L12,20 L12,63 L-2,63 L-2,21 L-11,21 L-11,63 L-25,63 L-25,16 Z" fill="#c66d36"/></g><g transform="translate(544 215) scale(0.7)"><circle cx="0" cy="-43" r="14" fill="#357e9a"/><path d="M-20,-22 L20,-22 L25,20 L12,20 L12,63 L-2,63 L-2,21 L-11,21 L-11,63 L-25,63 L-25,16 Z" fill="#357e9a"/></g><line x1="422" y1="211" x2="480" y2="223" stroke="#c66d36" stroke-width="3"/><line x1="536" y1="211" x2="480" y2="223" stroke="#357e9a" stroke-width="3"/><circle cx="480" cy="223" r="8" fill="none" stroke="#263b47" stroke-width="4"/><line x1="488" y1="223" x2="508" y2="223" stroke="#263b47" stroke-width="3"/><text x="365" y="342" fill="#263b47" font-size="21" font-family="sans-serif">接触：双方共持</text><line x1="608" y1="230" x2="655" y2="230" stroke="#263b47" stroke-width="3" marker-end="url(#arrow)"/><rect x="665" y="148" width="250" height="165" rx="9" fill="white" stroke="#cbd3d4" stroke-width="2"/><g transform="translate(723 215) scale(0.7)"><circle cx="0" cy="-43" r="14" fill="#c66d36"/><path d="M-20,-22 L20,-22 L25,20 L12,20 L12,63 L-2,63 L-2,21 L-11,21 L-11,63 L-25,63 L-25,16 Z" fill="#c66d36"/></g><g transform="translate(854 215) scale(0.7)"><circle cx="0" cy="-43" r="14" fill="#357e9a"/><path d="M-20,-22 L20,-22 L25,20 L12,20 L12,63 L-2,63 L-2,21 L-11,21 L-11,63 L-25,63 L-25,16 Z" fill="#357e9a"/></g><line x1="846" y1="211" x2="828" y2="223" stroke="#357e9a" stroke-width="3"/><circle cx="828" cy="223" r="8" fill="none" stroke="#263b47" stroke-width="4"/><line x1="836" y1="223" x2="856" y2="223" stroke="#263b47" stroke-width="3"/><text x="675" y="342" fill="#263b47" font-size="21" font-family="sans-serif">结束：乙持有</text><text x="32" y="389" fill="#263b47" font-size="24" font-family="sans-serif">B  拆镜突出犹豫；不能丢掉接触与放开的因果</text><rect x="45" y="411" width="250" height="141" rx="9" fill="white" stroke="#cbd3d4" stroke-width="2"/><text x="65" y="491" fill="#263b47" font-size="23" font-family="sans-serif">乙先看钥匙</text><line x1="298" y1="480" x2="345" y2="480" stroke="#263b47" stroke-width="3" marker-end="url(#arrow)"/><rect x="355" y="411" width="250" height="141" rx="9" fill="white" stroke="#cbd3d4" stroke-width="2"/><text x="375" y="491" fill="#263b47" font-size="23" font-family="sans-serif">手部交接</text><line x1="608" y1="480" x2="655" y2="480" stroke="#263b47" stroke-width="3" marker-end="url(#arrow)"/><rect x="665" y="411" width="250" height="141" rx="9" fill="white" stroke="#cbd3d4" stroke-width="2"/><text x="685" y="491" fill="#263b47" font-size="23" font-family="sans-serif">乙持有后回应</text><text x="32" y="603" fill="#647581" font-size="21" font-family="sans-serif">检查：接收者是否一致？交接方向是否一致？反应发生在何时？</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="535" viewBox="0 0 900 535" role="img" aria-labelledby="title desc">
<title id="title">曝光不能同时保住超出窗口的两端</title><desc id="desc">记录范围固定时，同一场景跨度左移保护亮部却损失暗部，右移保护暗部却可能削波。改变场景反差才能缩短跨度。</desc>
<rect width="900" height="535" fill="#f6f3eb"/>
<text x="35" y="45" font-size="26" font-family="sans-serif" fill="#202b36">改变曝光，是在固定记录窗口里移动场景</text>
<text x="35" y="79" font-size="18" font-family="sans-serif" fill="#455463">示意只表达取舍，不对应具体相机挡数或曝光设置。</text>
<rect x="270" y="115" width="400" height="302" fill="#e2edea" stroke="#346b63" stroke-width="3"/>
<text x="360" y="145" font-size="21" font-family="sans-serif" fill="#254f49">可用的记录窗口</text>
<text x="55" y="200" font-size="21" font-family="sans-serif" fill="#202b36">降低曝光</text>
<rect x="210" y="178" width="430" height="34" fill="#5b8fa2"/>
<rect x="210" y="178" width="60" height="34" fill="#9f5051"/>
<text x="277" y="239" font-size="18" font-family="sans-serif" fill="#455463">暗部代价增加，给亮部留出空间</text>
<text x="55" y="295" font-size="21" font-family="sans-serif" fill="#202b36">提高曝光</text>
<rect x="320" y="273" width="430" height="34" fill="#5b8fa2"/>
<rect x="670" y="273" width="80" height="34" fill="#9f5051"/>
<text x="277" y="334" font-size="18" font-family="sans-serif" fill="#455463">暗部离开噪声底，亮部可能超出上限</text>
<text x="55" y="390" font-size="21" font-family="sans-serif" fill="#202b36">改变光比</text>
<rect x="320" y="368" width="285" height="34" fill="#5b8fa2"/>
<text x="277" y="450" font-size="18" font-family="sans-serif" fill="#455463">减弱窗外光／提高室内关键区域：缩短场景跨度</text>
<text x="260" y="480" font-size="18" font-family="sans-serif" fill="#202b36">暗端</text>
<line x1="310" y1="474" x2="620" y2="474" stroke="#202b36" stroke-width="2"/>
<polygon points="620,468 636,474 620,480" fill="#202b36"/>
<text x="650" y="480" font-size="18" font-family="sans-serif" fill="#202b36">亮端</text>
<text x="35" y="519" font-size="17" font-family="sans-serif" fill="#455463">蓝条＝场景明暗跨度　红段＝超出当前可用范围　非测量结果</text>
</svg>

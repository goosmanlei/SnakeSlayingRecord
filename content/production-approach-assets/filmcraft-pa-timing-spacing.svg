<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img"><title>相同时间，不同位置间距</title><desc>两条运动路线起点终点和耗时相同，上方等间距，下方先密后疏。每一个圆表示等时间间隔的一次采样。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#516277"/></marker></defs><rect width="1000" height="560" fill="#f7f5ef"/><text x="42" y="50" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="30" fill="#25394e" text-anchor="start">相同耗时与端点，不同速度变化</text><text x="42" y="86" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="20" fill="#25394e" text-anchor="start">每个圆都是等时间间隔的采样；数字表示出现顺序。未画出形体变化与承重。</text><text x="42" y="212" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="22" fill="#25394e" text-anchor="start">位置间距相等</text><line x1="275" y1="205" x2="940" y2="205" stroke="#516277" stroke-width="3" marker-end="url(#arrow)"/><circle cx="300" cy="205" r="10" fill="#368093" stroke="#f7f5ef" stroke-width="2"/><text x="300" y="177" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="18" fill="#25394e" text-anchor="middle">1</text><circle cx="400" cy="205" r="10" fill="#368093" stroke="#f7f5ef" stroke-width="2"/><text x="400" y="177" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="18" fill="#25394e" text-anchor="middle">2</text><circle cx="500" cy="205" r="10" fill="#368093" stroke="#f7f5ef" stroke-width="2"/><text x="500" y="177" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="18" fill="#25394e" text-anchor="middle">3</text><circle cx="600" cy="205" r="10" fill="#368093" stroke="#f7f5ef" stroke-width="2"/><text x="600" y="177" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="18" fill="#25394e" text-anchor="middle">4</text><circle cx="700" cy="205" r="10" fill="#368093" stroke="#f7f5ef" stroke-width="2"/><text x="700" y="177" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="18" fill="#25394e" text-anchor="middle">5</text><circle cx="800" cy="205" r="10" fill="#368093" stroke="#f7f5ef" stroke-width="2"/><text x="800" y="177" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="18" fill="#25394e" text-anchor="middle">6</text><circle cx="900" cy="205" r="10" fill="#368093" stroke="#f7f5ef" stroke-width="2"/><text x="900" y="177" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="18" fill="#25394e" text-anchor="middle">7</text><text x="300" y="254" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="18" fill="#25394e" text-anchor="middle">开始</text><text x="900" y="254" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="18" fill="#25394e" text-anchor="middle">结束</text><text x="42" y="367" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="22" fill="#25394e" text-anchor="start">先密后疏</text><line x1="275" y1="360" x2="940" y2="360" stroke="#516277" stroke-width="3" marker-end="url(#arrow)"/><circle cx="300" cy="360" r="10" fill="#368093" stroke="#f7f5ef" stroke-width="2"/><text x="300" y="332" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="18" fill="#25394e" text-anchor="middle">1</text><circle cx="326" cy="360" r="10" fill="#368093" stroke="#f7f5ef" stroke-width="2"/><text x="326" y="332" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="18" fill="#25394e" text-anchor="middle">2</text><circle cx="375" cy="360" r="10" fill="#368093" stroke="#f7f5ef" stroke-width="2"/><text x="375" y="332" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="18" fill="#25394e" text-anchor="middle">3</text><circle cx="455" cy="360" r="10" fill="#368093" stroke="#f7f5ef" stroke-width="2"/><text x="455" y="332" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="18" fill="#25394e" text-anchor="middle">4</text><circle cx="570" cy="360" r="10" fill="#368093" stroke="#f7f5ef" stroke-width="2"/><text x="570" y="332" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="18" fill="#25394e" text-anchor="middle">5</text><circle cx="720" cy="360" r="10" fill="#368093" stroke="#f7f5ef" stroke-width="2"/><text x="720" y="332" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="18" fill="#25394e" text-anchor="middle">6</text><circle cx="900" cy="360" r="10" fill="#368093" stroke="#f7f5ef" stroke-width="2"/><text x="900" y="332" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="18" fill="#25394e" text-anchor="middle">7</text><text x="300" y="409" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="18" fill="#25394e" text-anchor="middle">开始</text><text x="900" y="409" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="18" fill="#25394e" text-anchor="middle">结束</text><text x="42" y="463" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="22" fill="#25394e" text-anchor="start">上行：匀速位移示意。下行：起步较慢，随后每次采样移动得更远。</text><text x="42" y="503" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="20" fill="#25394e" text-anchor="start">同一秒内的位移不必平均分配；速度曲线要服务动作目的，而非自动代表情绪。</text></svg>
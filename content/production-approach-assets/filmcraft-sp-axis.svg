<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660"><title>轴线服务于关系可读性</title><desc>原创教学示意；不代表真实影片、拍摄参数或观众实验。橙色与蓝色区分人物。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 Z" fill="#263b47"/></marker></defs><rect x="0" y="0" width="960" height="660" rx="9" fill="#f7f4ee" stroke="#f7f4ee" stroke-width="2"/><text x="32" y="47" fill="#263b47" font-size="29" font-family="sans-serif">轴线服务于关系可读性</text><text x="32" y="85" fill="#647581" font-size="21" font-family="sans-serif">俯视平面图：甲乙不动，比较机位所在侧。</text><rect x="28" y="111" width="423" height="391" rx="9" fill="white" stroke="#cbd3d4" stroke-width="2"/><line x1="63" y1="279" x2="420" y2="279" stroke="#647581" stroke-width="3" stroke-dasharray="9 7"/><circle cx="133" cy="279" r="28" fill="#c66d36"/><circle cx="353" cy="279" r="28" fill="#357e9a"/><text x="119" y="287" fill="white" font-size="22" font-family="sans-serif">甲</text><text x="339" y="287" fill="white" font-size="22" font-family="sans-serif">乙</text><rect x="83" y="400" width="36" height="27" rx="9" fill="#263b47" stroke="#263b47" stroke-width="2"/><text x="92" y="422" fill="white" font-size="20" font-family="sans-serif">A</text><line x1="101" y1="394" x2="237" y2="299" stroke="#647581" stroke-width="3" marker-end="url(#arrow)"/><rect x="351" y="400" width="36" height="27" rx="9" fill="#263b47" stroke="#263b47" stroke-width="2"/><text x="360" y="422" fill="white" font-size="20" font-family="sans-serif">B</text><line x1="369" y1="394" x2="237" y2="299" stroke="#647581" stroke-width="3" marker-end="url(#arrow)"/><rect x="219" y="149" width="36" height="27" rx="9" fill="#263b47" stroke="#263b47" stroke-width="2"/><text x="228" y="171" fill="white" font-size="20" font-family="sans-serif">C</text><line x1="237" y1="183" x2="237" y2="253" stroke="#647581" stroke-width="3" marker-end="url(#arrow)"/><text x="47" y="483" fill="#263b47" font-size="21" font-family="sans-serif">A、B 同侧；C 换到另一侧</text><text x="502" y="140" fill="#263b47" font-size="21" font-family="sans-serif">示意银幕顺序（非精确镜头投影）</text><rect x="502" y="164" width="422" height="143" rx="9" fill="white" stroke="#cbd3d4" stroke-width="2"/><g transform="translate(595 232) scale(0.67)"><circle cx="0" cy="-43" r="14" fill="#c66d36"/><path d="M-20,-22 L20,-22 L25,20 L12,20 L12,63 L-2,63 L-2,21 L-11,21 L-11,63 L-25,63 L-25,16 Z" fill="#c66d36"/></g><g transform="translate(825 232) scale(0.67)"><circle cx="0" cy="-43" r="14" fill="#357e9a"/><path d="M-20,-22 L20,-22 L25,20 L12,20 L12,63 L-2,63 L-2,21 L-11,21 L-11,63 L-25,63 L-25,16 Z" fill="#357e9a"/></g><line x1="631" y1="223" x2="779" y2="223" stroke="#647581" stroke-width="3" stroke-dasharray="9 7"/><text x="518" y="334" fill="#263b47" font-size="22" font-family="sans-serif">A / B 同侧覆盖</text><rect x="502" y="348" width="422" height="143" rx="9" fill="white" stroke="#cbd3d4" stroke-width="2"/><g transform="translate(595 416) scale(0.67)"><circle cx="0" cy="-43" r="14" fill="#357e9a"/><path d="M-20,-22 L20,-22 L25,20 L12,20 L12,63 L-2,63 L-2,21 L-11,21 L-11,63 L-25,63 L-25,16 Z" fill="#357e9a"/></g><g transform="translate(825 416) scale(0.67)"><circle cx="0" cy="-43" r="14" fill="#c66d36"/><path d="M-20,-22 L20,-22 L25,20 L12,20 L12,63 L-2,63 L-2,21 L-11,21 L-11,63 L-25,63 L-25,16 Z" fill="#c66d36"/></g><line x1="631" y1="407" x2="779" y2="407" stroke="#647581" stroke-width="3" stroke-dasharray="9 7"/><text x="518" y="518" fill="#263b47" font-size="22" font-family="sans-serif">C 越轴后的画面</text><text x="32" y="558" fill="#263b47" font-size="22" font-family="sans-serif">重新定向：交代连续跨越过程，或用关系画面建立新位置。</text><text x="32" y="602" fill="#647581" font-size="21" font-family="sans-serif">有意越轴也可成立；追逐、交接需要辨认方向时，代价更高。</text></svg>
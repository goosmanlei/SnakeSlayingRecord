<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680"><title>焦距改变范围，机位改变透视</title><desc>原创教学示意；不代表真实影片、拍摄参数或观众实验。橙色与蓝色区分人物。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 Z" fill="#263b47"/></marker></defs><rect x="0" y="0" width="960" height="680" rx="9" fill="#f7f4ee" stroke="#f7f4ee" stroke-width="2"/><text x="32" y="47" fill="#263b47" font-size="29" font-family="sans-serif">焦距改变范围，机位改变透视</text><text x="32" y="85" fill="#647581" font-size="21" font-family="sans-serif">条件：两人等高、间距固定；简化针孔投影，不模拟镜头畸变。</text><text x="35" y="125" fill="#263b47" font-size="24" font-family="sans-serif">观察位置</text><text x="535" y="125" fill="#263b47" font-size="24" font-family="sans-serif">画面中的相对大小</text><rect x="25" y="150" width="435" height="112" rx="9" fill="white" stroke="#cbd3d4" stroke-width="2"/><text x="40" y="241" fill="#263b47" font-size="20" font-family="sans-serif">近机位：前后距离 2 与 4</text><rect x="55" y="175" width="24" height="19" rx="9" fill="#263b47" stroke="#263b47" stroke-width="2"/><line x1="90" y1="184" x2="420" y2="184" stroke="#647581" stroke-width="3"/><circle cx="160" cy="184" r="12" fill="#c66d36"/><circle cx="330" cy="184" r="12" fill="#357e9a"/><rect x="520" y="150" width="405" height="112" rx="9" fill="white" stroke="#cbd3d4" stroke-width="2"/><g transform="translate(650 193) scale(0.72)"><circle cx="0" cy="-43" r="14" fill="#c66d36"/><path d="M-20,-22 L20,-22 L25,20 L12,20 L12,63 L-2,63 L-2,21 L-11,21 L-11,63 L-25,63 L-25,16 Z" fill="#c66d36"/></g><g transform="translate(790 215.5) scale(0.36)"><circle cx="0" cy="-43" r="14" fill="#357e9a"/><path d="M-20,-22 L20,-22 L25,20 L12,20 L12,63 L-2,63 L-2,21 L-11,21 L-11,63 L-25,63 L-25,16 Z" fill="#357e9a"/></g><text x="821" y="210" fill="#263b47" font-size="19" font-family="sans-serif">1 : 0.5</text><rect x="25" y="289" width="435" height="112" rx="9" fill="white" stroke="#cbd3d4" stroke-width="2"/><text x="40" y="380" fill="#263b47" font-size="20" font-family="sans-serif">原位置裁切：比例不变</text><rect x="55" y="314" width="24" height="19" rx="9" fill="#263b47" stroke="#263b47" stroke-width="2"/><line x1="90" y1="323" x2="420" y2="323" stroke="#647581" stroke-width="3"/><circle cx="160" cy="323" r="12" fill="#c66d36"/><circle cx="330" cy="323" r="12" fill="#357e9a"/><rect x="520" y="289" width="405" height="112" rx="9" fill="white" stroke="#cbd3d4" stroke-width="2"/><g transform="translate(650 332) scale(0.72)"><circle cx="0" cy="-43" r="14" fill="#c66d36"/><path d="M-20,-22 L20,-22 L25,20 L12,20 L12,63 L-2,63 L-2,21 L-11,21 L-11,63 L-25,63 L-25,16 Z" fill="#c66d36"/></g><g transform="translate(790 354.5) scale(0.36)"><circle cx="0" cy="-43" r="14" fill="#357e9a"/><path d="M-20,-22 L20,-22 L25,20 L12,20 L12,63 L-2,63 L-2,21 L-11,21 L-11,63 L-25,63 L-25,16 Z" fill="#357e9a"/></g><text x="821" y="349" fill="#263b47" font-size="19" font-family="sans-serif">1 : 0.5</text><rect x="25" y="428" width="435" height="112" rx="9" fill="white" stroke="#cbd3d4" stroke-width="2"/><text x="40" y="519" fill="#263b47" font-size="20" font-family="sans-serif">后退后重取景：距离 8 与 10</text><rect x="55" y="453" width="24" height="19" rx="9" fill="#263b47" stroke="#263b47" stroke-width="2"/><line x1="90" y1="462" x2="420" y2="462" stroke="#647581" stroke-width="3"/><circle cx="345" cy="462" r="12" fill="#c66d36"/><circle cx="411" cy="462" r="12" fill="#357e9a"/><rect x="520" y="428" width="405" height="112" rx="9" fill="white" stroke="#cbd3d4" stroke-width="2"/><g transform="translate(650 471) scale(0.72)"><circle cx="0" cy="-43" r="14" fill="#c66d36"/><path d="M-20,-22 L20,-22 L25,20 L12,20 L12,63 L-2,63 L-2,21 L-11,21 L-11,63 L-25,63 L-25,16 Z" fill="#c66d36"/></g><g transform="translate(790 480.0) scale(0.576)"><circle cx="0" cy="-43" r="14" fill="#357e9a"/><path d="M-20,-22 L20,-22 L25,20 L12,20 L12,63 L-2,63 L-2,21 L-11,21 L-11,63 L-25,63 L-25,16 Z" fill="#357e9a"/></g><text x="821" y="488" fill="#263b47" font-size="19" font-family="sans-serif">1 : 0.8</text><text x="32" y="629" fill="#647581" font-size="21" font-family="sans-serif">结论：同位置改取景不改比例；改变观察距离才改变透视关系。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660"><title>信息次序改变观众的提问</title><desc>原创教学示意；不代表真实影片、拍摄参数或观众实验。橙色与蓝色区分人物。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 Z" fill="#263b47"/></marker></defs><rect x="0" y="0" width="960" height="660" rx="9" fill="#f7f4ee" stroke="#f7f4ee" stroke-width="2"/><text x="32" y="47" fill="#263b47" font-size="29" font-family="sans-serif">信息次序改变观众的提问</text><text x="32" y="84" fill="#647581" font-size="21" font-family="sans-serif">同一件事：有人接近危险；只改变观众得到证据的次序</text><text x="35" y="179" fill="#263b47" font-size="24" font-family="sans-serif">等待将来</text><rect x="210" y="125" width="211" height="95" rx="9" fill="#edf3f4" stroke="#cbd3d4" stroke-width="2"/><text x="222" y="180" fill="#263b47" font-size="21" font-family="sans-serif">危险已被看见</text><line x1="423" y1="172" x2="444" y2="172" stroke="#263b47" stroke-width="3" marker-end="url(#arrow)"/><rect x="450" y="125" width="211" height="95" rx="9" fill="white" stroke="#cbd3d4" stroke-width="2"/><text x="462" y="180" fill="#263b47" font-size="21" font-family="sans-serif">人物继续接近</text><line x1="663" y1="172" x2="684" y2="172" stroke="#263b47" stroke-width="3" marker-end="url(#arrow)"/><rect x="690" y="125" width="211" height="95" rx="9" fill="#edf3f4" stroke="#cbd3d4" stroke-width="2"/><text x="702" y="180" fill="#263b47" font-size="21" font-family="sans-serif">会及时发现吗？</text><text x="35" y="324" fill="#263b47" font-size="24" font-family="sans-serif">追问过去</text><rect x="210" y="270" width="211" height="95" rx="9" fill="#edf3f4" stroke="#cbd3d4" stroke-width="2"/><text x="222" y="325" fill="#263b47" font-size="21" font-family="sans-serif">先看见事故</text><line x1="423" y1="317" x2="444" y2="317" stroke="#263b47" stroke-width="3" marker-end="url(#arrow)"/><rect x="450" y="270" width="211" height="95" rx="9" fill="white" stroke="#cbd3d4" stroke-width="2"/><text x="462" y="325" fill="#263b47" font-size="21" font-family="sans-serif">追查谁曾接近</text><line x1="663" y1="317" x2="684" y2="317" stroke="#263b47" stroke-width="3" marker-end="url(#arrow)"/><rect x="690" y="270" width="211" height="95" rx="9" fill="#edf3f4" stroke="#cbd3d4" stroke-width="2"/><text x="702" y="325" fill="#263b47" font-size="21" font-family="sans-serif">补出危险证据</text><text x="35" y="469" fill="#263b47" font-size="24" font-family="sans-serif">修正预期</text><rect x="210" y="415" width="211" height="95" rx="9" fill="#edf3f4" stroke="#cbd3d4" stroke-width="2"/><text x="222" y="470" fill="#263b47" font-size="21" font-family="sans-serif">接近看似安全</text><line x1="423" y1="462" x2="444" y2="462" stroke="#263b47" stroke-width="3" marker-end="url(#arrow)"/><rect x="450" y="415" width="211" height="95" rx="9" fill="white" stroke="#cbd3d4" stroke-width="2"/><text x="462" y="470" fill="#263b47" font-size="21" font-family="sans-serif">危险突然显露</text><line x1="663" y1="462" x2="684" y2="462" stroke="#263b47" stroke-width="3" marker-end="url(#arrow)"/><rect x="690" y="415" width="211" height="95" rx="9" fill="#edf3f4" stroke="#cbd3d4" stroke-width="2"/><text x="702" y="470" fill="#263b47" font-size="21" font-family="sans-serif">重读先前线索</text><text x="32" y="604" fill="#647581" font-size="21" font-family="sans-serif">读图：框＝一次信息交付；箭头＝观看顺序，不是物理时间。</text></svg>
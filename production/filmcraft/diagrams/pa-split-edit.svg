<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img"><title>画面切换与声音交接可以不在同一时刻</title><desc>三个时间线示意同步切换、声音B先入的J cut、声音A后出的L cut。嘴部可见部分与归属声音保持同步。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#516277"/></marker></defs><rect width="1000" height="560" fill="#f7f5ef"/><text x="42" y="45" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="28" fill="#25394e" text-anchor="start">画面切换与声音交接，可以不在同一时刻</text><text x="42" y="78" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="20" fill="#25394e" text-anchor="start">A、B 表示相邻场景或说话对象；宽度仅供比较，不规定时长。</text><text x="42" y="144" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="21" fill="#25394e" text-anchor="start">同步切换</text><text x="267" y="143" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="20" fill="#25394e" text-anchor="start">画面</text><rect x="325" y="116" width="265" height="40" rx="9" fill="#abc9d5"/><rect x="590" y="116" width="345" height="40" rx="9" fill="#e9bd94"/><text x="457.5" y="143" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="21" fill="#25394e" text-anchor="middle">A</text><text x="762.5" y="143" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="21" fill="#25394e" text-anchor="middle">B</text><text x="267" y="196" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="20" fill="#25394e" text-anchor="start">声音</text><rect x="325" y="169" width="265" height="40" rx="9" fill="#abc9d5"/><rect x="590" y="169" width="345" height="40" rx="9" fill="#e9bd94"/><text x="457.5" y="196" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="21" fill="#25394e" text-anchor="middle">A</text><text x="762.5" y="196" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="21" fill="#25394e" text-anchor="middle">B</text><line x1="590" y1="108" x2="590" y2="214" stroke="#425264" stroke-width="2" stroke-dasharray="5 5"/><text x="42" y="274" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="21" fill="#25394e" text-anchor="start">J-cut：B 声先入</text><text x="267" y="273" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="20" fill="#25394e" text-anchor="start">画面</text><rect x="325" y="246" width="265" height="40" rx="9" fill="#abc9d5"/><rect x="590" y="246" width="345" height="40" rx="9" fill="#e9bd94"/><text x="457.5" y="273" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="21" fill="#25394e" text-anchor="middle">A</text><text x="762.5" y="273" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="21" fill="#25394e" text-anchor="middle">B</text><text x="267" y="326" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="20" fill="#25394e" text-anchor="start">声音</text><rect x="325" y="299" width="165" height="40" rx="9" fill="#abc9d5"/><rect x="490" y="299" width="445" height="40" rx="9" fill="#e9bd94"/><text x="407.5" y="326" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="21" fill="#25394e" text-anchor="middle">A</text><text x="712.5" y="326" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="21" fill="#25394e" text-anchor="middle">B</text><line x1="590" y1="238" x2="590" y2="344" stroke="#425264" stroke-width="2" stroke-dasharray="5 5"/><text x="42" y="404" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="21" fill="#25394e" text-anchor="start">L-cut：A 声后出</text><text x="267" y="403" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="20" fill="#25394e" text-anchor="start">画面</text><rect x="325" y="376" width="265" height="40" rx="9" fill="#abc9d5"/><rect x="590" y="376" width="345" height="40" rx="9" fill="#e9bd94"/><text x="457.5" y="403" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="21" fill="#25394e" text-anchor="middle">A</text><text x="762.5" y="403" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="21" fill="#25394e" text-anchor="middle">B</text><text x="267" y="456" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="20" fill="#25394e" text-anchor="start">声音</text><rect x="325" y="429" width="365" height="40" rx="9" fill="#abc9d5"/><rect x="690" y="429" width="245" height="40" rx="9" fill="#e9bd94"/><text x="507.5" y="456" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="21" fill="#25394e" text-anchor="middle">A</text><text x="812.5" y="456" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="21" fill="#25394e" text-anchor="middle">B</text><line x1="590" y1="368" x2="590" y2="474" stroke="#425264" stroke-width="2" stroke-dasharray="5 5"/><text x="42" y="530" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="21" fill="#25394e" text-anchor="start">边界分离 ≠ 嘴部不同步。画面转向听者时，说话者的声音可以继续。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img"><title>同一个信号，两种行动策略</title><desc>外部信号之后可以暴露疑问，也可以掩饰疑问。流程只表达先后与行动逻辑，不规定帧数。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#516277"/></marker></defs><rect width="1000" height="560" fill="#f7f5ef"/><text x="42" y="50" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="30" fill="#25394e" text-anchor="start">同一个信号，两种行动策略</text><text x="42" y="85" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="20" fill="#25394e" text-anchor="start">示意条件：人物听见异常，但尚不确定来源。箭头表示先后，不是固定帧数。</text><rect x="42" y="170" width="180" height="240" rx="9" fill="#dfe7e8"/><text x="132" y="235" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="25" fill="#25394e" text-anchor="middle">外部信号</text><text x="132" y="282" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="22" fill="#25394e" text-anchor="middle">异常声响</text><text x="132" y="327" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="20" fill="#25394e" text-anchor="middle">角色接收到</text><text x="280" y="152" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="22" fill="#25394e" text-anchor="start">暴露疑问</text><line x1="226" y1="205" x2="282" y2="205" stroke="#516277" stroke-width="3" marker-end="url(#arrow)"/><rect x="290" y="170" width="195" height="78" rx="9" fill="#e0ebde"/><text x="387.5" y="216" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="22" fill="#25394e" text-anchor="middle">目光寻找</text><line x1="488" y1="208" x2="512" y2="208" stroke="#516277" stroke-width="3" marker-end="url(#arrow)"/><rect x="515" y="170" width="195" height="78" rx="9" fill="#e0ebde"/><text x="612.5" y="216" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="22" fill="#25394e" text-anchor="middle">身体转向</text><line x1="713" y1="208" x2="737" y2="208" stroke="#516277" stroke-width="3" marker-end="url(#arrow)"/><rect x="740" y="170" width="195" height="78" rx="9" fill="#e0ebde"/><text x="837.5" y="216" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="22" fill="#25394e" text-anchor="middle">走近确认</text><text x="280" y="312" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="22" fill="#25394e" text-anchor="start">掩饰疑问</text><line x1="226" y1="365" x2="282" y2="365" stroke="#516277" stroke-width="3" marker-end="url(#arrow)"/><rect x="290" y="330" width="195" height="78" rx="9" fill="#f4dfcf"/><text x="387.5" y="376" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="22" fill="#25394e" text-anchor="middle">短暂留意</text><line x1="488" y1="368" x2="512" y2="368" stroke="#516277" stroke-width="3" marker-end="url(#arrow)"/><rect x="515" y="330" width="195" height="78" rx="9" fill="#f4dfcf"/><text x="612.5" y="376" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="22" fill="#25394e" text-anchor="middle">身体继续原事</text><line x1="713" y1="368" x2="737" y2="368" stroke="#516277" stroke-width="3" marker-end="url(#arrow)"/><rect x="740" y="330" width="195" height="78" rx="9" fill="#f4dfcf"/><text x="837.5" y="376" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="22" fill="#25394e" text-anchor="middle">借机再次观察</text><text x="42" y="475" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="22" fill="#25394e" text-anchor="start">相同表情不能决定相同行动；目标、关系与隐瞒需要决定后续策略。</text><text x="42" y="514" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-size="20" fill="#25394e" text-anchor="start">反例：反射性躲闪可以先于有意识判断。应按角色与风格改变先后及幅度。</text></svg>
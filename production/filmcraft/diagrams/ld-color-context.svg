<svg xmlns="http://www.w3.org/2000/svg" width="900" height="665" viewBox="0 0 900 665" role="img" aria-labelledby="title desc">
<title id="title">颜色上下文与色彩脚本</title><desc id="desc">上部两块相同颜色的小方块放在深浅背景中。下部四幅原创节点从稳定、失衡、选择到余波，用色面积和明暗关系变化表达组织方式，非固定情绪色典。</desc>
<rect width="900" height="665" fill="#f6f3eb"/>
<text x="35" y="43" font-size="26" font-family="sans-serif" fill="#202b36">颜色先看关系，再看色号</text>
<rect x="80" y="82" width="320" height="170" fill="#203743"/>
<rect x="500" y="82" width="320" height="170" fill="#e3d8bc"/>
<rect x="205" y="132" width="70" height="70" fill="#729590"/>
<rect x="625" y="132" width="70" height="70" fill="#729590"/>
<text x="140" y="287" font-size="20" font-family="sans-serif" fill="#202b36">两块小方块均为 #729590；遮住背景后再比较。</text>
<line x1="35" y1="315" x2="865" y2="315" stroke="#c4c7c8"/>
<text x="35" y="360" font-size="25" font-family="sans-serif" fill="#202b36">色彩脚本：把连续关系压缩到同一视野</text>
<rect x="40" y="397" width="185" height="134" fill="#516d73"/>
<rect x="65" y="431" width="137" height="85" fill="#879991"/>
<circle cx="135" cy="458" r="16" fill="#ddb36d"/>
<rect x="111" y="474" width="48" height="42" fill="#ae764e"/>
<rect x="252" y="397" width="185" height="134" fill="#263f50"/>
<polygon points="252,397 309,397 367,531 325,531" fill="#90706f"/>
<circle cx="370" cy="474" r="12" fill="#bf9568"/>
<rect x="350" y="486" width="40" height="35" fill="#75524e"/>
<rect x="464" y="397" width="185" height="134" fill="#213e4f"/>
<rect x="540" y="397" width="36" height="134" fill="#e0b36e"/>
<circle cx="558" cy="458" r="16" fill="#e9cda0"/>
<rect x="535" y="474" width="47" height="42" fill="#9f694d"/>
<rect x="676" y="397" width="185" height="134" fill="#7b9695"/>
<rect x="695" y="431" width="144" height="85" fill="#aab7a5"/>
<circle cx="769" cy="458" r="16" fill="#ddb36d"/>
<rect x="745" y="474" width="48" height="42" fill="#ae764e"/>
<text x="110" y="563" font-size="21" font-family="sans-serif" fill="#202b36">稳定</text>
<text x="322" y="563" font-size="21" font-family="sans-serif" fill="#202b36">失衡</text>
<text x="534" y="563" font-size="21" font-family="sans-serif" fill="#202b36">选择</text>
<text x="746" y="563" font-size="21" font-family="sans-serif" fill="#202b36">余波</text>
<text x="35" y="604" font-size="18" font-family="sans-serif" fill="#455463">比较色块面积、明暗范围、人物与环境的差异，以及强调色何时出现。</text>
<text x="35" y="637" font-size="18" font-family="sans-serif" fill="#455463">原创练习，不对应任何影片；节点名称不表示颜色具有固定情绪含义。</text>
</svg>

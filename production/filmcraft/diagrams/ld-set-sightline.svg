<svg xmlns="http://www.w3.org/2000/svg" width="900" height="630" viewBox="0 0 900 630" role="img" aria-labelledby="title desc">
<title id="title">用遮挡控制角色和观众的信息差</title><desc id="desc">原创房间平面图。左侧柜子没有挡住角色A的视线，右侧柜子挡住A至物件的路径，但摄影机从下方仍能看到物件。需另验高度。</desc>
<rect width="900" height="630" fill="#f6f3eb"/>
<text x="35" y="45" font-size="26" font-family="sans-serif" fill="#202b36">同一物件：角色看不到，观众可以看到</text>
<text x="35" y="80" font-size="18" font-family="sans-serif" fill="#455463">平面局部示意；人物眼高、柜高和摄影机高度需要另行核对。</text>
<text x="88" y="126" font-size="23" font-family="sans-serif" fill="#202b36">A 角色也能看见</text>
<text x="526" y="126" font-size="23" font-family="sans-serif" fill="#202b36">B 用柜体形成遮挡</text>
<rect x="40" y="150" width="385" height="340" fill="#e7e5dc" stroke="#68767a" stroke-width="4"/>
<rect x="475" y="150" width="385" height="340" fill="#e7e5dc" stroke="#68767a" stroke-width="4"/>
<circle cx="105" cy="260" r="22" fill="#ad624e"/>
<circle cx="540" cy="260" r="22" fill="#ad624e"/>
<text x="97" y="267" font-size="20" font-family="sans-serif" fill="#ffffff">A</text>
<text x="532" y="267" font-size="20" font-family="sans-serif" fill="#ffffff">A</text>
<rect x="334" y="247" width="28" height="28" fill="#c7932d"/>
<rect x="769" y="247" width="28" height="28" fill="#c7932d"/>
<line x1="128" y1="260" x2="334" y2="260" stroke="#ad624e" stroke-width="3" stroke-dasharray="7 5"/>
<line x1="563" y1="260" x2="646" y2="260" stroke="#ad624e" stroke-width="3" stroke-dasharray="7 5"/>
<rect x="205" y="341" width="45" height="88" fill="#606463"/>
<rect x="646" y="221" width="45" height="112" fill="#606463"/>
<text x="211" y="390" font-size="19" font-family="sans-serif" fill="#ffffff">柜</text>
<text x="653" y="281" font-size="19" font-family="sans-serif" fill="#ffffff">柜</text>
<polygon points="333,452 363,452 348,426" fill="#26718b"/>
<polygon points="768,452 798,452 783,426" fill="#26718b"/>
<line x1="348" y1="426" x2="348" y2="280" stroke="#26718b" stroke-width="3"/>
<line x1="783" y1="426" x2="783" y2="280" stroke="#26718b" stroke-width="3"/>
<text x="285" y="475" font-size="18" font-family="sans-serif" fill="#202b36">摄影机</text>
<text x="720" y="475" font-size="18" font-family="sans-serif" fill="#202b36">摄影机</text>
<text x="42" y="535" font-size="18" font-family="sans-serif" fill="#202b36">红色虚线＝角色视线　蓝线＝摄影机观察方向　黄色方块＝关键物件</text>
<text x="42" y="576" font-size="19" font-family="sans-serif" fill="#202b36">设计从“谁此刻知道什么”反推，柜子的位置因此有叙事作用。</text>
<text x="42" y="609" font-size="17" font-family="sans-serif" fill="#455463">原创关系图，不是本剧场景图；未定义全场机位覆盖或完整动线。</text>
</svg>
